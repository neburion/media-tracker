  .picks .pick{height:var(--tap);padding:0 14px}
  .pip{height:var(--tap)}
  .pager .step{height:var(--tap)}
  .drawer select,.drawer .chip{height:44px}
  .switch button{height:var(--tap)}
  .list button{padding:11px 8px}
  /* The cover is the obvious target; the title under it is a courtesy, but a
     two-line clamp can be 18px tall, so give it something to hit. */
  .name{padding:3px 0 5px}

  /* iOS Safari zooms the whole page when a focused field is under 16px, and
     then leaves you scrolled sideways into a layout that was fine. Range
     inputs are exempt — you never type into one. */
  .drawer select,.field textarea,dialog select,dialog input{font-size:16px}
}

/* The dialog's ground is the page's, not a card's, for the same reason the
   editor's is: the fields inside it are the cards. It was the last surface in
   the app still laid out like a web form — three labelled boxes stacked on a
   grey panel — while the sheet two hundred lines up had been a grouped list
   for a week. */
dialog{border:1px solid var(--material-edge);border-radius:var(--r-xl);background:var(--paper);
  color:var(--ink);padding:0;width:min(400px,calc(100vw - 28px));box-shadow:var(--shadow)}
dialog::backdrop{background:rgba(0,0,0,.6)}
dialog form{padding:20px 16px 16px}
dialog h2{font:var(--type-title3);font-family:Lit,Georgia,serif;
  margin:0 0 18px;padding:0 4px}

/* ── alternative titles ─────────────────────────────────────────────────
   A column of plain text boxes, one per name, each with its own remove. Not
   chips-on-enter: these are long, they contain punctuation, and half of them
   are romanisations you want to paste and then fix a letter of. */
.alts{display:flex;flex-direction:column;gap:6px;margin-bottom:6px}
.alts:empty{margin-bottom:0}
.altrow{display:flex;gap:8px}
.altrow input{flex:1;min-width:0}
.altrow .ico{flex:none;width:40px;height:40px;border:1px solid transparent;
  border-radius:var(--r-sm);background:var(--paper)}

/* ── the cover picker ───────────────────────────────────────────────────
   Playnite's shape: a button next to the artwork field opens a search seeded
   with the title, you look at a grid, you click one. It asks six catalogues
   at once and merges them, having started as one web image search and been
   rebuilt the week DuckDuckGo started answering 403 to this address. Under
   the search box sits a strip of every name the series is known by, because
   which name the art is filed under is not knowable in advance. */
.pickbar{display:flex;gap:8px}
.pickbar input{flex:1;min-width:0}
.pickbar .btn{flex:none;padding:0 14px;height:40px}
@media (max-width:640px){.pickbar .btn{height:var(--tap)}}

#art{border:0;padding:0;background:none;width:min(920px,calc(100vw - 24px));
  max-width:none}
#art .wrap{background:var(--card);border:1px solid transparent;
  border-radius:var(--r-xl);display:flex;flex-direction:column;
  max-height:min(86dvh,900px)}
#art .head{display:flex;gap:8px;align-items:center;padding:14px 16px;
  border-bottom:1px solid var(--rule-2)}
#art .head input{flex:1;min-width:0;height:38px;border:1px solid transparent;
  background:var(--fill-3);border-radius:var(--r-md);padding:0 12px;font-size:16px;
  outline:none}
#art .head input:focus{border-color:var(--a7)}
#art .names{display:flex;flex-wrap:wrap;gap:6px;padding:0 16px 12px;
  border-bottom:1px solid var(--rule)}
/* `display:flex` on an id-qualified selector outranks the `display:none` the
   browser gives [hidden], so a series with no alternative names was still
   getting the empty strip and its border. Say it explicitly. */
#art .names[hidden]{display:none}
#art .names .name{height:30px;padding:0 12px;border:1px solid transparent;
  background:var(--fill-3);color:var(--ink-2);border-radius:var(--r-md);
  font:var(--type-footnote);
  max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#art .names .name:hover{background:var(--fill-2);color:var(--ink)}
/* Chosen is a raised surface, the same as every other chosen thing here — not
   a ring, which was the one selection style left over from the old scheme. */
#art .names .name[aria-pressed=true]{background:var(--sel);color:var(--ink);
  font-weight:600}
#art .body{flex:1;overflow-y:auto;padding:14px 16px 18px}
#art .shots{display:grid;gap:12px;
  grid-template-columns:repeat(auto-fill,minmax(120px,1fr))}
@media (max-width:640px){#art .shots{grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:9px}}
/* Each tile is the shape the shelf will draw it in, so what you pick is what
   you get rather than a surprise after saving. */
.shot{position:relative;padding:0;border:1px solid transparent;background:var(--fill-4);
  border-radius:var(--r-lg);overflow:hidden;aspect-ratio:2/3;cursor:pointer}
.shot img{width:100%;height:100%;object-fit:cover;display:block}
.shot:hover{border-color:var(--a7)}
.shot em{position:absolute;left:0;right:0;bottom:0;font-style:normal;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
  font-family:Mono,monospace;font-size:10px;color:#fff;padding:10px 5px 4px;
  background:linear-gradient(transparent,rgba(0,0,0,.85))}
.shot.on{border-color:var(--a9);box-shadow:0 0 0 2px var(--a9)}
/* `.foot` is the shelf card's footer — absolutely positioned at the bottom of
   a cover with a gradient behind it — and the picker borrowed the class name
   without meaning to borrow that. So the dialog's footer floated over the
   scrolling grid, and the note underneath the More button was being read off
   whatever thumbnail happened to be behind it. It is a row in the column, like
   the head it mirrors. */
#art .foot{position:static;display:flex;gap:8px;align-items:center;
  padding:12px 16px;background:var(--card);border-radius:0 0 var(--r-xl) var(--r-xl);
  border-top:1px solid var(--rule-2)}
#art .note{font-size:12px;color:var(--ink-3);margin-right:auto}
dialog .sheet-foot{border-top:0;padding:8px 0 0;background:none;gap:10px}
dialog .sheet-foot .btn{flex:1;height:48px;border-radius:var(--r-lg);
  font:var(--type-headline)}
dialog .sheet-foot .btn.primary{background:var(--a9);color:#fff}
</style>
</head>
<body>

<header id="head" hidden>
  <div class="bar">
    <button class="ico out" data-act="home" title="Both trackers" aria-label="Both trackers"><svg viewBox="0 0 24 24"><path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/></svg></button>
    <h1 id="h1">Media Tracker</h1>
    <div class="tally">
      <span><b id="t-count">0</b> <i>titles</i></span>
      <span><b id="t-ch">0</b> <i id="t-ch-word">chapters</i></span>
    </div>
    <button class="ico" data-act="filter" title="Filters" aria-label="Filters"><svg viewBox="0 0 24 24"><path d="M10 18h4v-2h-4v2zM3 6v2h18V6H3zm3 7h12v-2H6v2z"/></svg></button>
    <button class="ico" data-act="edit" title="Group Edit" aria-label="Group Edit"><svg viewBox="0 0 24 24"><path d="M3 17.25V21h3.75L17.81 9.94l-3.75-3.75L3 17.25zm17.71-10.21a1 1 0 0 0 0-1.41l-2.34-2.34a1 1 0 0 0-1.41 0l-1.83 1.83 3.75 3.75 1.83-1.83z"/></svg></button>
    <button class="ico" data-view="solo" title="Group Sort" aria-label="Group Sort, one at a time"><svg viewBox="0 0 24 24"><path d="M4 6H2v14a2 2 0 0 0 2 2h14v-2H4V6zm16-4H8a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V4a2 2 0 0 0-2-2zm0 14H8V4h12v12z"/></svg></button>
    <button class="ico" data-view="stats" title="Statistics" aria-label="Statistics"><svg viewBox="0 0 24 24"><path d="M4 9h4v11H4zM10 4h4v16h-4zM16 13h4v7h-4z"/></svg></button>
    <button class="ico" data-act="new" title="Add a series" aria-label="Add a series"><svg viewBox="0 0 24 24"><path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z"/></svg></button>
    <!-- Only while selecting, and it is the only thing in the bar then. -->
    <button class="tbtn go" data-act="done" hidden>Done</button>
  </div>

  <div class="seek">
    <svg viewBox="0 0 24 24"><path d="M15.5 14h-.79l-.28-.27C15.41 12.59 16 11.11 16 9.5 16 5.91 13.09 3 9.5 3S3 5.91 3 9.5 5.91 16 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg>
    <!-- Deliberately type=text. A type=search input draws the browser's own
         clear button inside itself, which sat next to this one and gave the
         bar two ✕s that did the same thing. This is the one that is styled
         like the rest of the app and the one the code knows how to hide. -->
    <input id="q" type="text" placeholder="Search titles, settings and genres" autocomplete="off" spellcheck="false">
    <button id="q-clear" hidden aria-label="Clear search">✕</button>
  </div>

  <div class="drawer" id="drawer">
    <div class="filt"><label class="lbl" for="f-sort">Order</label>
      <select id="f-sort">
        <option value="updated">Recently touched</option>
        <option value="rating">Highest rated</option>
        <option value="chapter">Furthest along</option>
        <option value="title">Title A–Z</option>
      </select></div>
    <div class="filt"><label class="lbl" for="f-type">Type</label>
      <select id="f-type" title="What kind of thing it is"><option value="">Any</option></select></div>
    <div class="filt"><label class="lbl" for="f-pub">Publication status</label>
      <select id="f-pub" title="Whether the author is still writing it"><option value="">Any</option></select></div>
    <div class="filt"><label class="lbl" for="f-seen">Checked</label>
      <select id="f-seen" title="Whether you have been through it yourself">
        <option value="">Any</option>
        <option value="no">Not yet</option>
        <option value="yes">Checked</option>
      </select></div>
    <div class="filt"><label class="lbl" for="f-setting">Setting</label>
      <select id="f-setting" title="Where it takes place"><option value="">Any</option></select></div>
    <div class="filt"><label class="lbl" for="f-genre">Genre</label>
      <select id="f-genre" title="What it feels like"><option value="">Any</option></select></div>
    <div class="filt act"><button class="chip" id="f-clear">Reset filters</button></div>
  </div>

  <!-- A tablist, said out loud. The chips have carried role="tab" since they
       were written, but a tab without a tablist around it is a button with a
       misleading role: the relationship is what tells a screen reader there
       are eight of these and which one is current. -->
  <div class="tabs" id="tabs" role="tablist" aria-label="Shelves"></div>
</header>

<!-- What the app looks like while it is waiting for the library. This is in
     the document rather than drawn by script on purpose: the worker serves
     this file off the disk, so these tiles are on screen in the first frame,
     before the request for the data has been answered — which is the whole
     difference between an app that is opening and a page that is loading. -->
<main id="main"><div class="grid" id="skel">
  <div class="skel"></div><div class="skel"></div><div class="skel"></div>
  <div class="skel"></div><div class="skel"></div><div class="skel"></div>
</div></main>

<nav class="dock" id="dock" aria-label="Views" hidden>
  <button data-view="shelf"><i><svg viewBox="0 0 24 24"><path d="M4 6H2v14c0 1.1.9 2 2 2h14v-2H4V6zm16-4H8c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2zm-1 9H9V9h10v2zm-4 4H9v-2h6v2zm4-8H9V5h10v2z"/></svg></i><span>Shelf</span></button>
  <button data-view="solo"><i><svg viewBox="0 0 24 24"><path d="M4 6H2v14a2 2 0 0 0 2 2h14v-2H4V6zm16-4H8a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V4a2 2 0 0 0-2-2zm0 14H8V4h12v12z"/></svg></i><span>Group Sort</span></button>
  <button data-act="edit" title="Group Edit"><i><svg viewBox="0 0 24 24"><path d="M3 17.25V21h3.75L17.81 9.94l-3.75-3.75L3 17.25zm17.71-10.21a1 1 0 0 0 0-1.41l-2.34-2.34a1 1 0 0 0-1.41 0l-1.83 1.83 3.75 3.75 1.83-1.83z"/></svg></i><span>Group Edit</span></button>
  <button data-view="stats"><i><svg viewBox="0 0 24 24"><path d="M4 9h4v11H4zM10 4h4v16h-4zM16 13h4v7h-4z"/></svg></i><span>Stats</span></button>
</nav>

<div class="veil" id="veil"></div>
<aside class="sheet" id="sheet" aria-hidden="true"></aside>

<!-- Select mode's one bar, and it is two bars depending on how the mode was
     opened. Group Edit is a stated intention — pick a group, edit it — so that
     bar carries the one thing he came for and nothing else. Ticking a cover
     states nothing, so that bar offers the verbs a selection is worth having:
     where it goes, and whether it stays at all.

     Not the nine it used to carry. A publication menu, a word menu and an
     add/remove toggle are facts about one book that happened to be applicable
     to many, and they were the clutter. Shelf and delete are the two things
     you mean *about a group*. -->
<div class="bulk" id="bulk">
  <b id="bulk-n">0 selected</b>
  <button class="chip" id="bulk-all">All</button>
  <button class="chip" id="bulk-none">Clear</button>
  <span class="sp"></span>
  <select id="bulk-status"><option value="">Move to…</option></select>
  <button class="chip danger" id="bulk-del">Delete</button>
  <button class="chip go" id="bulk-walk">Edit</button>
</div>

<!-- Polite, so what it says is read out after whatever is being read now
     rather than interrupting it: every one of these reports something that has
     already happened. -->
<div id="toast" role="status" aria-live="polite">
  <span id="toast-msg"></span><button id="toast-do" hidden></button></div>

<dialog id="art">
  <div class="wrap">
    <div class="head">
      <input type="text" id="art-q" placeholder="Search for cover art" autocomplete="off">
      <button class="btn" id="art-go">Search</button>
      <button class="ico" data-art-close aria-label="Close"><svg viewBox="0 0 24 24"><path d="M19 6.41 17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/></svg></button>
    </div>
    <!-- Every name the series is known by, one click each. Filled by
         openArt(); hidden entirely when it has no alternatives to offer. -->
    <div class="names" id="art-names" hidden></div>
    <div class="body"><div class="shots" id="art-shots"></div></div>
    <div class="foot">
      <span class="note" id="art-note"></span>
      <button class="btn" id="art-more">More</button>
      <button class="btn" data-art-close>Cancel</button>
    </div>
  </div>
</dialog>

<dialog id="dlg">
  <form method="dialog" id="dlg-form" class="fields">
    <h2 id="dlg-title">Add a series</h2>
    <div class="field">
      <label class="lbl" for="n-title">Title</label>
      <input type="text" id="n-title" required placeholder="What is it called?">
    </div>
    <div class="field">
      <label class="lbl" for="n-type">Type</label>
      <select id="n-type"></select>
    </div>
    <div class="field">
      <label class="lbl" for="n-status">Shelf</label>
      <select id="n-status"></select>
    </div>
    <div class="sheet-foot">
      <button class="btn" value="cancel" type="submit" formnovalidate>Cancel</button>
      <button class="btn primary" value="ok">Add it</button>
    </div>
  </form>
</dialog>

<script>
'use strict';
/* ══ helpers ══════════════════════════════════════════════════════════ */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g,
  c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt = v => v === null || v === undefined ? '' : String(v);

/* Eleven numbers that always meant eleven particular things, written down at
   last. Index is the score. */
const TIER = ['Horrible', 'Offensive', 'Really Bad', 'Bad', 'Slop', 'Mid',
              'Good', 'Really Good', 'Excellent', 'Best of the Genre',
              'Favorite'];

/* A stable hue per title, so a book with no artwork still looks like itself
   rather than like every other book with no artwork. */
function hue(s){ let h = 0; for (const c of s) h = (h * 31 + c.charCodeAt(0)) % 360; return h; }

/* Timestamps are SQLite's UTC `datetime('now')`. Say "3 days ago", not a
   timestamp nobody reads. */
function ago(ts){
  if (!ts) return '';
  const then = Date.parse(ts.replace(' ', 'T') + 'Z');
  if (Number.isNaN(then)) return '';
  const s = (Date.now() - then) / 1000;
  if (s < 90) return 'just now';
  const units = [[60,'minute'],[3600,'hour'],[86400,'day'],[604800,'week'],
                 [2629800,'month'],[31557600,'year']];
  let last = 'minute', div = 60;
  for (const [secs, name] of units){ if (s >= secs){ last = name; div = secs; } }
  const n = Math.floor(s / div);
  return `${n} ${last}${n === 1 ? '' : 's'} ago`;
}

let TIMER;
function toast(msg, action){
  $('#toast-msg').textContent = msg;
  const b = $('#toast-do');
  b.hidden = !action;
  if (action){ b.textContent = action.label; b.onclick = () => { hideToast(); action.run(); }; }
  $('#toast').classList.add('show');
  clearTimeout(TIMER);
  TIMER = setTimeout(hideToast, action ? 7000 : 3000);
}
const hideToast = () => $('#toast').classList.remove('show');

async function api(path, body){
  const r = await fetch(path, body ? {
    method:'POST', headers:{'Content-Type':'application/json'},
    body: JSON.stringify(body)
  } : undefined);
  /* The session ran out while the tab sat open. The server answers a fetch
     with JSON rather than the login screen — it has no idea whether a human is
     looking — so the bounce is ours to make, and a toast reading "not logged
     in" over a shelf he can no longer edit would be the wrong answer. */
  if (r.status === 401){
    location.assign('/login?next=' + encodeURIComponent(location.pathname));
    await new Promise(() => {});   // never resolves: the page is leaving
  }
  const t = await r.text();
  let j = {};
  try { j = t ? JSON.parse(t) : {}; }
  catch {
    /* Not JSON, which means something upstream answered instead of the app —
       a proxy, a gateway, the stdlib's own 404 page. Its body is HTML, and
       putting that on screen raw spills a doctype and a title tag into a
       sentence. Take the tags out, collapse the whitespace, keep a clause. */
    const plain = t.replace(/<[^>]*>/g, ' ').replace(/\s+/g, ' ').trim();
    j = { error: plain ? plain.slice(0, 120) : `${r.status} ${r.statusText}` };
  }
  if (!r.ok) throw new Error(j.error || `${r.status} ${r.statusText}`);
  return j;
}

/* ══ state ════════════════════════════════════════════════════════════
   `kind` is null until he walks through a door, and that is the whole shape of
   this app now: outside a tracker there is no shelf, no filter and no header,
   and inside one there is never a question about which tracker he is in. */
const S = {
  data:null, kind:null, view:'shelf', shelf:'Current', q:'',
  type:'', pub:'', setting:'', genre:'', seen:'', sort:'updated', open:null,
  // Select mode. `picked` holds ids and not rows, because a bulk write
  // replaces the rows underneath it and a held object would be the old one.
  // `pickFor` is how the mode was opened, and the bar reads it: 'edit' when
  // Group Edit asked for a group, null when a circle on a cover started one
  // out of nothing and there is no stated intention to honour.
  picking:false, picked:new Set(), anchor:null, pickFor:null,
  // The quick verdict screen, or null. { queue:[id…], at, cover }
  solo:null,
  // The sheet walking a queue, or null. { queue:[id…], at } — the same shape,
  // because it is the same idea with the whole editor in it instead of two
  // buttons.
  walk:null,
};
const AXES = ['setting','genre'];
const AXIS_LABEL = { setting:'Setting', genre:'Genre' };
/* What the progress number is called, per tracker. The column behind it is one
   number either way; this is the word that makes it mean something. */
const PROGRESS_LABEL = { Reading:'Chapter', Watching:'Episode' };
const TALLY_WORD     = { Reading:'chapters', Watching:'episodes' };
const byId = id => S.data.series.find(s => s.id === id);

/* Types of the tracker he is in, and what each one counts. A Movie counts
   nothing — 'once' — which is what turns the stepper into a switch. */
const typesOf  = k => (S.data.meta.typesByKind || {})[k] || [];
const typeNames = k => typesOf(k).map(x => x.name);
// Setting and Genre are a tracker's own vocabulary, same as its types: Murim
// in the anime picker was the flat tag list's mistake outliving it.
const wordsOf  = k => (S.data.meta.wordsByKind || {})[k] || {};
const modeOf = (k, type) => (typesOf(k).find(x => x.name === type) || {}).progress || '';
/* The + on a card promises one more of something. Same word as the field label,
   lowercased, except for a film, which you do not get one more of. */
const bumpWord = s => s.progress === 'once' ? 'watch'
  : (PROGRESS_LABEL[s.kind] || 'unit').toLowerCase();

/* ══ the two doors ════════════════════════════════════════════════════
   The tracker lives in the hash, so reloading keeps you where you were and
   Back walks you out of a tracker rather than off the page. */
const slug = k => k.toLowerCase().replace(/\s+/g, '-');
const kindFromHash = () => (S.data ? S.data.meta.kind : [])
  .find(k => slug(k) === location.hash.replace(/^#\/?/, '').toLowerCase()) || null;

function enter(kind){
  S.kind = kind;
  S.view = 'shelf';
  // Both are about a tracker's shelf and neither survives leaving one: a
  // selection of Reading ids means nothing standing in Watching, and a queue
  // of them means less.
  S.picking = false; S.picked.clear(); S.pickFor = null; S.solo = null; S.walk = null;
  S.q = ''; $('#q').value = ''; $('#q-clear').hidden = true;
  clearFilters();
  if (kind){
    // Current, whether or not anything is on it. It used to fall back to All
    // when the shelf was empty, which on a Reading shelf of 974 rows with not
    // one of them Current meant every session opened on all 974 — the pile,
    // not the thing he is actually reading. An empty Current is the honest
    // answer to "what am I in the middle of", and it is a shelf he can fill.
    S.shelf = 'Current';
    fillPickers();
  }
  if (S.open) closeSheet();
  scrollTo({ top: 0 });
  render();
}

/* ══ load ═════════════════════════════════════════════════════════════ */
async function load(){
  try {
    S.data = await api('/api/library');
    // Both trackers arrive in one response and the door only chooses which
    // half is on screen, so re-reading never has to know where he is standing.
    if (S.kind === null) enter(kindFromHash());
    else { fillPickers(); render(); }
  } catch (e) {
    // The one failure a person can do something about, so it says what to do.
    // The message underneath is the server's own words: "failed to fetch" is
    // worth seeing, because it is the difference between the server being down
    // and this phone being off the network.
    $('#main').innerHTML = nowt('warn', 'Could not reach the tracker',
      `Your library is on the server, not here. ${e.message}`,
      { act:'retry', label:'Try again' });
  }
}

function fillPickers(){
  const m = S.data.meta;
  const opt = (sel, items, blank) => {
    const keep = sel.value;
    sel.innerHTML = `<option value="">${blank}</option>` +
      items.map(v => `<option>${esc(v)}</option>`).join('');
    sel.value = items.includes(keep) ? keep : '';
  };
  opt($('#f-type'), typeNames(S.kind), 'Any');
  opt($('#f-pub'), m.pub, 'Any');
  $('#f-seen').value = S.seen;
  // One dropdown per field, each holding only its own words. The old single
  // "Any tag" menu was 59 items long and mixed both together.
  for (const axis of AXES)
    opt($('#f-' + axis), wordsOf(S.kind)[axis] || [], 'Any');
  $('#f-sort').value = S.sort;

  // No Kind menu on the add dialog: he is standing in one.
  $('#n-type').innerHTML = '<option value="">None</option>' +
    typeNames(S.kind).map(v => `<option>${esc(v)}</option>`).join('');
  $('#n-status').innerHTML = m.status
    .map(v => `<option${v === 'Later' ? ' selected' : ''}>${esc(v)}</option>`).join('');
  $('#dlg-title').textContent =
    S.kind === 'Watching' ? 'Add something to watch' : 'Add something to read';
}

/* ══ the numbers ══════════════════════════════════════════════════════
   These used to arrive with the payload, computed in SQL, one block per
   tracker. They are worked out here now for one reason: the question is about
   a *shelf*. "Mean rating on Dropped", "mean chapter on Hold" — a server can
   only answer that with a round trip per tab, and the whole library is already
   sitting in this array. Over the real 974 Reading rows the block below takes
   0.15 ms, measured, which is less than serialising the answer would cost.

   `app.py --stats` keeps its own SQL version. That is not a duplicate: it runs
   against a database nobody has opened in a browser. */
function statsOf(list){
  // Vocabulary order, not frequency: a menu whose rows move every time you
  // file something is a menu you have to read every time. Same rule the
  // pickers follow. Values nothing on this shelf has are left out entirely.
  const tally = (key, vocab) => {
    const n = new Map();
    for (const x of list) n.set(x[key] || '', (n.get(x[key] || '') || 0) + 1);
    const out = vocab.filter(v => n.get(v)).map(v => ({ name:v, count:n.get(v) }));
    if (n.get('')) out.push({ name:'None', count:n.get('') });
    return out;
  };
  // Setting and Genre by count instead, because there is no presentation order
  // worth honouring in a bar chart of how much of the shelf is Fantasy.
  const words = axis => {
    const n = new Map();
    for (const x of list) for (const w of x[axis]) n.set(w, (n.get(w) || 0) + 1);
    return [...n].map(([name, count]) => ({ name, count }))
      .sort((a, b) => b.count - a.count || a.name.localeCompare(b.name));
  };

  let units = 0, counted = 0, done = 0, rated = 0, sum = 0;
  const grades = new Map();
  for (const x of list){
    // A film is watched or it is not; counting each as one chapter would put a
    // number in the tally that means something else. Same rule the SQL had.
    if (x.progress === 'once'){ if (x.chapter) done++; }
    else if (x.chapter !== null){ units += x.chapter; counted++; }
    if (x.rating !== null){
      rated++; sum += x.rating;
      const b = Math.round(x.rating);
      grades.set(b, (grades.get(b) || 0) + 1);
    }
  }
  const m = S.data.meta;
  return {
    total: list.length, units, done, rated,
    avg: rated ? Math.round(100 * sum / rated) / 100 : null,
    // Over the titles that actually count chapters and have a number — not
    // over the shelf. Dividing by everything would mix in films, which have no
    // chapters, and the 84 rows where the count is simply unknown; both drag a
    // mean toward zero while pretending to be zeroes.
    meanCh: counted ? Math.round(10 * units / counted) / 10 : null,
    counted,
    byStatus: tally('status', m.status),
    byType: tally('type', typeNames(S.kind)),
    byPub: tally('pub', m.pub),
    ratings: [...grades].sort((a, b) => a[0] - b[0])
      .map(([score, count]) => ({ score, count })),
    bySetting: words('setting'), byGenre: words('genre'),
  };
}

/* Everything in this tracker, and everything on the shelf tab within it. The
   filter drawer is deliberately not in either: it is cleared on the way out of
   the shelf view, so a statistic drawn under one would be a number about a
   selection he can no longer see. */
const poolOf = () => S.data.series.filter(x => x.kind === S.kind);
const shelfOf = () => S.shelf === 'All' ? poolOf()
                                        : poolOf().filter(x => x.status === S.shelf);

/* ══ selection ════════════════════════════════════════════════════════ */
function shown(){
  let list = S.data.series.filter(s => s.kind === S.kind);
  if (S.shelf !== 'All') list = list.filter(s => s.status === S.shelf);
  if (S.type) list = list.filter(s => s.type === S.type);
  if (S.pub)  list = list.filter(s => s.pub === S.pub);
  // Has he been through it. Not derivable from the other columns — see
  // series.checked_at in schema.sql for why it is a column at all.
  if (S.seen) list = list.filter(s => !!s.checked === (S.seen === 'yes'));
  // Setting and genre are ANDed: a murim regression story is one query, not a
  // choice between two of the things you know about it.
  for (const axis of AXES)
    if (S[axis]) list = list.filter(s => s[axis].includes(S[axis]));
  if (S.q){
    const q = S.q.toLowerCase();
    const has = (arr) => arr.some(v => v.toLowerCase().includes(q));
    list = list.filter(s => s.title.toLowerCase().includes(q)
      || has(s.setting) || has(s.genre) || s.type.toLowerCase().includes(q));
  }
  const cmp = {
    updated: (a,b) => String(b.updated).localeCompare(String(a.updated)),
    rating:  (a,b) => (b.rating ?? -99) - (a.rating ?? -99) || a.title.localeCompare(b.title),
    chapter: (a,b) => (b.chapter ?? -1) - (a.chapter ?? -1) || a.title.localeCompare(b.title),
    title:   (a,b) => a.title.localeCompare(b.title),
  }[S.sort];
  return [...list].sort(cmp);
}

/* ══ render ═══════════════════════════════════════════════════════════ */
function render(){
  // Outside a tracker there is nothing to put a header on. Hiding the chrome
  // rather than emptying it is what makes the doors a place rather than a
  // shelf with no rows.
  const inside = !!S.kind;
  $('#head').hidden = $('#dock').hidden = !inside;
  /* What the app is called from outside it: the phone's app switcher, a
     browser tab, the PWA's own title bar. It said the tracker's name and
     stopped there, so three of the four screens shared one label. */
  document.title = !inside ? 'Media Tracker'
    : S.view === 'stats' ? `Stats · ${S.kind} · Media Tracker`
    : S.view === 'solo'  ? `Group Sort · ${S.kind} · Media Tracker`
    : S.picking          ? `Group Edit · ${S.kind} · Media Tracker`
    : `${S.shelf === 'All' ? S.kind : S.shelf} · ${S.kind} · Media Tracker`;
  if (!inside) return renderPortal();

  const pool = poolOf();
  // The header counts the tracker; the Stats view counts the shelf tab. Two
  // different questions, which is why they are two calls rather than one
  // number passed down.
  const whole = statsOf(pool);
  $('#h1').textContent = S.kind;
  $('#t-count').textContent = whole.total;
  $('#t-ch').textContent = whole.units.toLocaleString();
  $('#t-ch-word').textContent = TALLY_WORD[S.kind] || 'units';

  const counts = {};
  for (const x of pool) counts[x.status] = (counts[x.status] || 0) + 1;
  $('#tabs').innerHTML = [...S.data.meta.status, 'All'].map(s => {
    const n = s === 'All' ? pool.length : (counts[s] || 0);
    return `<button class="tab" data-s="${esc(s)}" role="tab"
      aria-selected="${S.shelf === s}">${esc(s)} <em>${n}</em></button>`;
  }).join('');

  // Header and dock carry the same data-view hooks, so one pass lights both.
  for (const b of document.querySelectorAll('[data-view]'))
    b.classList.toggle('on', b.dataset.view === S.view);

  // Filters belong to the shelf and to nothing else. Leaving Stats with a
  // setting still selected meant coming back to a shelf that was quietly
  // showing a third of itself, with the only evidence a lit icon in a drawer
  // that was closed. So leaving the shelf drops them, and the control that
  // opens them is not there to press.
  const onShelf = S.view === 'shelf';
  /* The search field and the shelf picker are the shelf's own controls, and
     they were sitting over Group Sort and Stats as well — so those screens
     opened under two rows of somebody else's chrome, with a shelf picker on
     top of a view that is not the shelf. They leave with the grid. */
  $('.seek').hidden = !onShelf;
  $('#tabs').hidden = !onShelf;
  const filtered = S.type || S.pub || S.seen || S.sort !== 'updated'
                   || AXES.some(a => S[a]);
  for (const b of document.querySelectorAll('[data-act=filter]')){
    b.hidden = !onShelf || S.picking;
    b.classList.toggle('on', !!filtered);
  }
  // Group Edit is a way of acting on the grid, so it goes where the grid is —
  // and it lights while the selection it asked for is being made.
  /* Select mode had no way out of itself on a phone. The way out was the Group
     Edit button you came in by — and that lives in the dock, which the bar the
     mode puts up covers completely. So you could tick, move, delete, and then
     sit there in a mode with no exit.
     The exit is Done, in the toolbar, which is where every Apple app has put
     the end of an editing mode since there were editing modes. While it is up
     it is the only thing in the bar: filter and add act on a screen you are
     not currently having, and a toolbar with three buttons and a mode is a
     toolbar that does not say what state you are in. */
  for (const b of document.querySelectorAll('[data-act=done]')) b.hidden = !S.picking;
  for (const b of document.querySelectorAll('[data-act=new]')) b.hidden = S.picking;

  for (const b of document.querySelectorAll('[data-act=edit]')){
    // The one in the dock stays put whatever you are looking at, because a tab
    // bar that changes shape as you move around it is a tab bar you cannot aim
    // at. It takes you back to the grid itself — see the handler.
    b.hidden = !onShelf && !b.closest('.dock');
    b.classList.toggle('on', S.picking);
  }
  if (!onShelf) $('#drawer').classList.remove('open');
  fillBulk();

  if (S.view === 'solo') return renderSolo();
  if (S.view === 'stats') return renderStats(statsOf(shelfOf()));
  renderShelf();
}

/* The way in. It was a title and two grey slabs floating in the middle of an
   otherwise empty screen, and the reason it looked bad is that it was the only
   screen in the app with nothing on it: every other view is wall-to-wall
   artwork, and this one — the first thing you see — had a word and a number.
   So the doors show what is behind them. Five covers off the top of each
   tracker, most recently touched first, which is both a picture of the thing
   and a true statement about it: that is what you were last reading. */
function renderPortal(){
  $('#main').innerHTML = `<div class="hall">
    <div class="mast"><b>Media Tracker</b></div>
    <div class="portal">${S.data.meta.kind.map(k => {
    const mine = S.data.series.filter(x => x.kind === k);
    const art = mine.filter(x => x.coverId)
      .sort((a, b) => String(b.updated).localeCompare(String(a.updated)))
      .slice(0, 5);
    return `<button class="door" data-door="${esc(k)}">
      ${art.length ? `<div class="door-art">${art.map(x =>
        `<img src="/cover/${x.coverId}" alt="" loading="lazy" decoding="async">`
      ).join('')}</div>` : ''}
      <div class="door-line">
        <b>${esc(k)}</b>
        <span>${mine.length} ${mine.length === 1 ? 'title' : 'titles'}</span>
      </div>
    </button>`;
  }).join('')}</div>
  </div>`;
}

/* No banner over the grid. It was there to name the two passes, because both
   of them used to hide behind an unlabelled square in the toolbar — but a slab
   of chrome standing between him and the shelf every single time he opens one
   is a high price for a signpost, and both passes are now reachable by name:
   Group Sort in the dock, Group Edit in the toolbar. */
/* The glyphs. Three, and no more: a stack of books for "there is nothing
   here", a magnifier for "nothing matched", a funnel for "you filtered it
   all out". Drawn rather than fetched, at 24px on a 24 grid like every other
   icon in this file. */
const GLYPH = {
  shelf: 'M4 6H2v14a2 2 0 0 0 2 2h14v-2H4V6zm16-4H8a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V4a2 2 0 0 0-2-2zm-1 9H9V9h10v2zm-4 4H9v-2h6v2zm4-8H9V5h10v2z',
  find:  'M15.5 14h-.79l-.28-.27A6.47 6.47 0 0 0 16 9.5 6.5 6.5 0 1 0 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z',
  sift:  'M10 18h4v-2h-4v2zM3 6v2h18V6H3zm3 7h12v-2H6v2z',
  done:  'M9 16.17 4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41z',
  warn:  'M12 2 1 21h22L12 2zm1 15h-2v-2h2v2zm0-4h-2V9h2v4z',
};
const nowt = (glyph, title, line, action) => `<div class="nowt">
  <svg viewBox="0 0 24 24"><path d="${GLYPH[glyph]}"/></svg>
  <b>${esc(title)}</b>
  <p>${esc(line)}</p>
  ${action ? `<button class="btn" data-act="${action.act}">${esc(action.label)}</button>` : ''}
</div>`;

function renderShelf(){
  const list = shown();
  if (list.length)
    return void ($('#main').innerHTML = `<div class="grid">${list.map(card).join('')}</div>`);

  // Which kind of nothing this is. A search that missed and a filter that cut
  // everything out both have a way back, and saying so is the whole job.
  const filtered = S.type || S.pub || S.seen || AXES.some(a => S[a]);
  $('#main').innerHTML =
    S.q ? nowt('find', 'No results',
               `Nothing on ${S.shelf === 'All' ? 'this tracker' : S.shelf}`
               + ` matches “${S.q}”.`,
               { act:'clear-q', label:'Clear search' })
  : filtered ? nowt('sift', 'Nothing matches',
               'Every title on this shelf is hidden by the filters you have set.',
               { act:'clear-filters', label:'Reset filters' })
  : nowt('shelf', `${S.shelf === 'All' ? S.kind : S.shelf} is empty`,
         S.shelf === 'All'
           ? 'Nothing has been added to this tracker yet.'
           : `Nothing is on ${S.shelf} right now.`);
}

function card(s){
  const art = s.coverId
    ? `<img src="/cover/${s.coverId}" alt="" loading="lazy" decoding="async"
         onerror="this.replaceWith(Object.assign(document.createElement('div'),
           {className:'fallback',textContent:this.dataset.t}))"
         data-t="${esc(s.title)}">`
    : `<div class="fallback">${esc(s.title)}</div>`;
  const sub = [s.type, s.pub].filter(Boolean);
  // A film has two states and no number. Everything else has a count, and a
  // volume beside it when he is keeping one.
  const once = s.progress === 'once';
  const watching = s.kind === 'Watching';
  // A season is only worth printing next to an episode. On a show with no
  // episodes watched it is the default talking, and printing it there is what
  // covered up UNWATCHED — the one thing the card had to say about that show.
  const season = watching && s.chapter !== null
    ? `<b>S</b> ${esc(fmt(s.season ?? 1))}` : '';
  const mark = once || s.chapter === null
    ? `<b>${s.chapter ? 'WATCHED' : watching ? 'UNWATCHED' : 'UNSTARTED'}</b>`
    : [season,
       `${s.unit ? `<b>${esc(s.unit.toUpperCase())}</b> ` : ''}${esc(fmt(s.chapter))}` +
         (s.tome !== null ? ` <b>T</b> ${esc(fmt(s.tome))}` : '')
      ].filter(Boolean).join(' ');
  const plus = once && s.chapter ? '' : `
        <button class="plus" data-bump="${s.id}" title="One more ${esc(bumpWord(s))}"
          aria-label="One more ${esc(bumpWord(s))} of ${esc(s.title)}">${once ? '✓' : '+'}</button>`;
  // In select mode the whole plate is a checkbox and nothing opens. One
  // attribute swap rather than a second card function: they are the same card,
  // and a card that renders differently per mode is a card that drifts.
  const act = S.picking ? `data-tick="${s.id}"` : `data-open="${s.id}"`;
  const on = S.picking && S.picked.has(s.id);
  return `
  <div class="book${on ? ' picked' : ''}" data-s="${esc(s.status)}" style="--h:${hue(s.title)}">
    <div class="plate" ${act} role="button" tabindex="0"
         ${S.picking ? `aria-pressed="${on}"` : ''}>
      ${art}
      <div class="mark"></div>
      ${s.checked && !S.picking ? '<div class="seen" title="Checked">✓</div>' : ''}
      ${S.picking ? '' : `<button class="pickone" data-pickone="${s.id}"
        title="Select this one" aria-label="Select ${esc(s.title)}"></button>`}
      ${s.rating !== null ? `<div class="score">${esc(fmt(s.rating))}</div>` : ''}
      <div class="foot">
        <div class="ch">${mark}</div>${S.picking ? '' : plus}
      </div>
      ${S.picking ? '<div class="tick"></div>' : ''}
    </div>
    <div>
      <div class="name" ${act} role="button">${esc(s.title)}</div>
      ${sub.length ? `<div class="sub"><span>${sub.map(esc).join(' · ')}</span></div>` : ''}
    </div>
  </div>`;
}

function bars(rows, total, tone){
  return `<div class="rows">${rows.map(r => `
    <div class="row"${tone ? ` style="--bar:var(--${r.name.toLowerCase()},var(--g8))"` : ''}>
      <i>${esc(r.name)}</i>
      <u><b style="width:${(100 * r.count / Math.max(1, total)).toFixed(1)}%"></b></u>
      <em>${r.count}</em>
    </div>`).join('')}</div>`;
}

/* Which shelf a view is about, as that view's own control.
   Stats and Group Sort are both scoped to a shelf and both have a good reason
   to be — a mean rating over Dropped and Current at once is a number about no
   shelf in particular — but they were reading that scope off the grid's tab
   strip, which sat above them looking like it belonged to them. It did not:
   it is the shelf's picker, it does eight things, seven of which are about a
   screen you are not on. So the strip goes with the grid and the two views
   that need a shelf say which one they are on, in one control, in the heading
   where the answer is already being reported. */
const scopePicker = () => `<select class="scope" id="scope" aria-label="Which shelf">${
  [...S.data.meta.status, 'All'].map(v =>
    `<option value="${esc(v)}"${v === S.shelf ? ' selected' : ''}>${
      esc(v === 'All' ? `All of ${S.kind}` : v)}</option>`).join('')}</select>`;

document.addEventListener('change', ev => {
  if (ev.target.id !== 'scope') return;
  S.shelf = ev.target.value;
  if (S.view === 'solo') return enterSolo();
  render();
});

function renderStats(st){
  // One shelf's numbers, the shelf being whichever tab is selected. A mean
  // rating over nine hundred manhwa and five films was a number about no shelf
  // in particular; so, it turns out, was a mean over Dropped and Current at
  // once, which is why the tab row scopes this view and not just the grid.
  const slab = (title, rows, opts) => rows.length
    ? `<div class="slab"><h2>${esc(title)}</h2>${bars(rows,
        opts === 'peak' ? Math.max(...rows.map(r => r.count), 1) : st.total,
        opts === 'tone')}</div>`
    : '';
  $('#main').innerHTML = `<div class="panel">
    <div class="slab">
      <h2>${scopePicker()}
        <span>${st.total} of ${poolOf().length}</span></h2>
      <div class="figs">
        <div class="fig"><b>${st.total}</b><span>titles</span></div>
        <div class="fig"><b>${st.units.toLocaleString()}</b>
          <span>${esc(TALLY_WORD[S.kind] || 'units')}</span></div>
        ${st.done ? `<div class="fig"><b>${st.done}</b><span>films watched</span></div>` : ''}
        <div class="fig"><b>${st.meanCh ?? 'None'}</b>
          <span>mean ${esc((TALLY_WORD[S.kind] || 'units').replace(/s$/, ''))}</span></div>
        <div class="fig"><b>${st.avg ?? 'None'}</b><span>mean rating</span></div>
      </div>
    </div>
    ${S.shelf === 'All' ? slab('By shelf', st.byStatus, 'tone') : ''}
    ${slab('By type', st.byType)}
    ${slab('By publication status', st.byPub)}
    ${slab('Ratings given',
           st.ratings.map(r => ({ name:String(r.score), count:r.count })), 'peak')}
    ${slab('By setting', st.bySetting, 'peak')}
    ${slab('By genre', st.byGenre, 'peak')}
  </div>`;
}

/* No renderHistory(). The reading log is still written on every chapter change
   and still served at /api/history — it is the one thing a shelf of markdown
   notes could never hold, and throwing it away to hide a tab would be the
   expensive half of a cheap decision. Putting the view back is a dock button
   and a function; putting the history back would be impossible.

   No renderTags() either, and for the opposite reason: it earned its keep only
   while tags were typed by hand and the same word could exist twice. They are
   picked from a closed list now, so the merge tool has nothing to merge and
   the cloud is two dropdowns in the filter drawer. */

/* ══ pills, outside the sheet ═════════════════════════════════════════
   The same markup the sheet builds, hoisted so the one-at-a-time screen can
   use it too. The click handlers at the bottom of this file are delegated and
   scope themselves with `closest('.picks')`, so two pill groups in two places
   do not reach into each other — which is the only reason this is shareable
   at all. Ids are prefixed `s-` there and `e-` in the sheet, because the
   sheet's markup stays in the DOM after it closes and two `#e-setting` would
   be one bug nobody would find. */
const pillRow = (key, vals, cur) => vals.map(v =>
  `<button class="pick" data-${key}="${esc(v)}" data-v="${esc(v)}"
     aria-pressed="${v === cur}">${esc(v)}</button>`).join('');
const wordRow = (axis, cur, kind) => (wordsOf(kind)[axis] || []).map(v =>
  `<button class="pick" data-many="${axis}" data-v="${esc(v)}"
     aria-pressed="${cur.includes(v)}">${esc(v)}</button>`).join('');

/* ══ select mode ══════════════════════════════════════════════════════
   Tick several, then edit them. This is the half of the problem no queue
   solves: over half of Hold was already sorted before this app existed, he can
   see which half from the covers, and no column records it. Looking at thirty
   at once and ticking eight is the gesture that matches knowing. */
function setPicking(on, why){
  S.picking = on;
  S.pickFor = on ? (why || null) : null;
  S.picked.clear();
  if (on){ S.view = 'shelf'; S.solo = null; closeSheet(); }
  render();
}

/* Modifiers, behaving the way they do in every file list there is.

   Shift extends from the last card touched to this one, over the grid *as
   displayed* — so it follows the sort and the filters rather than id order,
   which is the only reading of "everything between these two" that matches
   what he can see. Ctrl and Cmd toggle one without disturbing the rest, and a
   plain tap does the same, because a phone has no modifier key and select mode
   has to work with a thumb.

   A range redraws the grid once. A single toggle deliberately does not: Dropped
   is 672 cards, and rebuilding all of them to tick one is a wasted frame and a
   scroll position thrown away on every tap — which on a shelf you are working
   down is the difference between the mode being usable and being a trap. */
function togglePick(id, ev){
  id = Number(id);
  const order = shown().map(x => x.id);

  if (ev && ev.shiftKey && S.anchor !== null && order.includes(S.anchor)){
    const a = order.indexOf(S.anchor), b = order.indexOf(id);
    const [lo, hi] = a < b ? [a, b] : [b, a];
    // Extending only ever adds. Shift-clicking back over a range you have
    // already taken should not un-take it — that is a different gesture.
    for (const x of order.slice(lo, hi + 1)) S.picked.add(x);
    S.anchor = id;
    return render();
  }

  const on = !S.picked.has(id);
  if (on) S.picked.add(id); else S.picked.delete(id);
  // The anchor is wherever he last said yes. Clearing it on a deselect keeps a
  // later shift-click from extending out of a card that is no longer chosen.
  S.anchor = on ? id : null;
  const book = document.querySelector(`#main [data-tick="${id}"]`)?.closest('.book');
  if (book){
    book.classList.toggle('picked', on);
    for (const t of book.querySelectorAll('[data-tick]'))
      t.setAttribute('aria-pressed', String(on));
  }
  fillBulk();
}

function fillBulk(){
  const bar = $('#bulk');
  bar.classList.toggle('open', S.picking);
  document.body.classList.toggle('selecting', S.picking);
  if (!S.picking) return;
  const n = S.picked.size;
  // Group Edit said what it wanted before the first tick, so its bar does not
  // offer two other things to do instead. Ticking a cover said nothing, so
  // that bar does.
  const forEdit = S.pickFor === 'edit';
  $('#bulk-status').hidden = $('#bulk-del').hidden = forEdit;
  // The mode opens with nothing ticked, which is a bar of dead controls and no
  // instruction, so the counter carries the instruction until there is a count
  // to carry instead.
  $('#bulk-n').textContent = n ? `${n} selected`
    : forEdit ? 'Pick a group, or All' : 'Nothing selected';
  for (const id of ['#bulk-walk','#bulk-none','#bulk-status','#bulk-del'])
    $(id).disabled = !n;
  // Rebuilt rather than filled once: the shelves are a tracker's, and he can
  // be standing in either one.
  $('#bulk-status').innerHTML = '<option value="">Move to…</option>' +
    S.data.meta.status.map(v => `<option>${esc(v)}</option>`).join('');
  $('#bulk-status').value = '';
}

/* One call, one toast, one undo. `was` is captured before the write because
   restoring a bulk move means putting each row back where *it* was, not where
   the group was — so the ids are regrouped by their old value and sent back
   one group at a time.

   `add` and `remove` are gone from the signature and not from `/api/bulk`. They
   existed for Setting and Genre, which are many-of and so cannot be written by
   sending one list to twenty series; the word menu that needed them is off the
   bar, and a parameter no caller passes is a parameter that quietly rots. */
async function bulkApply(fields, say){
  const ids = [...S.picked];
  if (!ids.length) return;

  // Every field the action writes, as it stood on every row, before it writes
  // any of them. All of them and not just the first: moving a shelf also marks
  // the rows checked, and an Undo that put the shelf back while leaving them
  // marked would take them out of the queue he just undid putting them
  // through. Undo means undo.
  const keys = Object.keys(fields);
  const readBack = (x, k) => k === 'reviewed' ? !!x.checked : (x[k] ?? '');
  const was = ids.map(id =>
    [id, Object.fromEntries(keys.map(k => [k, readBack(byId(id), k)]))]);

  try {
    const r = await api('/api/bulk', { ids, fields });
    patch(r.series);
    render();
    // Restoring means putting each row back where *it* was, which is not one
    // value — so the ids are regrouped by the state they came from and sent
    // back a group at a time.
    toast(say || `${r.changed} of ${ids.length} changed`, { label:'Undo', run: async () => {
      const groups = new Map();
      for (const [id, old] of was){
        const key = JSON.stringify(old);
        groups.set(key, [...(groups.get(key) || []), id]);
      }
      try {
        for (const [key, group] of groups)
          await api('/api/bulk', { ids: group, fields: JSON.parse(key) });
        await load(); toast('Put back');
      } catch (e) { toast(e.message); }
    }});
  } catch (e) { toast(e.message); }
}

/* The one thing on this bar with no Undo under it, because there is nothing to
   put back: `/api/delete` takes the history with the row and says so. Hence a
   confirm that names the count, and the titles when there are few enough to
   read — "delete 3 series" is a number, and `Ō-oku · Berserk · Vinland Saga`
   is the thing you are about to lose.

   One request per row rather than a bulk route, because there is no bulk route
   and inventing one for an action performed on a handful of rows, a few times
   a year, is a server change to save a few hundred milliseconds. The library
   is re-read once at the end instead of after each, since /api/delete answers
   with the whole thing. */
async function bulkDelete(){
  const ids = [...S.picked];
  if (!ids.length) return;
  const names = ids.map(id => byId(id).title);
  const list = names.length <= 8 ? `\n\n${names.join('\n')}` : '';
  if (!confirm(`Remove ${ids.length} from the shelf?${list}`
      + `\n\nTheir history goes with them. This cannot be undone.`)) return;
  // Counted rather than assumed: a failure halfway through has already removed
  // everything before it, and saying "8 removed" over 3 would be a lie about
  // the one action here that cannot be taken back.
  let gone = 0, err = null;
  try { for (const id of ids){ await api('/api/delete', { id }); gone++; } }
  catch (e) { err = e; }
  setPicking(false);
  await load();
  toast(err ? `${gone} removed, then: ${err.message}` : `${gone} removed`);
}

/* Rows come back from a write already shaped like the ones in `series`, so a
   splice beats a reload: 989 rows over the wire to learn that eight of them
   moved shelf is the fetch this app was built to avoid. */
function patch(rows){
  const by = new Map(rows.map(r => [r.id, r]));
  S.data.series = S.data.series.map(x => by.get(x.id) || x);
}

/* ══ one at a time ════════════════════════════════════════════════════
   Two modes, one chassis. `file` asks a question with an answer — which shelf
   does this belong on — and takes it as a swipe. `fill` asks for something
   that is not a yes or a no, so it shows the blanks and nothing else: a cover
   is not a verdict and no amount of swiping produces one.

   The queue is a snapshot taken on entry, deliberately. It is built from
   whatever the shelf is currently showing, filters included, and then it stops
   listening — a list that reshuffled itself under him every time a save
   changed a sort key would lose his place on every card. */
const GAPS = [
  ['cover',   x => !x.cover],
  ['rating',  x => x.rating === null],
  ['pub',     x => !x.pub],
  ['type',    x => !x.type],
  ['setting', x => !x.setting.length],
  ['genre',   x => !x.genre.length],
  ['chapter', x => x.progress !== 'once' && x.chapter === null],
];
const gapsOf = x => GAPS.filter(([, blank]) => blank(x)).map(([f]) => f);

function enterSolo(){
  S.picking = false; S.picked.clear();
  closeSheet();
  // Everything on the shelf he has not been through. Already-checked rows are
  // held back, which is the entire purpose of the mark: the counter goes down
  // and stays down. Unless he has asked for them by name in the drawer, in
  // which case the filter is the instruction.
  const pool = shown().filter(x => S.seen ? true : !x.checked);
  S.solo = { at: 0, queue: pool.map(x => x.id), cover: null };
  S.view = 'solo';
  scrollTo({ top: 0 });
  render();
}

const soloNow = () => S.solo && byId(S.solo.queue[S.solo.at]);

/* Where the right-hand verdict sends it. Left is always "leave it here", so
   the pair is "this is still true" against the one move worth one button. */
const promoteTo = () => S.shelf === 'Hold' ? 'Current'
                      : S.shelf === 'Current' ? 'Finished' : 'Hold';

/* One card, one pass, one gesture. There were two modes here and a mode switch
   to pick between them, which was one screen too clever: "re-file" and "fill
   in" are not two jobs, they are the same card being looked at.

   The shape is the one every swipe-through-a-pile app landed on, and for a
   reason that applies exactly here: the cover *is* the question. A 150px
   thumbnail in a panel, with a column of fields beside it and a pair of buttons
   under it, is a form about a book — and the answer to "should this still be
   dropped" arrives a second after seeing the art, long before any of the text
   is read. So: the cover at full size, what little else the verdict depends on
   printed over the foot of it, and the two directions written underneath.

   No buttons across the bottom. The gesture is the interface, so what is under
   the card is a legend and not a toolbar: it says which way does what, it is
   pressable because a mouse has no swipe, and it stays quiet because reading it
   is something he does once.

   No Skip. A queue you can decline to answer is a queue that never shortens,
   and "leave it where it is" is already the answer for anything he does not
   want to move — it is a decision, and it records that he made one.

   Two directions and no more. The other three shelves were a row of pills
   under the verdict, offered because the code could; in practice the question
   on a Dropped shelf is Dropped or Hold, and the other three were noise under
   it. Anything that really belongs in Finished can be opened on the shelf. */

/* The shelf markers are `--current`, `--hold` and so on — the status name,
   lowercased. Which means a stamp and a legend can both be told what colour
   they are by naming the shelf they are about, and can never disagree with the
   tab dot for it. */
const tone = v => `var(--${String(v).toLowerCase()},var(--ink-2))`;
/* Six is the most a cover can carry before the words are taller than the
   title. The rest are in the sheet, where there is room to read them. */
const SOLO_WORDS = 6;

function renderSolo(){
  const q = S.solo;
  const s = soloNow();
  if (!s){
    $('#main').innerHTML = `<div class="solo">
      <div class="solo-head">${scopePicker()}
        <span class="count">${q.queue.length ? 'done' : 'nothing waiting'}</span></div>
      ${q.queue.length
        ? nowt('done', 'That is the lot',
               `You went through all ${q.queue.length} of them.`)
        : nowt('done', 'Nothing waiting',
               `Everything on ${S.shelf === 'All' ? 'this tracker' : S.shelf}`
               + ` has already been through here.`)}</div>`;
    return;
  }
  const left = s.status || 'place';
  const right = promoteTo();
  const words = [...s.setting, ...s.genre];
  const chips = words.slice(0, SOLO_WORDS).map(w => `<span>${esc(w)}</span>`).join('')
    + (words.length > SOLO_WORDS ? `<span>+${words.length - SOLO_WORDS}</span>` : '');
  const meta = [s.type, s.pub].filter(Boolean).join(' · ');
  const gaps = soloGaps(s);
  $('#main').innerHTML = `<div class="solo">
    <div class="solo-head">
      ${scopePicker()}
      <span class="count">${q.at + 1} of ${q.queue.length}</span>
    </div>
    <div class="tri" id="tri">
      <div class="tri-art">${s.coverId
        ? `<img src="/cover/${s.coverId}" alt="">`
        : `<div class="fallback" style="--h:${hue(s.title)}">${esc(s.title)}</div>`}</div>
      <div class="tri-say l" style="--tone:${tone(left)}">${esc(left)}</div>
      <div class="tri-say r" style="--tone:${tone(right)}">${esc(right)}</div>
      <div class="tri-info">
        <h2>${esc(s.title)}</h2>
        <div class="tri-line">${meta ? `<span>${esc(meta)}</span>` : ''}
          <em>${esc(soloProgress(s))}</em></div>
        <div class="tri-words">${chips || '<span>no words yet</span>'}</div>
      </div>
    </div>
    <div class="swipes">
      <button class="swipe l" data-file="" style="--tone:${tone(left)}">
        <b>← Leave in ${esc(left)}</b><span>swipe left</span></button>
      <button class="swipe r" data-file="${esc(right)}" style="--tone:${tone(right)}">
        <b>Move to ${esc(right)} →</b><span>swipe right</span></button>
    </div>
    ${gaps ? `<div class="fills">${gaps}</div>` : ''}
  </div>`;
  bindDrag();
  loadShots(s);
}

const soloProgress = s => s.progress === 'once'
  ? (s.chapter ? 'watched' : 'not watched')
  : s.chapter === null ? 'not started'
  : `${s.unit || 'ch'} ${fmt(s.chapter)}`;

/* Only what is blank. A field he has already answered is not a question, and
   drawing it would turn a card you can clear in two taps into the sheet. */
function soloGaps(s){
  const gaps = gapsOf(s);
  const box = (label, body) => `<div class="gap"><span class="lbl">${esc(label)}</span>${body}</div>`;
  const out = [];
  if (gaps.includes('cover'))
    out.push(box('Cover', `<div class="shots" id="s-shots"><div class="empty">Looking…</div></div>`));
  if (gaps.includes('chapter'))
    out.push(box(PROGRESS_LABEL[s.kind] || 'Progress',
      `<input type="number" id="s-chapter" inputmode="numeric" min="0" placeholder="not started">`));
  if (gaps.includes('rating'))
    out.push(box('Rating', `<div class="stars">
      <input type="range" id="s-rating" min="0" max="10" step="1" value="0">
      <output id="s-rating-out">None</output></div>`));
  if (gaps.includes('type'))
    out.push(box('Type', `<div class="picks">${pillRow('type', typeNames(s.kind), '')}</div>`));
  if (gaps.includes('pub'))
    out.push(box('Publication status', `<div class="picks">${pillRow('pub', S.data.meta.pub, '')}</div>`));
  for (const axis of AXES)
    if (gaps.includes(axis))
      out.push(box(AXIS_LABEL[axis],
        `<div class="picks many" id="s-${axis}">${wordRow(axis, [], s.kind)}</div>`));
  return out.join('');
}

/* Cover art for the card on screen, and for the one behind it — one ahead and
   no further. /api/images fans out to six live catalogues per call; walking
   608 blanks would be 608 of those, and running them in bulk is how you get
   DuckDuckGo to stop answering. */
const shots = new Map();
function fetchShots(s){
  if (!s) return Promise.resolve([]);
  if (!shots.has(s.id))
    shots.set(s.id, api(`/api/images?q=${encodeURIComponent(s.title)}&p=0`
                        + `&kind=${encodeURIComponent(s.kind)}`)
      .then(r => (r.results || []).slice(0, 12))
      .catch(() => [])
      // Nothing found is not an answer worth keeping. A catalogue being down
      // for a second looks exactly like a title nobody has art for, and
      // remembering the first as though it were the second would mean the card
      // says "nothing found" for the rest of the session with no way to ask
      // again. A hit is stable and stays; a miss is forgotten, so coming back
      // to the card retries.
      .then(hits => { if (!hits.length) shots.delete(s.id); return hits; }));
  return shots.get(s.id);
}

async function loadShots(s){
  const box = $('#s-shots');
  if (!box) return;
  const hits = await fetchShots(s);
  // He may have moved on while six catalogues were thinking about it.
  if (soloNow() !== s || !document.contains(box)) return;
  box.innerHTML = hits.length ? hits.map(i => `
    <button class="shot" data-shot="${esc(i.url)}">
      <img src="/thumb?u=${encodeURIComponent(i.thumb)}" alt="" loading="lazy"
           onerror="this.closest('.shot').remove()"></button>`).join('')
    : `<div class="empty">Nothing found under that name</div>`;
  const nxt = byId(S.solo.queue[S.solo.at + 1]);
  if (nxt && gapsOf(nxt).includes('cover')) fetchShots(nxt);
}

function soloStep(by){
  S.solo.at += by;
  S.solo.cover = null;
  scrollTo({ top: 0 });
  render();
}

/* The only way off a card. `status` is '' for "leave it where it is", which is
   a real answer and the commonest one — it still records that he looked.
   Whatever he filled in on the card goes in the same write, so a cover and a
   verdict are one request and not two. */
async function soloFile(status){
  const s = soloNow();
  if (!s) return;
  const gaps = gapsOf(s);
  const fields = { reviewed: true };
  if (status && status !== s.status) fields.status = status;
  if (S.solo.cover) fields.cover = S.solo.cover;
  const ch = $('#s-chapter');
  if (ch && ch.value.trim() !== '') fields.chapter = Number(ch.value);
  if (gaps.includes('rating') && $('#s-rating-out') &&
      $('#s-rating-out').textContent !== 'None')
    fields.rating = Number($('#s-rating').value);
  const one = key => $(`#main .picks [data-${key}][aria-pressed=true]`);
  for (const key of ['type', 'pub'])
    if (gaps.includes(key) && one(key)) fields[key] = one(key).dataset[key];
  for (const axis of AXES){
    if (!gaps.includes(axis)) continue;
    const picked = pressed('#s-' + axis);
    if (picked.length) fields[axis] = picked;
  }
  try {
    const r = await api('/api/update', { id: s.id, fields });
    patch([r.series]);
    soloStep(1);
  } catch (e) { toast(e.message); }
}

/* Drag, because the whole point is one gesture per series. Pointer events
   rather than touch: the same handler serves a trackpad drag, which is how
   this gets used at a desk. Vertical movement is left alone so the page can
   still scroll to reach the controls under a tall card. */
function bindDrag(){
  const el = $('#tri');
  if (!el) return;
  let x0 = 0, y0 = 0, dx = 0, on = false;
  const say = (d) => {
    el.querySelector('.tri-say.l').style.opacity = d < -20 ? Math.min(1, -d / 90) : 0;
    el.querySelector('.tri-say.r').style.opacity = d > 20 ? Math.min(1, d / 90) : 0;
  };
  el.addEventListener('pointerdown', ev => {
    if (ev.target.closest('button')) return;
    on = true; x0 = ev.clientX; y0 = ev.clientY; dx = 0;
    el.classList.remove('glide');
    el.setPointerCapture(ev.pointerId);
  });
  el.addEventListener('pointermove', ev => {
    if (!on) return;
    dx = ev.clientX - x0;
    // A mostly-vertical drag is a scroll, not a verdict.
    if (Math.abs(ev.clientY - y0) > Math.abs(dx) && Math.abs(dx) < 30) return;
    el.style.transform = `translateX(${dx}px) rotate(${dx / 28}deg)`;
    say(dx);
  });
  const end = () => {
    if (!on) return;
    on = false;
    el.classList.add('glide');
    if (Math.abs(dx) > 90){
      el.style.transform = `translateX(${dx > 0 ? 700 : -700}px) rotate(${dx / 12}deg)`;
      el.classList.add('gone');
      return soloFile(dx > 0 ? promoteTo() : '');
    }
    el.style.transform = ''; say(0);
  };
  el.addEventListener('pointerup', end);
  el.addEventListener('pointercancel', end);
}

/* ══ the sheet ════════════════════════════════════════════════════════ */

/* The progress control is not one control. A show has a season and an episode,
   a manhwa has a chapter and maybe a volume, and a film has an evening — so
   which of the three you get is a property of the type, and the type is
   editable in this same sheet. Hence a function that can be called again
   rather than a branch taken once on open.

   `stepper` is the shape all of them share: a labelled number with a button on
   each side, and a data attribute naming the field it writes. */
function stepper(field, label, value, placeholder){
  return `
      <div class="field" style="margin:0 0 12px">
        <span class="lbl">${esc(label)}</span>
        <div class="stepper">
          <button data-bumpfield="${field}" data-by="-1"
                  aria-label="Back one ${esc(label.toLowerCase())}">−</button>
          <input type="number" id="e-${field}" inputmode="numeric" min="0"
                 value="${value === null ? '' : esc(fmt(value))}"
                 placeholder="${esc(placeholder)}">
          <button data-bumpfield="${field}" data-by="1"
                  aria-label="On one ${esc(label.toLowerCase())}">+</button>
        </div>
      </div>`;
}

function progressField(s, type){
  if (modeOf(s.kind, type) === 'once') return `
      <span class="lbl">Watched</span>
      <div class="switch">
        <button data-watched="0" aria-pressed="${!s.chapter}">Not yet</button>
        <button data-watched="1" aria-pressed="${!!s.chapter}">Watched</button>
      </div>`;
  // A season is part of an episode's address: "episode 12" of a show with four
  // of them does not identify anything. So it is always there and starts at 1,
  // where a tome is a way of buying a book and stays blank until he counts one.
  return s.kind === 'Watching'
    ? stepper('season', 'Season', s.season ?? 1, '1') +
      stepper('chapter', 'Episode', s.chapter, 'not watched')
    : stepper('chapter', 'Chapter', s.chapter, 'not started') +
      stepper('tome', 'Tome', s.tome, 'not counting');
}

function drawProgress(type){
  const s = byId(S.open);
  const box = $('#e-progress');
  if (!s || !box) return;
  // Read the fields back off the DOM first, so redrawing after a type change
  // does not throw away a number he just typed.
  const live = { ...s };
  const num = el => !el || el.value.trim() === '' ? null : Number(el.value);
  for (const f of ['chapter', 'tome', 'season']){
    const el = $('#e-' + f);
    if (el) live[f] = num(el);
  }
  const on = $('#e-progress [data-watched][aria-pressed=true]');
  if (on) live.chapter = on.dataset.watched === '1' ? (s.chapter || 1) : null;
  box.innerHTML = progressField(live, type);
}

/* Which run of series this sheet belongs to.

   A selection if there is one — ticking eight and then opening one of them
   means those eight — and otherwise the shelf as displayed, filters, search and
   sort included. Ids and not rows, and in display order, so Next means the next
   one along the grid he was just looking at rather than the next id.

   Passing a queue explicitly is how "go through these" starts one from the bulk
   bar, after select mode has already been left behind. */
/* A walk is a run of series being gone through deliberately — the selection
   behind Group Edit, or a queue handed over by whatever started the pass. It
   is NOT the default.
   It used to fall back to the whole shelf, so opening one series to fix one
   number put you at position 47 of 917 with a pager over the form and a button
   that said Save · Next: an edit dressed up as an expedition. Fixing a chapter
   count is a one-thing job, and the way out of a one-thing job is Save.
   The fallback is gone, so a walk exists only when somebody asked for one. */
function walkFrom(id, queue){
  const order = shown().map(x => x.id);
  const run = queue ? queue
            : S.picked.size ? order.filter(x => S.picked.has(x))
            : null;
  if (!run){ S.walk = null; return; }
  const at = run.indexOf(Number(id));
  S.walk = at === -1 ? null : { queue: run, at };
}

function openSheet(id, queue){
  const s = byId(Number(id));
  if (!s) return;
  walkFrom(s.id, queue);
  S.open = s.id;
  const m = S.data.meta;
  const picks = (key, vals, cur) => vals.map(v =>
    `<button class="pick" data-${key}="${esc(v)}" data-v="${esc(v)}"
       aria-pressed="${v === cur}">${esc(v)}</button>`).join('');
  // Many-of, and the only difference in the markup is that nothing clears the
  // others when one is pressed. Setting and Genre are lists; the shelf is not.
  const many = (axis, cur) => (wordsOf(s.kind)[axis] || []).map(v =>
    `<button class="pick" data-many="${axis}" data-v="${esc(v)}"
       aria-pressed="${cur.includes(v)}">${esc(v)}</button>`).join('');

  // Ratings used to move in halves and some titles still carry one. A
  // whole-step slider cannot sit on 6.5, so round for the thumb and show the
  // rounded number too: the sheet says what saving would actually store.
  const grade = s.rating === null ? null : Math.round(s.rating);

  $('#sheet').innerHTML = `
    <div class="sheet-top">
      <button class="tbtn" data-close>Cancel</button>
      <h2>${esc(s.title)}</h2>
      <button class="tbtn go" data-save>${
        S.walk && S.walk.at < S.walk.queue.length - 1 ? 'Save · Next' : 'Save'}</button>
    </div>
    ${S.walk && S.walk.queue.length > 1 ? `
    <div class="pager">
      <button class="step" data-walk="-1" ${S.walk.at === 0 ? 'disabled' : ''}
              aria-label="Previous, saving this one">‹</button>
      <span class="count">${S.walk.at + 1} of ${S.walk.queue.length}</span>
      <button class="step" data-walk="1"
              ${S.walk.at >= S.walk.queue.length - 1 ? 'disabled' : ''}
              aria-label="Next, saving this one">›</button>
    </div>` : ''}
    <div class="sheet-body">
      <div class="art">${s.coverId
        ? `<img src="/cover/${s.coverId}" alt="">`
        : `<div class="fallback" style="--h:${hue(s.title)}">${esc(s.title)}</div>`}</div>
      <div class="fields">
      <div id="e-progress">${progressField(s, s.type)}</div>

      <div class="field">
        <span class="lbl">Rating</span>
        <div class="stars">
          <div class="rate" id="e-rate" role="group" aria-label="Rating out of ten">
            ${Array.from({length: 10}, (_, i) => i + 1).map(n =>
              `<button class="pip" data-rate="${n}" aria-label="${n} out of ten"
                 aria-pressed="${grade !== null && n <= grade}"><i></i></button>`).join('')}
          </div>
          <output id="e-rating-out">${grade === null ? '–' : grade}</output>
          <input type="hidden" id="e-rating" value="${grade ?? 0}">
        </div>
        <div class="tierline">
          <span class="tier" id="e-rating-tier">${grade === null ? '' : esc(TIER[grade])}</span>
          <button class="linkish" id="e-rating-clear">Clear</button>
        </div>
      </div>

      <div class="field">
        <span class="lbl">Shelf</span>
        <div class="picks">${picks('status', m.status, s.status)}</div>
      </div>

      <div class="field">
        <span class="lbl">Type</span>
        <div class="picks" id="e-types">${picks('type', typeNames(s.kind), s.type)}</div>
      </div>

      <div class="field">
        <span class="lbl">Publication status</span>
        <div class="picks">${picks('pub', m.pub, s.pub)}</div>
      </div>

      <div class="field">
        <span class="lbl">Setting</span>
        <div class="picks many" id="e-setting">${many('setting', s.setting)}</div>
      </div>

      <div class="field">
        <span class="lbl">Genre</span>
        <div class="picks many" id="e-genre">${many('genre', s.genre)}</div>
      </div>

      <div class="field">
        <span class="lbl">Cover image</span>
        <div class="pickbar">
          <input type="text" id="e-cover" value="${esc(s.cover)}" placeholder="https://… or search">
          <button class="btn" id="e-cover-find" title="Search the web for cover art">Find</button>
        </div>
      </div>

      <div class="field">
        <span class="lbl">Title</span>
        <input type="text" id="e-title" value="${esc(s.title)}">
      </div>

      <div class="field">
        <span class="lbl">Also known as</span>
        <div class="alts" id="e-alts">${(s.alt || []).map(altRow).join('')}</div>
        <button class="btn" id="e-alt-add">Add another name</button>
      </div>

      <p class="meta">
        Added ${esc(ago(s.created))} · last changed ${esc(ago(s.updated))}<br>
        ${s.logCount ? `${s.logCount} change${s.logCount === 1 ? '' : 's'} recorded${
          s.lastRead ? `, most recently ${esc(ago(s.lastRead))}` : ''}`
          : 'No progress recorded yet'}
      </p>

      <button class="destroy" data-trash>Remove from the shelf</button>
      </div>
    </div>`;

  $('#veil').classList.add('open');
  $('#sheet').classList.add('open');
  $('#sheet').setAttribute('aria-hidden', 'false');
  document.body.classList.add('locked');
  $('#sheet .sheet-body').scrollTop = 0;
}

function closeSheet(){
  S.open = null;
  S.walk = null;
  $('#veil').classList.remove('open');
  $('#sheet').classList.remove('open');
  $('#sheet').setAttribute('aria-hidden', 'true');
  document.body.classList.remove('locked');
}

const pressed = sel => [...document.querySelectorAll(sel + ' .pick[aria-pressed=true]')]
  .map(b => b.dataset.v);

/* One alternative title. Plain inputs rather than chips-on-enter: these are
   long, they contain punctuation, and half of them are romanisations you want
   to paste and then fix a letter of. A text box does that; a chip does not. */
const altRow = (v = '') => `
  <div class="altrow">
    <input type="text" value="${esc(v)}" placeholder="Another name for it">
    <button class="ico" data-alt-del aria-label="Remove this name">
      <svg viewBox="0 0 24 24"><path d="M19 6.41 17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/></svg>
    </button>
  </div>`;

/* Blank rows are dropped rather than saved, so "Add another name" and then
   changing your mind costs nothing. The server dedupes and drops anything
   equal to the real title; this only has to send what is on screen. */
const altValues = () => [...document.querySelectorAll('#e-alts input')]
  .map(i => i.value.trim()).filter(Boolean);

/* Save, and then go on to the next one if there is one.

   Going on is the default because this is a pass over a shelf: closing the
   sheet after every entry and finding the next cover in a grid that has just
   reordered itself is the thing that made going through 989 of them
   impossible. With nowhere to go it closes, as it always did. */
async function saveSheet(step = 1){
  const id = S.open;
  if (!id) return;
  const num = el => !el || el.value.trim() === '' ? null : Number(el.value);
  const watched = $('#e-progress [data-watched][aria-pressed=true]');
  const fields = {
    title:   $('#e-title').value.trim(),
    // A film's progress is a switch, and 1 is the only number behind it.
    chapter: watched ? (watched.dataset.watched === '1' ? 1 : null)
                     : num($('#e-chapter')),
    tome:    num($('#e-tome')),
    season:  num($('#e-season')),
    rating:  $('#e-rating-out').textContent === '–' ? null : Number($('#e-rating').value),
    status:  $('#sheet [data-status][aria-pressed=true]')?.dataset.status || '',
    pub:     $('#sheet [data-pub][aria-pressed=true]')?.dataset.pub || '',
    type:    $('#sheet [data-type][aria-pressed=true]')?.dataset.type || '',
    setting: pressed('#e-setting'),
    genre:   pressed('#e-genre'),
    cover:   $('#e-cover').value.trim(),
    alt:     altValues(),
  };
  // Neither field exists in the other tracker, and a film has neither. Sending
  // null for one that is not on screen would clear a number he was never shown.
  if (!$('#e-tome')) delete fields.tome;
  if (!$('#e-season')) delete fields.season;
  // Walking a queue records that he has been through the row, the same way the
  // verdict screen does. It is the point of the pass.
  if (S.walk) fields.reviewed = true;
  try {
    const r = await api('/api/update', { id, fields });
    patch([r.series]);
    const w = S.walk;
    const next = w && step ? w.at + step : -1;
    if (next >= 0 && next < w.queue.length){
      // The queue is passed back in, not rebuilt: the row just saved may have
      // left the shelf it was built from, and the snapshot is what stops that
      // moving everything under him mid-pass.
      openSheet(w.queue[next], w.queue);
      render();
    } else {
      closeSheet();
      render();
    }
    const said = r.changed.filter(f => f !== 'reviewed');
    toast(said.length ? `Saved: ${said.join(', ')}` : 'Nothing changed');
  } catch (e) { toast(e.message); }
}

/* ══ the cover picker ═════════════════════════════════════════════════
   Six catalogues asked at once, merged into one grid. The seed is the title
   and nothing else: it used to be the title plus a type word plus "cover",
   which was right when the only source was a web image search and is wrong
   now — "One Coin Clear manhwa cover" matches nothing at all in a title index,
   and it was dragging in every unrelated picture with the word cover on it.

   `live` is which sources still have more to give. It comes back from the
   server, goes out again with the next page, and when it empties there is no
   next page — which is what puts the More button away rather than leaving it
   to fetch nothing. `seen` is because two catalogues can hold the same file
   and a duplicate tile is a click that does nothing you can tell apart. */
const artState = { q:'', page:0, kind:'Reading', live:null, seen:new Set() };

const seedQuery = s => s.title;

/* The title and every name he has recorded for it, as one-click queries. This
   is the payoff for keeping alternative titles at all: the art for something
   niche is filed under the romanisation, or the official English release, or
   whatever the scanlators called it, and which one works is not knowable in
   advance — so try them by clicking. */
function fillNames(s){
  const box = $('#art-names');
  const names = [s.title, ...(s.alt || [])];
  box.hidden = names.length < 2;
  box.innerHTML = names.map(n => `
    <button class="name" data-name="${esc(n)}" title="${esc(n)}">${esc(n)}</button>`).join('');
  markName();
}

const markName = () => {
  for (const b of document.querySelectorAll('#art-names .name'))
    b.setAttribute('aria-pressed', String(b.dataset.name === artState.q));
};

async function artSearch(reset){
  const box = $('#art-shots'), note = $('#art-note'), more = $('#art-more');
  if (reset){
    artState.page = 0; artState.live = null;
    artState.seen = new Set(); box.innerHTML = '';
  }
  artState.q = $('#art-q').value.trim();
  if (!artState.q) return;
  markName();
  note.textContent = 'Searching…';
  more.disabled = true;
  try {
    const r = await api(`/api/images?q=${encodeURIComponent(artState.q)}`
                        + `&p=${artState.page}&kind=${encodeURIComponent(artState.kind)}`
                        + (artState.live ? `&src=${artState.live.join(',')}` : ''));
    const hits = (r.results || []).filter(i => !artState.seen.has(i.url));
