    for (const i of hits) artState.seen.add(i.url);
    box.insertAdjacentHTML('beforeend', hits.map(i => `
      <button class="shot" data-pick="${esc(i.url)}"
              title="${esc(i.title || '')}${i.w ? ` · ${i.w}×${i.h}` : ''} — ${esc(i.host)}">
        <img src="/thumb?u=${encodeURIComponent(i.thumb)}" alt="" loading="lazy"
             onerror="this.closest('.shot').remove()">
        <em>${esc(i.source)}</em>
      </button>`).join(''));
    artState.live = r.live || [];
    artState.page = r.next === null || r.next === undefined ? artState.page : r.next;
    // Hidden the moment every source has run out, which is the only honest
    // time to offer another page.
    more.hidden = r.next === null || r.next === undefined;
    const n = box.children.length;
    // A source being down is a fact about that source, not a failed search.
    // Five catalogues answering is a working picker, so it is said quietly and
    // only when it happened.
    const down = (r.failed || []).length ? ` (${r.failed.join(', ')} did not answer)` : '';
    note.textContent = (n ? `${n} results, click one` : 'Nothing found under that name') + down;
  } catch (e){ note.textContent = e.message; }
  more.disabled = false;
}

function openArt(){
  const s = byId(S.open);
  if (!s) return;
  // Reseeded from the series every time it opens. Carrying the last query over
  // would mean opening the picker on one book and searching for another.
  artState.kind = s.kind || 'Reading';
  $('#art-q').value = seedQuery(s);
  // Read off the sheet rather than off `s`, so a name typed a moment ago and
  // not yet saved is still one of the buttons.
  fillNames({ title: $('#e-title').value.trim() || s.title, alt: altValues() });
  $('#art').showModal();
  artSearch(true);
}

function closeArt(){ $('#art').close(); }

/* ══ actions ══════════════════════════════════════════════════════════ */
async function bump(id){
  const s = byId(Number(id));
  if (!s) return;
  const before = { chapter: s.chapter, status: s.status };
  const once = s.progress === 'once';
  try {
    const r = await api('/api/bump', { id: s.id, by: 1, resume: true });
    const now = r.series;
    S.data.series = S.data.series.map(x => x.id === now.id ? now : x);
    S.data.stats = r.stats;
    S.data.history = r.history;
    render();
    const moved = now.status !== before.status;
    // "chapter 1" on a film is the sentence that made this whole field wrong.
    const said = once ? 'watched'
      : now.kind === 'Watching'
        ? `season ${fmt(now.season ?? 1)}, episode ${fmt(now.chapter)}`
        : `${(PROGRESS_LABEL[now.kind] || 'progress').toLowerCase()} ${fmt(now.chapter)}`;
    toast(`${now.title}: ${said}${moved ? ` · moved to ${now.status}` : ''}`,
      { label:'Undo', run: async () => {
          try { await api('/api/update', { id: s.id, fields: before }); await load();
                toast('Put back'); }
          catch (e) { toast(e.message); }
        }});
  } catch (e) { toast(e.message); }
}

/* ══ wiring ═══════════════════════════════════════════════════════════ */
document.addEventListener('click', async ev => {
  const hit = sel => ev.target.closest(sel);

  const door = hit('[data-door]');
  if (door) return goTo(door.dataset.door);

  const bumpBtn = hit('[data-bump]');
  if (bumpBtn){ ev.stopPropagation(); return bump(bumpBtn.dataset.bump); }

  // The circle that hover draws on a card. Before the [data-open] branch, and
  // stopping there, because it sits inside the plate — which opens the sheet.
  const one = hit('[data-pickone]');
  if (one){
    ev.stopPropagation();
    setPicking(true);
    return togglePick(one.dataset.pickone);
  }

  const opener = hit('[data-open]');
  if (opener && opener.dataset.open){
    // Ctrl, Cmd or Shift on a card picks it instead of opening it, turning
    // select mode on if it was not already. Holding a modifier and clicking is
    // how selecting starts everywhere else, so it should not first require
    // finding a button — and a sheet opening over a selection you were trying
    // to start is the wrong answer to an unambiguous gesture.
    if (ev.ctrlKey || ev.metaKey || ev.shiftKey){
      if (!S.picking){ S.picking = true; S.solo = null; closeSheet(); render(); }
      return togglePick(opener.dataset.open, ev);
    }
    return openSheet(opener.dataset.open);
  }

  // The tab row is the scope for whichever view is open, which is what makes
  // "stats for this shelf" a thing you can ask for at all. From the card
  // screen it means a different pile to go through, so the queue is rebuilt.
  const tab = hit('.tab');
  if (tab) return toShelf(tab.dataset.s, 0);

  const tick = hit('[data-tick]');
  if (tick) return togglePick(tick.dataset.tick, ev);

  const verdict = hit('[data-file]');
  if (verdict) return soloFile(verdict.dataset.file);

  const art = hit('[data-shot]');
  if (art){
    // Chosen, not saved. Same rule the sheet's picker follows: the grid picks
    // artwork and the button underneath commits the card.
    S.solo.cover = art.dataset.shot;
    for (const el of document.querySelectorAll('#s-shots .shot.on')) el.classList.remove('on');
    art.classList.add('on');
    return;
  }

  if (ev.target.id === 'e-alt-add'){
    $('#e-alts').insertAdjacentHTML('beforeend', altRow());
    return $('#e-alts .altrow:last-child input').focus();
  }
  const altDel = hit('[data-alt-del]');
  if (altDel) return altDel.closest('.altrow').remove();

  if (ev.target.id === 'e-cover-find') return openArt();
  if (hit('[data-art-close]')) return closeArt();
  if (ev.target.id === 'art-go') return artSearch(true);
  if (ev.target.id === 'art-more') return artSearch(false);

  const name = hit('#art-names .name');
  if (name){ $('#art-q').value = name.dataset.name; return artSearch(true); }

  const shot = hit('[data-pick]');
  if (shot){
    // Fill the field rather than saving outright: the picker chooses artwork,
    // Save commits the edit, same as every other field in the sheet.
    $('#e-cover').value = shot.dataset.pick;
    for (const el of document.querySelectorAll('.shot.on')) el.classList.remove('on');
    shot.classList.add('on');
    closeArt();
    toast('Cover chosen. Save to keep it');
    return;
  }

  // The arrows save on the way past. Moving on without committing what you
  // just typed is how a pass over nine hundred rows quietly loses half of them.
  const walk = hit('[data-walk]');
  if (walk) return saveSheet(Number(walk.dataset.walk));

  if (hit('[data-close]') || ev.target.id === 'veil') return closeSheet();
  if (hit('[data-save]')) return saveSheet();

  // Ten bars, and the one you touch is the score. Tapping the bar that is
  // already the score takes the rating off again, which is the gesture people
  // try on a control like this before they look for a Clear button.
  const pip = hit('.pip');
  if (pip){
    const n = Number(pip.dataset.rate);
    return setRating(n === Number($('#e-rating').value)
                     && $('#e-rating-out').textContent !== '–' ? null : n);
  }
  if (ev.target.id === 'e-rating-clear') return setRating(null);

  if (hit('[data-trash]')){
    const s = byId(S.open);
    if (!s) return;
    if (!confirm(`Remove “${s.title}” from the shelf?\n\nIts history goes with it. This cannot be undone.`)) return;
    try { const r = await api('/api/delete', { id: s.id });
          closeSheet();
          S.data = { series:r.series, stats:r.stats, meta:r.meta, history:r.history };
          fillPickers(); render();
          toast(`Removed “${r.title}”`); }
    catch (e) { toast(e.message); }
    return;
  }

  const step = hit('[data-bumpfield]');
  if (step){
    const field = step.dataset.bumpfield;
    const el = $('#e-' + field);
    const next = (Number(el.value) || 0) + Number(step.dataset.by);
    // A season is never absent, so it floors at 1. The other two go below 1 to
    // nothing at all, which is how a show is put back to unwatched without
    // reaching for the keyboard. Flooring them at 0 was the bug: "episode 0"
    // is a number you are on, and there is no such episode.
    el.value = field === 'season' ? Math.max(1, next) : (next < 1 ? '' : next);
    return;
  }

  const watch = hit('[data-watched]');
  if (watch){
    for (const b of watch.closest('.switch').querySelectorAll('button'))
      b.setAttribute('aria-pressed', String(b === watch));
    return;
  }

  // Many-of: pressing one leaves the rest alone. That is the whole difference
  // between Setting and Shelf, and it is one line.
  const multi = hit('[data-many]');
  if (multi){
    multi.setAttribute('aria-pressed',
      multi.getAttribute('aria-pressed') === 'true' ? 'false' : 'true');
    return;
  }

  // Single-choice pill groups: pressing the pressed one clears the field.
  for (const key of ['status','pub','type']){
    const pill = hit(`[data-${key}]`);
    if (pill && pill.classList.contains('pick')){
      const was = pill.getAttribute('aria-pressed') === 'true';
      pill.closest('.picks').querySelectorAll('.pick')
        .forEach(x => x.setAttribute('aria-pressed', 'false'));
      pill.setAttribute('aria-pressed', was ? 'false' : 'true');
      // A Show has episodes and a Movie does not, so changing the type changes
      // what the progress control even is.
      if (key === 'type') drawProgress(was ? '' : pill.dataset.type);
      return;
    }
  }
});

/* 0 is a real score, so "unrated" cannot be a number: the output element
   carries that state and everything that reads the rating back checks it. */
function setRating(n){
  $('#e-rating').value = n ?? 0;
  $('#e-rating-out').textContent = n === null ? '–' : fmt(n);
  $('#e-rating-tier').textContent = n === null ? '' : TIER[n];
  for (const b of document.querySelectorAll('#e-rate .pip'))
    b.setAttribute('aria-pressed', n !== null && Number(b.dataset.rate) <= n);
}

/* ── swiping between shelves ─────────────────────────────────────────────
   The shelf picker is a row of eight chips that has to be scrolled sideways to
   reach the far end of, which means changing shelf on a phone is: scroll the
   strip, aim at a 34px chip, tap. The shelves are a flat ordered list and the
   grid under them fills the screen, so the gesture is already obvious — put a
   thumb on the covers and push them aside.

   The rules for telling a swipe from a scroll are the fiddly part. It has to
   be mostly sideways (twice as much x as y) and it has to be a real distance
   (56px), because a vertical flick with a few pixels of drift is the commonest
   thing anybody does on this screen and it must never change shelf. It is
   ignored on any screen that is not the grid, while the sheet is open, and
   inside the select-mode bar, where a drag means something else. */
let swipeFrom = null;

addEventListener('touchstart', ev => {
  if (S.view !== 'shelf' || S.open || ev.touches.length !== 1) return;
  if (ev.target.closest('.tabs, .drawer, .bulk, .sheet, input, select, textarea')) return;
  const t = ev.touches[0];
  swipeFrom = { x: t.clientX, y: t.clientY };
}, { passive: true });

addEventListener('touchend', ev => {
  const from = swipeFrom;
  swipeFrom = null;
  if (!from || S.view !== 'shelf' || S.open) return;
  const t = ev.changedTouches[0];
  const dx = t.clientX - from.x, dy = t.clientY - from.y;
  if (Math.abs(dx) < 56 || Math.abs(dx) < Math.abs(dy) * 2) return;
  stepShelf(dx < 0 ? 1 : -1);
}, { passive: true });

/* Left goes forward, the way a page does. The ends do not wrap: arriving back
   at Current after Dropped without asking for it is disorienting, and the end
   of the list is a thing a thumb can feel. */
function stepShelf(by){
  const all = [...S.data.meta.status, 'All'];
  const at = all.indexOf(S.shelf);
  const next = at + by;
  if (at === -1 || next < 0 || next >= all.length) return;
  toShelf(all[next], by);
}

/* Changing shelf, however you asked for it.
   Two things had to be said once rather than in each of the two callers.

   The scroll goes back to the top. Tapping a chip while forty rows down used
   to leave you forty rows down a different shelf, looking at the middle of
   something you had never seen the start of — the most disorienting thing the
   app did, and invisible in a screenshot because it depends on where you were
   standing.

   And the grid comes in from the side it came from. A swipe that changes the
   contents with no movement at all reads as a redraw rather than as a place
   you moved to; 160ms of travel is the difference. `dir` is -1, 0 or 1 — zero
   for a tap, where there is no direction to honour and a fade is the whole
   animation. */
function toShelf(name, dir){
  if (S.shelf === name && !dir) return;
  S.shelf = name;
  if (S.view === 'solo') return enterSolo();
  if (S.picked.size) S.picked.clear();
  render();
  scrollTo({ top: 0 });
  const main = $('#main');
  main.classList.remove('came-l', 'came-r', 'came');
  void main.offsetWidth;                       // restart the animation
  main.classList.add(dir > 0 ? 'came-l' : dir < 0 ? 'came-r' : 'came');
  // Keep the chip you landed on in view, since the strip is scrollable and the
  // one that is lit may be off the end of it.
  const chip = $(`.tab[data-s="${CSS.escape(S.shelf)}"]`);
  if (chip) chip.scrollIntoView({ inline: 'center', block: 'nearest' });
}

document.addEventListener('input', ev => {
  // The card screen's copy. No tier word beside it: the card is already tall
  // and the number is the part he is setting.
  if (ev.target.id === 's-rating')
    $('#s-rating-out').textContent = fmt(Number(ev.target.value));
});

document.addEventListener('keydown', ev => {
  if (ev.key === 'Enter' && ev.target.closest('.sheet') &&
      ev.target.tagName === 'INPUT' && ev.target.type !== 'range'){
    ev.preventDefault(); return saveSheet();
  }
  // Alt rather than bare arrows: half this sheet is number fields and text
  // boxes, where an arrow key already means something.
  if (S.open && S.walk && ev.altKey && /^Arrow(Left|Right)$/.test(ev.key)){
    ev.preventDefault();
    return saveSheet(ev.key === 'ArrowRight' ? 1 : -1);
  }
  if (ev.target.id === 'art-q' && ev.key === 'Enter'){
    ev.preventDefault(); return artSearch(true);
  }
  if (ev.key === 'Escape'){
    if ($('#art').open) return;      // the dialog closes itself
    if (S.open) closeSheet();
    else if (S.picking) setPicking(false);
    else if (S.view === 'solo'){ S.view = 'shelf'; render(); }
    else hideToast();
  }
  // Left and right do what the swipe does, for the desk.
  if (S.view === 'solo' && S.solo &&
      !/^(INPUT|TEXTAREA|SELECT)$/.test(ev.target.tagName)){
    if (ev.key === 'ArrowLeft'){ ev.preventDefault(); return soloFile(''); }
    if (ev.key === 'ArrowRight'){ ev.preventDefault(); return soloFile(promoteTo()); }
  }
  if (ev.key === '/' && !/^(INPUT|TEXTAREA|SELECT)$/.test(ev.target.tagName)){
    ev.preventDefault(); $('#q').focus();
  }
});

$('#q').addEventListener('input', e => {
  S.q = e.target.value.trim();
  $('#q-clear').hidden = !S.q;
  if (S.view !== 'shelf') S.view = 'shelf';
  render();
});
$('#q-clear').addEventListener('click', () => {
  $('#q').value = ''; S.q = ''; $('#q-clear').hidden = true; render();
});

/* One delegated handler for both the header toolbar and the phone dock. */
document.addEventListener('click', ev => {
  const view = ev.target.closest('[data-view]');
  if (view){
    // Tapping the active view returns to the shelf, except from the shelf
    // itself — the dock's Shelf button should never toggle to nothing.
    const want = view.dataset.view;
    const next = (S.view === want && want !== 'shelf') ? 'shelf' : want;
    // Stats ignores the drawer, so leaving one applied would light an icon
    // over a number that does not reflect it. The card screen is the opposite:
    // the filters are what built its queue, so they survive the trip.
    if (next === 'stats') clearFilters();
    if (next === 'solo') return enterSolo();
    S.view = next;
    scrollTo({ top: 0 });
    return render();
  }
  const act = ev.target.closest('[data-act]');
  if (!act) return;
  if (act.dataset.act === 'filter') $('#drawer').classList.toggle('open');
  // Group Edit is editing a selection and there is no selection yet, so the
  // button is the way into making one, with the bar already saying so. Pressing
  // it again while it is lit is the way back out.
  if (act.dataset.act === 'done') return setPicking(false);
  // The two ways back out of an empty screen, which is the point of saying
  // which kind of empty it was.
  if (act.dataset.act === 'clear-q'){
    $('#q').value = ''; S.q = ''; $('#q-clear').hidden = true;
    return render();
  }
  if (act.dataset.act === 'clear-filters'){ clearFilters(); return render(); }
  if (act.dataset.act === 'retry'){
    $('#main').innerHTML = `<div class="grid">${'<div class="skel"></div>'.repeat(6)}</div>`;
    return load();
  }
  if (act.dataset.act === 'edit'){
    // Pressed from Stats or from Group Sort it means "take me to the grid and
    // start choosing", not "start choosing on a screen with nothing to choose".
    if (S.view !== 'shelf'){ S.view = 'shelf'; S.solo = null; setPicking(true, 'edit'); }
    else setPicking(!S.picking, 'edit');
  }
  if (act.dataset.act === 'new') $('#dlg').showModal();
  if (act.dataset.act === 'home') goTo(null);
});

for (const [id, key] of [['#f-type','type'],['#f-pub','pub'],['#f-sort','sort'],
                        ['#f-seen','seen'], ...AXES.map(a => ['#f-' + a, a])])
  $(id).addEventListener('change', e => {
    S[key] = e.target.value;
    if (S.view !== 'shelf') S.view = 'shelf';
    render();
  });
function clearFilters(){
  S.type = S.pub = S.seen = ''; S.sort = 'updated';
  for (const a of AXES){ S[a] = ''; $('#f-' + a).value = ''; }
  $('#f-type').value = $('#f-pub').value = $('#f-seen').value = '';
  $('#f-sort').value = 'updated';
}
$('#f-clear').addEventListener('click', () => { clearFilters(); render(); });

/* Select mode's bar. Three controls that say who is ticked and up to three
   that act on them, and no way out on it: the way out is the toolbar button he
   came in by, which is lit for as long as the mode is on, or Escape. A Done
   chip beside the actions was a second exit for a mode with an obvious one. */
$('#bulk-all').addEventListener('click', () => {
  for (const x of shown()) S.picked.add(x.id);
  render();
});
$('#bulk-none').addEventListener('click', () => { S.picked.clear(); render(); });
$('#bulk-del').addEventListener('click', bulkDelete);
$('#bulk-status').addEventListener('change', e => {
  const v = e.target.value;
  if (!v) return;
  // Moving something is deciding about it, so the mark comes with it — which
  // is the whole difference between this and a field you are correcting.
  bulkApply({ status: v, reviewed: true },
            `${S.picked.size} moved to ${v} and marked checked`);
  e.target.value = '';
});
/* Open the first of the selection with the rest of it behind the arrows. Select
   mode is left on the way in: the queue is a snapshot, so the ticks have done
   their job and a grid still covered in them behind the sheet is just noise. */
$('#bulk-walk').addEventListener('click', () => {
  const order = shown().map(x => x.id).filter(x => S.picked.has(x));
  if (!order.length) return;
  setPicking(false);
  openSheet(order[0], order);
  render();
});

$('#dlg-form').addEventListener('submit', async ev => {
  if (ev.submitter && ev.submitter.value !== 'ok') return;
  const title = $('#n-title').value.trim();
  if (!title) return;
  try {
    // The kind is not asked for. It is the door he is standing in.
    const r = await api('/api/create', { title, fields: {
      kind: S.kind, type: $('#n-type').value,
      status: $('#n-status').value } });
    $('#n-title').value = '';
    await load();
    openSheet(r.series.id);
    toast(`Added “${title}”`);
  } catch (e) { toast(e.message); }
});

/* Another tab, another device, or a phone left open on the shelf. Re-read when
   this one comes back into focus rather than showing a stale count. */
document.addEventListener('visibilitychange', () => {
  // Not while he is in the middle of something. A reload would throw away a
  // selection he has spent a minute ticking, and reset the card queue to its
  // first card — both of them worse than a count being a minute stale.
  if (!document.hidden && !S.open && !S.picking && S.view !== 'solo') load();
});

/* The hash is the only thing that says which tracker is open, so Back is the
   way out of one and a reload lands where he left off. */
function goTo(kind){
  const want = kind ? '#' + slug(kind) : '#';
  if (location.hash === want) enter(kind);   // no hashchange fires for a no-op
  else location.hash = want;
}
addEventListener('hashchange', () => { if (S.data) enter(kindFromHash()); });

load();

/* The worker serves this document off the disk so the app opens on the shelf
   rather than on white, and still refuses to cache a byte of the library; see
   sw.js for the whole of it. Registered because Chromium will not offer to
   install a site that has not got one, deferred to `load` so it never competes
   with the first /api/library fetch, and silently ignored on failure — an
   install prompt is not worth an error toast on a page that otherwise works. */
if ('serviceWorker' in navigator) {
  addEventListener('load', () => navigator.serviceWorker.register('/sw.js')
    .catch(() => {}));
  /* This document may have come off the disk, in which case the copy on the
     server may have moved on since. The worker knows; it is asked once the
     page is up, because a worker that volunteered the news the moment it had
     it would be talking to a document that is still loading and cannot hear.
     Reloading out from under him is the one thing not to do — he may be
     halfway through an edit — so it is an offer, in the toast that every other
     background event already uses. */
  navigator.serviceWorker.addEventListener('message', ev => {
    if (ev.data && ev.data.type === 'shell-stale')
      toast('A newer version of the tracker is on the server.',
            { label: 'Reload', run: () => location.reload() });
  });
  addEventListener('load', () => {
    navigator.serviceWorker.controller?.postMessage({ type: 'shell?' });
  });
}
</script>
</body>
</html>
