<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#000000">
<title>Media Tracker</title>

<!-- Installed-app metadata. The manifest is what turns "add to home screen"
     into a real launcher entry — its own window, its own task-switcher card,
     no address bar — rather than a bookmark that opens a tab. iOS reads the
     three apple- tags instead of most of the manifest, hence the overlap.
     `black` and not `black-translucent`: nothing in this stylesheet pads for
     safe-area-inset-top, so a translucent bar would put the header under the
     notch. -->
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/pwa/icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="/pwa/apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Media">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<style>
/* ── typefaces ──────────────────────────────────────────────────────────
   Self-hosted, converted to woff2 in the Nix store by service.nix. Literata
   is Google's e-reader face — the right serif for a shelf of books. Public
   Sans carries the interface, Plex Mono the figures, because chapter counts
   and ratings should line up in a column.                                 */
@font-face{font-family:Lit;src:url(/fonts/literata.woff2) format("woff2");
  font-weight:400;font-display:swap}
@font-face{font-family:Lit;src:url(/fonts/literata-semibold.woff2) format("woff2");
  font-weight:600;font-display:swap}
@font-face{font-family:Lit;src:url(/fonts/literata-italic.woff2) format("woff2");
  font-weight:400;font-style:italic;font-display:swap}
@font-face{font-family:Pub;src:url(/fonts/publicsans.woff2) format("woff2");
  font-weight:400;font-display:swap}
@font-face{font-family:Pub;src:url(/fonts/publicsans-medium.woff2) format("woff2");
  font-weight:500;font-display:swap}
@font-face{font-family:Pub;src:url(/fonts/publicsans-semibold.woff2) format("woff2");
  font-weight:600;font-display:swap}
@font-face{font-family:Mono;src:url(/fonts/mono.woff2) format("woff2");
  font-weight:400;font-display:swap}

/* ── tokens ─────────────────────────────────────────────────────────────
   Apple's dark system palette, which is a different idea from the Radix scale
   it replaces. Radix gives you twelve neutral steps and leaves the semantics
   to you; Apple gives you a handful of colours that are already answers —
   this is the page, this is a raised surface, this is a control's ground, this
   is a label nobody needs to read first. Fewer greys, each with a job.

   Three things change the whole look and all three are deliberate:

   The page is #000, not #111. On an OLED phone black is the absence of light
   rather than a very dark grey, so a cover sits in nothing at all and the
   screen ends where the content ends. It is also what makes a raised surface
   read as raised without drawing a line around it.

   Surfaces go up in lightness, never outward in outline. #000 page, #1C1C1E
   card, #2C2C2E for a control's own ground. A dark interface built out of 1px
   borders is a wireframe of itself; the system apps almost never draw one.

   Controls sit on translucent FILLS rather than opaque greys — #787880 at
   36/32/24/18% — so a pill on a card and the same pill on the page are the
   same token and both look right. That is the trick the fixed greys cannot do.

   Labels are #EBEBF5 stepped down by alpha. Apple's steps are 60/30/18%;
   this file keeps 66/52 instead, because tertiary at 30% measures 2.6:1 on a
   #1C1C1E card and everything here that uses the dimmest label is small text
   you actually have to read. Apple's hue, this app's contrast floor — the same
   trade the old --ink-3 comment made, kept through the change of palette.

   Values are the measured dark-mode ones; Apple publishes swatches, not hex,
   and reserves the right to move them. */
:root{
  color-scheme:dark;

  /* The grey ladder, on Apple's rungs. Same names as before so every rule in
     this file still means what it meant; the rungs themselves moved. */
  --g1:#000000;  --g2:#1C1C1E;  --g3:#2C2C2E;  --g4:#3A3A3C;
  --g5:#48484A;  --g6:#545456;  --g7:#636366;  --g8:#7C7C80;
  --g9:#8E8E93;  --g10:#98989D; --g11:#AEAEB2; --g12:#F2F2F7;

  --paper:var(--g1);      /* the page */
  --card:var(--g2);       /* raised surface: sheet, card, grouped row */
  --sunk:var(--g3);       /* a control's own ground where it must be opaque */
  --ink:#FFFFFF;
  --ink-2:rgba(235,235,245,.70);
  --ink-3:rgba(235,235,245,.52);   /* 4.9:1 on --card */

  /* Fills. The ground under a control, as a tint of the surface rather than a
     colour of its own — which is why the same pill works on the page, on a
     card and inside the sheet without a variant for each. */
  --fill-1:rgba(120,120,128,.36);
  --fill-2:rgba(120,120,128,.30);
  --fill-3:rgba(120,120,128,.22);
  --fill-4:rgba(120,120,128,.16);

  /* Separators, for the few places a line still earns its keep: between rows
     of a list, where the alternative is guessing where one row ends. */
  --rule:rgba(84,84,88,.65);
  --rule-2:rgba(84,84,88,.34);

  /* Accent: Radix `iris`, used at the steps it was designed for — 9 as a solid
     fill, 11 as text on dark, 3 as a subtle tinted background, 7 as a border.
     Dark UIs cannot take a fully saturated hue: it optically vibrates against
     the ground and struggles to clear 4.5:1, which is why every guide says to
     desaturate 20-30% for dark mode. Radix's dark scales are already built to
     that, which is the reason for using them rather than mixing by hand. */
  /* The accent, and the only hue in this file that means "you can press this".
     It was indigo, which on a black ground with warm cover art everywhere put
     a violet cast over the whole app — and violet is a colour with an opinion,
     which is the wrong thing for the one token that appears on every screen.
     systemBlue is the tint every Apple app ships with, it is cool enough to
     sit behind artwork instead of arguing with it, and it has no second
     meaning here now that nothing else in the interface is blue. */
  --a3:rgba(10,132,255,.20);  --a5:rgba(10,132,255,.36);  --a7:rgba(10,132,255,.55);
  --a9:#0A84FF;  --a10:#3D9BFF; --a11:#6FB8FF;

  /* Chosen, without spending colour on it.
     The accent was doing two jobs — "this is the button that acts" and "this
     one of eight is the one you picked" — and a screen where eight chips, a
     tab and a dock item are all wearing the accent at once has no accent left,
     just a violet cast. So a selection is a RAISED SURFACE now: the chip comes
     up out of the track and the label goes to full white, which is what a
     segmented control does and what the eye reads as "this one" without any
     hue at all. That hands the colour back to the two things that deserve it —
     the five shelf markers, which mean something, and the covers, which are
     the whole point of the screen. */
  --sel:rgba(255,255,255,.16);
  --sel-2:rgba(255,255,255,.22);

  /* Shelf markers. Three hues for the shelves where something is still true of
     the book, two greys for the two where nothing is: Read and Dropped are
     finished states and are told apart by lightness rather than by hue, which
     leaves the colour to mean "this is live".

     The mustard that was on Hold is now Radix `orange` at step 11 — the same
     idea, at a lightness that reads as orange on a dark ground instead of as
     something spilled on it. */
  /* Named for the shelves, which are no longer named after reading: the token
     names have to track them because the stats bars resolve --<status> from
     the status name itself. */
  /* The shelf markers, which were five unrelated hues — green, blue, orange
     and two greys — for five values of one variable. Five hues cannot help
     being read as five separate facts, so a row of tabs came out looking like
     a box of highlighters, and the word sitting next to every single one of
     those dots was already telling you which shelf it was. Apple's line on
     this is that the power of colour to call attention is heightened when it
     is used sparingly, and that nothing should lean on colour alone; both
     point the same way here.

     So it is one ramp instead of five choices, and the thing it varies is
     saturation, not hue: vivid green for the shelf a book is alive on, then
     progressively greyer through queued and paused, and finally the two
     greys for the shelves where nothing is true of it any more. The order is
     the meaning — how alive is this — and because every step is the same
     green walking toward grey, the five of them read as one scale rather than
     as five decisions somebody made on five different days. */
  --current:#30D158;   /* vivid       — you are in it */
  --later:#6FBF8A;     /* muted       — queued */
  --hold:#8FAE9A;      /* nearly grey — paused */
  --finished:#AEAEB2;  /* grey        — done */
  --dropped:#8E8E93;   /* dimmer grey — abandoned */

  /* Semantic, on one control: the one that deletes a series. */
  --danger:#FF453A;    /* systemRed */
  --danger-dim:#B3352E;

  /* Type, as a scale with names rather than a pile of sizes. These are
     Apple's iOS text styles at their default Dynamic Type size, size and
     leading both, because the pairs are the part that does the work: 17/22 is
     a different texture from 17/26, and picking sizes without picking leading
     is how a screen ends up with six kinds of nearly-the-same paragraph.

     Two families, one scale. The sans is the interface; the serif is reserved
     for the things that are a *work* — a series title — which is the one place
     this app has a voice of its own and the one place it should keep it.

        Title 1   28/34     the mast on the way in
        Title 2   22/28     a sheet's heading
        Title 3   20/25     a heading on a phone
        Headline  17/22     the same size as body, carried by weight
        Body      17/22     text meant to be read
        Callout   16/21     text meant to be read, in a tighter spot
        Subhead   15/20     the interface's own voice: this is the default
        Footnote  13/18     labels, captions, the second line of a row
        Caption   12/16     metadata under a cover
        Caption 2 11/13     counters and badges, and nothing else

     Apple's floor is 11pt and its default is 17pt. Nothing here goes under
     the floor. The default sits at Subhead rather than Body because most text
     on this screen is not prose being read, it is a label being scanned. */
  --type-title1:   600 28px/34px Lit,Georgia,serif;
  --type-title2:   600 22px/28px Lit,Georgia,serif;
  --type-title3:   600 20px/25px Lit,Georgia,serif;
  --type-headline: 600 17px/22px Pub,system-ui,sans-serif;
  --type-body:     400 17px/22px Pub,system-ui,sans-serif;
  --type-callout:  400 16px/21px Pub,system-ui,sans-serif;
  --type-subhead:  400 15px/20px Pub,system-ui,sans-serif;
  --type-footnote: 400 13px/18px Pub,system-ui,sans-serif;
  --type-caption:  400 12px/16px Pub,system-ui,sans-serif;
  --type-caption2: 400 11px/13px Pub,system-ui,sans-serif;

  /* The material the chrome is made of.
     Apple's rule for this is one sentence: controls and navigation live on a
     layer above the content, and you get the separation from a material the
     content passes under, not from a solid fill with a line ruled under it.
     The line is the giveaway — it says the bar is a piece of the page that
     happens to be stuck to the top, and everything below it is a second
     document. A translucent, blurred bar says the shelf is one continuous
     thing that carries on underneath.

     The saturation boost is not decoration: blurring alone greys out whatever
     is behind it, and covers are the most colourful thing on this screen.
     Pushing saturation back up is what keeps a cover recognisable as it slides
     under the header instead of turning into a smudge. */
  --material:rgba(16,16,18,.62);          /* the page, thinned */
  --material-edge:rgba(255,255,255,.08);  /* a hairline, not a rule */

  --gap:16px;
  --tap:44px;
  /* On black, a drop shadow is a shadow cast onto nothing: elevation here is
     carried by lightness, and the shadow only has to keep a floating thing
     from looking pasted on. */
  --shadow:0 1px 2px rgba(0,0,0,.6), 0 8px 28px rgba(0,0,0,.55);

  /* Radius, on the scale every serious design system converged on: ~6px for
     controls, ~12px for containers, full-round for nothing but badges.
     Vercel's Geist caps functional UI at 12px; Linear uses exactly 6 and 12;
     GitHub's Primer sits lower still. The previous pass had 999px pills on
     every button and a 28px sheet, which is a phone-app costume rather than a
     scale. Full-round survives only where the shape *is* the content: the 7px
     status dots.

     Every step went up by two on the Apple pass. The argument above is about
     the difference between a scale and a costume, and it still holds — but it
     was written against 999px pills, and 6px on a 44px control is sharp enough
     to read as a web form rather than as a control. 8 and 12 and 16 are the
     numbers the system sits at for a chip, a field and a card, and the ratios
     between them are the same ratios as before. */
  --r-sm:6px;          /* tags, counters, small inline chips */
  --r-md:8px;          /* buttons, inputs, selects, tabs */
  --r-lg:12px;         /* cover plates, thumbnails, search */
  --r-xl:16px;         /* panels, slabs, dialogs, the sheet's lip */
  --r-dot:999px;       /* dots, and nothing else */
}

*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
/* While the bottom sheet is up, the shelf behind it must not scroll —
   otherwise a drag that misses the sheet pans 300 covers out from under it. */
body.locked{overflow:hidden}
body{
  margin:0;background:var(--paper);color:var(--ink);
  font-family:Pub,system-ui,sans-serif;font-size:15px;line-height:1.5;
  -webkit-font-smoothing:antialiased;overflow-wrap:break-word;
}
button,input,select,textarea{font:inherit;color:inherit}
/* The dock and the add button are `display:flex` inside a media query, which
   is a class beating the UA's `[hidden]{display:none}` on specificity — so on
   a phone they stayed on screen over the portal, where there is no shelf for
   them to act on. One rule, rather than a `[hidden]` guard on each. */
[hidden]{display:none !important}
button{cursor:pointer}

/* Keyboard focus. There was none worth the name: a few controls had their own
   and everything else got whatever the browser drew, which on a dark ground is
   a thin black outline nobody can see. One ring, in the accent, on everything
   that takes focus — and `:focus-visible` rather than `:focus`, so it appears
   for the keyboard and never for the mouse. */
:focus-visible{outline:2px solid var(--a9);outline-offset:2px;border-radius:var(--r-sm)}
.pick:focus-visible,.tab:focus-visible,.chip:focus-visible,.btn:focus-visible,
.ico:focus-visible,.pip:focus-visible,select:focus-visible,.tbtn:focus-visible{
  outline-offset:1px}

/* ── the press ──────────────────────────────────────────────────────────
   Every tap used to paint the platform's own translucent rectangle over
   whatever was under the finger: a quarter-second behind the touch, square
   over rounded corners, in a blue from no palette on this page. It is the one
   thing on screen that says "this is a web page in a browser" rather than an
   app, and it is a single line to turn off.

   Turning it off and stopping there is worse than leaving it: a control that
   does nothing at all under the finger reads as broken, and the hover states
   this app is full of never fire on a touchscreen. So every pressable thing
   gets its own. A press is the hover look with the movement made literal —
   the control goes down 3% and comes back — and `:active` is a press whatever
   pushed it, so the mouse gets it too. */
*{-webkit-tap-highlight-color:transparent}
.btn:active,.pick:active,.tab:active,.ico:active,.plus:active,
.chip:active:not(:disabled),.stepper button:active,.switch button:active,
.pager .step:active:not(:disabled),.seek button:active,.door:active,
.alts .ico:active{transform:scale(.97)}
/* The neutral controls darken the way they do under a cursor. */
.btn:active,.pick:active,.tab:active,.chip:active:not(:disabled),
.stepper button:active,.switch button:active,
.pager .step:active:not(:disabled){
  background:var(--fill-2);border-color:transparent;color:var(--ink)}
.ico:active{background:var(--fill-3);color:var(--ink)}
/* The two that are already a solid colour go one stop deeper instead. */
.btn.primary:active,.chip.go:active:not(:disabled){
  background:var(--a10);border-color:var(--a10);color:#fff}
/* A pill that is already chosen must not turn grey the moment it is touched —
   the press would read as un-choosing it. It keeps its tint and just moves. */
.pick[aria-pressed=true]:active,.switch button[aria-pressed=true]:active,
.chip.on:active{background:var(--sel-2);border-color:transparent;color:var(--ink)}
/* The card presses as one piece, cover and all, which is the whole object he
   aimed at rather than a rectangle drawn around it. */
.book:active .plate{transform:scale(.97);border-color:var(--a7)}
a{color:var(--a11);text-underline-offset:2px}
.mono{font-family:Mono,ui-monospace,monospace;font-variant-numeric:tabular-nums}
/* A field's name. This was 11px of tracked capitals, which is a look — the
   dashboard look — and it costs twice: capitals lose the word shapes that make
   a label scannable, and tracking a 11px face apart makes the eye do the
   assembling. The system apps set these at footnote size in sentence case and
   let the colour do the demoting, which reads as a label without shouting that
   it is one. The words in the markup were already sentence case; it was the
   stylesheet that was shouting. */
.lbl{font:var(--type-footnote);color:var(--ink-3);font-weight:500;
  letter-spacing:0}

/* ── masthead ───────────────────────────────────────────────────────── */
header{
  position:sticky;top:0;z-index:40;
  background:var(--material);
  -webkit-backdrop-filter:saturate(180%) blur(22px);
  backdrop-filter:saturate(180%) blur(22px);
  border-bottom:1px solid var(--material-edge);
  padding:10px max(14px,env(safe-area-inset-right)) 0 max(14px,env(safe-area-inset-left));
}
/* Where the browser cannot blur, a translucent bar is just a washed-out bar
   with the covers showing through it as mud. Go solid instead — the layout is
   identical, only the material is missing. */
@supports not ((backdrop-filter:blur(1px)) or (-webkit-backdrop-filter:blur(1px))){
  header{background:var(--card);border-bottom-color:var(--rule)}
}
/* On a phone the header is the top of a single continuous surface, so the rule
   under it is one line too many — the shelf reads as one sheet of paper. */
@media (max-width:640px){
  header{padding-top:6px}
  @supports not ((backdrop-filter:blur(1px)) or (-webkit-backdrop-filter:blur(1px))){
    .dock{background:var(--card);border-top-color:var(--rule)}
  }
}
/* A navigation bar: the way back on the leading edge, the title next to it,
   and every action on the trailing edge. The gap is 2px because these are
   44px targets with a 20px glyph in the middle of each — the air between the
   glyphs is already 24px, and adding 12 on top of that scattered them across
   the bar instead of grouping them into a set of controls. */
.bar{display:flex;align-items:center;gap:2px;min-height:36px}
/* min-width:0 so the title truncates instead of shoving the toolbar off the
   right edge — without it a long name makes the whole page scroll sideways. */
/* The auto margin lives here rather than on the tally, which is what made the
   toolbar look like it had been dropped on the bar from a height: under 460px
   the tally is hidden, the auto margin went with it, and the two icons that
   survive on a phone ended up leaning against the title with the whole right
   half of the bar empty beside them. On the title it is unconditional. */
h1{font:var(--type-headline);margin:0 auto 0 6px;
  white-space:nowrap;letter-spacing:-.01em;
  min-width:0;overflow:hidden;text-overflow:ellipsis}
.tally{display:flex;align-items:baseline;gap:10px;flex:none;margin-right:8px}
.tally b{font-family:Mono,monospace;font-size:16px;font-weight:400}
.tally i{font-style:normal;font:var(--type-caption);color:var(--ink-3)}
@media (max-width:560px){.tally span:nth-child(2){display:none}}
/* Below this the tally is what pushes the title into an ellipsis, and it is
   redundant anyway — the tab strip right underneath carries a count per shelf
   plus the total on "All". */
@media (max-width:460px){.tally{display:none}}

.ico{flex:none;width:36px;height:36px;display:grid;place-items:center;
  background:none;border:1px solid transparent;color:var(--ink-2);border-radius:var(--r-md)}
@media (max-width:640px){.ico{width:var(--tap);height:var(--tap)}}
.ico:hover{color:var(--ink);background:var(--fill-4)}
.ico svg{width:20px;height:20px;fill:currentColor;stroke:none}
.ico.on{color:var(--a11);background:var(--a3)}

.seek{display:flex;align-items:center;gap:9px;margin:8px 0 10px;
  border:1px solid transparent;background:var(--fill-3);padding:0 14px;
  height:40px;border-radius:var(--r-lg);transition:border-color .12s}
.seek:focus-within{border-color:var(--a7)}
.seek svg{width:17px;height:17px;flex:none;color:var(--ink-3);fill:currentColor;
  stroke:none}
.seek input{flex:1;min-width:0;border:0;background:none;outline:none;height:100%;
  font-size:16px}   /* 16px stops iOS zooming on focus */
.seek button{border:0;background:none;color:var(--ink-3);padding:0 2px}

/* On a wide screen the search field and the shelf picker share a row. Stacked,
   the header was a title, a full-width search field and a strip of chips —
   three rows and about 160px of chrome above every screen in the app, on a
   window with more width than it knows what to do with and no shortage of
   horizontal room for both. The phone keeps them stacked, where the width
   genuinely is not there. */
@media (min-width:1280px){
  header{display:grid;grid-template-columns:minmax(0,1fr) 340px;
    column-gap:20px;align-items:center;
    grid-template-areas:"bar bar" "tabs seek" "drawer drawer"}
  .bar{grid-area:bar}
  .seek{grid-area:seek;margin:2px 0 10px}
  .tabs{grid-area:tabs}
  .drawer{grid-area:drawer}
}

/* status tabs — the primary navigation, because a shelf is sorted by what you
   are doing with a book, not by its title */
/* The strip scrolls, and the mask is how it says so: the last chip fades out
   at the edge rather than being sliced in half by it, which is the difference
   between "there is more this way" and "something is broken". When the chips
   fit there is empty space at that edge and the mask has nothing to act on. */
.tabs{display:flex;gap:7px;overflow-x:auto;scrollbar-width:none;
  padding:2px 0 10px;margin:0 -2px;scroll-padding:0 14px;
  -webkit-mask-image:linear-gradient(90deg,#000 calc(100% - 26px),transparent);
  mask-image:linear-gradient(90deg,#000 calc(100% - 26px),transparent)}
.tabs::-webkit-scrollbar{display:none}
.tab{
  flex:none;background:var(--fill-4);border:1px solid transparent;
  border-radius:var(--r-lg);
  padding:0 14px;height:34px;color:var(--ink-2);font:var(--type-footnote);
  font-weight:500;
  display:flex;align-items:center;gap:7px;white-space:nowrap;
}
@media (max-width:640px){.tab{height:36px;padding:0 15px}}
.tab em{font-style:normal;font-family:Mono,monospace;font-size:11px;opacity:.7}
.tab:hover{color:var(--ink)}
/* The shelf marker rides in the chip as a dot. Which means the chip itself
   can never be a solid light fill: Reading's marker is the brightest of the
   five, and on a white chip it vanished exactly when it mattered — the shelf
   you were looking at. A tinted surface is the fix, and it is also the
   documented pattern: step 3 ground, step 7 border, step 11 label. Both chip
   states are dark, so all five markers stay visible in both. */
.tab::before{content:"";width:7px;height:7px;border-radius:var(--r-dot);
  background:var(--dot,var(--ink-3));flex:none}
.tab[aria-selected=true]{background:var(--sel);border-color:transparent;
  color:var(--ink);font-weight:600}
.tab[aria-selected=true] em{opacity:.8}
.tab[data-s=Current]{--dot:var(--current)} .tab[data-s=Later]{--dot:var(--later)}
.tab[data-s=Hold]{--dot:var(--hold)}       .tab[data-s=Finished]{--dot:var(--finished)}
.tab[data-s=Dropped]{--dot:var(--dropped)}
/* "All" is not a shelf and has no marker of its own. */
.tab[data-s=All]::before{display:none}

/* Six unlabelled dropdowns in a row is a puzzle: "Any publication" and "Any
   tag" tell you what they will accept, never what they are asking. Each one
   now carries its own question above it, and the tag filter is split into the
   three axes the vocabulary actually has, so choosing a setting and a genre
   at once is possible rather than a choice between them. */
/* ── the two doors ──────────────────────────────────────────────────────
   Where a row of kind chips used to be. Reading and Watching were never a
   filter over one shelf — they are two shelves that happen to share a schema,
   and the chip strip made choosing between them a thing you did on the way
   past, with an "All" in front that mixed nine hundred manhwa into five films.
   So the app opens on neither, and you walk into one. */
/* Top-aligned, not floating in the middle. A large title at the top left is
   where every system app starts, and centring two cards in the void was what
   made the screen read as a placeholder somebody had not finished. */
.hall{display:flex;flex-direction:column;gap:22px;padding:28px 0 40px;
  width:min(100%,640px);margin:0 auto}
.mast b{font-family:Lit,Georgia,serif;font-size:34px;font-weight:600;
  letter-spacing:-.025em;line-height:1}
/* An explicit width, because auto-fit inside a shrink-to-fit flex item
   resolves to one column and stacks the two doors into a list. */
.portal{display:grid;gap:18px;width:100%;
  grid-template-columns:repeat(auto-fit,minmax(260px,1fr))}
/* `min-width:0` is load-bearing: a grid item's automatic minimum size is its
   content, and the content here is a row of cover images whose intrinsic width
   is whatever the publisher uploaded. Without it the track ignores the 260px
   minimum, grows to fit one full-size cover, and the door runs off the screen. */
.door{
  display:flex;flex-direction:column;gap:14px;text-align:left;min-width:0;
  padding:14px;border:1px solid transparent;background:var(--card);
  border-radius:var(--r-xl);color:inherit;transition:transform .14s,background .14s;
}
.door:hover{background:var(--g3);transform:translateY(-2px)}
.door:active{transform:scale(.99)}
/* The covers. Five across whatever width the door came out at, so they stay a
   row rather than becoming a scroll: the point is the glance, not the browse.
   Each one is cropped to the same 2:3 as every other cover in the app. */
.door-art{display:flex;gap:7px;min-width:0}
.door-art img{flex:1;min-width:0;aspect-ratio:2/3;object-fit:cover;display:block;
  border-radius:var(--r-md);background:var(--fill-4)}
.door-line{display:flex;align-items:baseline;gap:10px;padding:0 4px 4px}
.door b{font-family:Lit,Georgia,serif;font-size:24px;font-weight:600;
  letter-spacing:-.02em;line-height:1.1}
.door span{font:var(--type-footnote);color:var(--ink-3);margin-left:auto}
/* A tracker with nothing in it has no covers to show, so the door is just its
   line — and it gets the height back that the artwork would have taken, or it
   reads as a card with a hole in it. */
.door:not(:has(.door-art)) .door-line{padding:10px 4px}
@media (max-width:640px){
  .hall{min-height:calc(100dvh - 120px);gap:26px;
    padding:8px max(14px,env(safe-area-inset-left)) 30px;align-items:stretch}
  .portal{grid-template-columns:1fr;gap:14px}
  .mast b{font-size:29px}
  .door{padding:24px 22px}
}
/* The masthead's back arrow. A tracker is somewhere you are inside of, so
   there has to be a way out that is not the browser's. */
.out{flex:none;margin-left:-8px}

.drawer{display:none;gap:10px 12px;padding:4px 0 12px;
  grid-template-columns:repeat(auto-fit,minmax(140px,1fr))}
.drawer.open{display:grid}
.filt{display:flex;flex-direction:column;gap:5px;min-width:0}
.filt>.lbl{padding-left:2px}
/* A select, with the browser's own chrome taken off it. The drawer had six of
   these and every one of them drew the platform's arrow in the platform's
   grey at the platform's size, which is the one thing on the screen that is
   not from this app. `appearance:none` plus two little gradients is the
   standard way to draw the arrow yourself, and it is the same arrow the
   scope picker uses, so all the menus in the app agree. */
select,.chip{
  height:36px;border:1px solid transparent;background:var(--fill-3);
  color:var(--ink);padding:0 12px;border-radius:var(--r-md);font:var(--type-footnote);
  width:100%;
}
select{
  -webkit-appearance:none;appearance:none;padding-right:30px;
  background-image:linear-gradient(45deg,transparent 50%,var(--ink-3) 50%),
                   linear-gradient(135deg,var(--ink-3) 50%,transparent 50%);
  background-position:calc(100% - 15px) 16px,calc(100% - 11px) 16px;
  background-size:4px 4px,4px 4px;background-repeat:no-repeat;
}
@media (max-width:640px){
  select{background-position:calc(100% - 15px) 20px,calc(100% - 11px) 20px}
}
.chip{width:auto}
/* Hover lightens the fill. It used to draw a grey ring — which is what you do
   to an outlined control, and none of these have been outlined since the app
   went to fills. A ring appearing on hover over a filled chip reads as a
   second, different control arriving under the pointer. */
select:hover,.chip:hover{background:var(--fill-2);color:var(--ink)}
.chip.on{background:var(--sel);border-color:transparent;color:var(--ink)}
/* The bar is opened by Edit and the bar has nine controls on it, so the one he
   came for says so. Solid, not tinted: `.on` already means "this toggle is
   thrown" three chips along, and two meanings of one look is a bar you read. */
.chip.go{background:var(--a9);border-color:var(--a9);color:#fff;font-weight:600}
.chip.go:hover:not(:disabled){background:var(--a10);border-color:var(--a10);color:#fff}
/* The one control here that cannot be undone. Not red until you are on it —
   a red chip in a resting bar is an alarm about nothing. */
.chip.danger:hover:not(:disabled){background:rgba(255,69,58,.18);color:var(--danger)}
.chip:disabled{opacity:.4}
/* Reset has no question of its own, so it aligns to the bottom of the row. */
.filt.act{justify-content:flex-end}

/* ── bottom dock (phones) ───────────────────────────────────────────────
   Six icons plus a title and a tally do not fit across a 390px phone: the
   toolbar overflowed and took the whole page into a sideways scroll, with Add
   and the theme toggle pushed off the right edge entirely.
   So on narrow screens the view switches move down here, where a thumb can
   actually reach them, and the header keeps only search, filter and theme. */
.dock{display:none}
@media (max-width:640px){
  /* The dock floats. A bar welded to the bottom edge cuts the screen off and
     turns the shelf into a window with a frame under it; lifted clear, with
     the covers passing underneath, the shelf runs to the bottom of the glass
     and the controls are plainly a layer on top of it. This is the one shape
     in this file taken from iOS 26 rather than from the guidelines — the
     guidelines say controls float above content, and this is what that looks
     like when you take it literally. */
  .dock{
    display:flex;position:fixed;z-index:45;
    left:max(12px,env(safe-area-inset-left));
    right:max(12px,env(safe-area-inset-right));
    bottom:calc(10px + env(safe-area-inset-bottom));
    border-radius:26px;overflow:hidden;
    background:var(--material);border:1px solid var(--material-edge);
    box-shadow:var(--shadow);
    -webkit-backdrop-filter:saturate(180%) blur(22px);
    backdrop-filter:saturate(180%) blur(22px);
    padding:0 4px;
  }
  .dock button{
    flex:1;min-width:0;min-height:54px;display:flex;flex-direction:column;
    align-items:center;justify-content:center;gap:3px;
    background:none;border:0;color:var(--ink-3);padding:7px 2px 6px;
  }
  /* The icon sits in its own pill, which is what fills in when the view is
     active. Colouring the glyph alone gives a 20px target's worth of feedback
     on a 58px control; the pill is the part you can actually see land. */
  .dock i{display:grid;place-items:center;width:54px;height:30px;
    border-radius:var(--r-dot);transition:background .14s}
  .dock svg{width:22px;height:22px;fill:currentColor;stroke:none}
  .dock span{font:var(--type-caption2);font-weight:500}
  .dock button.on{color:var(--a11)}
  .dock button.on i{background:var(--a3)}
  .dock button.on span{font-weight:600}
  /* Group Sort and Group Edit are the same kind of thing — a way of going
     through a shelf in bulk — and they were in different places, one a view in
     the dock and one an icon in the toolbar, which made them look like
     unrelated features. They are side by side in the dock now. The toolbar
     keeps what acts on what you are looking at right now: filter, and add.
     Going back to the trackers is the ← at the leading edge, which is where a
     way back belongs and is why it left the dock: a tab bar is for places you
     go, not for the way out. */
  header .bar [data-view],
  header .bar [data-act=edit]{display:none}
}

/* Add is the one thing here that creates rather than navigates, so on a phone
   it leaves the row of view switches and becomes the floating button — the
   same split Signal makes between its nav bar and its compose button. */
/* The floating add button used to live here. It existed because the toolbar
   was broken on a phone — the tally hid at 460px, the auto margin that pushed
   the actions right went with it, and the icons ended up leaning against the
   title — so a button floating over the shelf was a way around a bar that had
   stopped working. The bar works now and + is back in it, so the button, its
   markup and the line of render() that hid it on the sort screen are all
   gone rather than left behind as a hidden element nobody can reach. */

/* ── shelf ──────────────────────────────────────────────────────────── */
/* No width cap. A measure exists for prose, and a wall of covers is not
   prose: capping this at 1500px left a wide panel with two hands of empty
   margin and the same twelve entries per row it had at half the size. The
   grid takes the screen; the panels that *are* prose (`.panel`, `.solo`)
   keep their own measure and stay centred inside it. */
main{padding:var(--gap) max(14px,env(safe-area-inset-right)) 96px
  max(14px,env(safe-area-inset-left))}
body.selecting main{padding-bottom:calc(76px + env(safe-area-inset-bottom))}

/* clear the dock, plus the home indicator on gesture-nav phones */
@media (max-width:640px){
  main{padding-bottom:calc(96px + env(safe-area-inset-bottom))}
  #toast{bottom:calc(86px + env(safe-area-inset-bottom))}
}
.grid{display:grid;gap:18px 14px;
  grid-template-columns:repeat(auto-fill,minmax(148px,1fr))}
@media (max-width:420px){.grid{grid-template-columns:repeat(auto-fill,minmax(128px,1fr));
  gap:14px 10px}}

.book{position:relative;display:flex;flex-direction:column;gap:7px;
  background:none;border:0;padding:0;text-align:left;color:inherit;
  --dot:var(--ink-3)}
.plate{
  position:relative;aspect-ratio:2/3;background:var(--fill-4);overflow:hidden;
  border:1px solid var(--rule-2);border-radius:var(--r-lg);box-shadow:var(--shadow);
  cursor:pointer;transition:transform .12s ease,border-color .14s;
}
@media (max-width:640px){.plate{border-color:transparent}}
.plate img{width:100%;height:100%;object-fit:cover;display:block}
.book:hover .plate{border-color:var(--a7)}
/* No artwork: set the title on a tinted ground rather than leave a hole. The
   hue comes from the title itself, so a book always looks like itself. */
.fallback{position:absolute;inset:0;display:grid;place-items:center;padding:10px;
  font-family:Lit,Georgia,serif;font-size:13px;line-height:1.3;text-align:center;
  color:var(--ink-2);background:
    linear-gradient(160deg,hsl(var(--h) 7% 24%),hsl(var(--h) 8% 15%))}

/* The status stripe was flush to a square corner; on a rounded plate it has to
   be inset or it is clipped into a wedge. */
.mark{position:absolute;top:10px;left:0;width:3px;height:26px;background:var(--dot);
  border-radius:0 var(--r-sm) var(--r-sm) 0}
.book[data-s=Current]{--dot:var(--current)} .book[data-s=Later]{--dot:var(--later)}
.book[data-s=Hold]{--dot:var(--hold)}       .book[data-s=Finished]{--dot:var(--finished)}
.book[data-s=Dropped]{--dot:var(--dropped)}

.score{position:absolute;top:8px;right:8px;padding:3px 9px;
  border-radius:var(--r-dot);
  background:rgba(28,28,30,.55);color:#fff;font-family:Mono,monospace;
  font-size:11px;
  -webkit-backdrop-filter:saturate(180%) blur(12px);
  backdrop-filter:saturate(180%) blur(12px)}
.foot{position:absolute;left:0;right:0;bottom:0;display:flex;align-items:flex-end;
  gap:6px;padding:22px 6px 6px;
  background:linear-gradient(transparent,rgba(0,0,0,.85))}
.ch{font-family:Mono,monospace;font-size:12px;color:var(--ink);
  text-shadow:0 1px 2px rgba(0,0,0,.5)}
.ch b{font-weight:400;font-size:9px;opacity:.7;letter-spacing:.06em}
/* One more chapter, without opening anything. It sits on the cover, so it is
   made the way everything that sits on a photo is made: a circle of blurred
   glass, no outline. The bordered black square it replaces was drawing a box
   round a button on top of a picture, which is two frames deep on an element
   the size of a thumbnail. Round because it is the only control here that
   overlays artwork, and a circle is what reads as a button against anything. */
.plus{
  margin-left:auto;width:30px;height:30px;flex:none;border-radius:var(--r-dot);
  border:0;background:rgba(28,28,30,.55);
  color:#fff;font-size:17px;line-height:1;display:grid;place-items:center;
  opacity:0;transition:opacity .12s,background .12s;
  -webkit-backdrop-filter:saturate(180%) blur(12px);
  backdrop-filter:saturate(180%) blur(12px);
}
.book:hover .plus,.plus:focus-visible{opacity:1}
.plus:hover{background:var(--a9);color:#fff}
/* No hover to reveal it on a touch screen, and 28px is too small to hit while
   holding a phone — so it is always visible and grows to a real tap target. */
@media (hover:none){.plus{opacity:1;width:36px;height:36px;font-size:19px}}

.name{font:600 15px/20px Lit,Georgia,serif;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;
  overflow:hidden;cursor:pointer}
.sub{font:var(--type-caption);color:var(--ink-3);display:flex;gap:6px;
  margin-top:-2px}
.sub span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* Nothing here, said properly.
   Every one of these used to be one grey sentence sitting a little way down
   the page — and the same sentence, whether the shelf was genuinely empty,
   the search had missed, or the filters had cut everything out. Three quite
   different situations, one of which is a dead end and two of which have an
   obvious way out, all reported identically and none of them saying what to
   do about it.
   So: a glyph, a line that names the situation, a sentence that explains it,
   and — where there is one — the button that fixes it. Centred in what is
   left of the screen rather than hanging under the header, because an empty
   screen's content is the middle of it. */
.empty{padding:60px 20px;text-align:center;color:var(--ink-3);
  font:var(--type-callout)}
.nowt{display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:6px;text-align:center;padding:40px 24px;
  min-height:min(58dvh,420px)}
.nowt svg{width:44px;height:44px;fill:var(--ink-3);opacity:.45;margin-bottom:8px}
.nowt b{font:var(--type-headline);color:var(--ink)}
.nowt p{margin:0;font:var(--type-subhead);color:var(--ink-3);max-width:30ch;
  line-height:1.5}
.nowt .btn{margin-top:14px;background:var(--fill-3);color:var(--a11);
  font-weight:600;padding:0 22px}
.nowt .btn:hover{background:var(--fill-2);color:var(--a11)}

/* The waiting tiles. The shape of a cover, the colour of a fill, and a sheen
   that crosses them every second and a half so the screen reads as busy rather
   than as broken. Stopped entirely for anyone who has asked the system for
   less motion — a looping animation is exactly what that setting is about. */
.skel{aspect-ratio:2/3;border-radius:var(--r-lg);background:var(--fill-4);
  position:relative;overflow:hidden}
.skel::after{content:"";position:absolute;inset:0;
  background:linear-gradient(100deg,transparent 20%,rgba(255,255,255,.055) 50%,
                             transparent 80%);
  transform:translateX(-100%);animation:sheen 1.5s ease-in-out infinite}
@keyframes sheen{to{transform:translateX(100%)}}
@media (prefers-reduced-motion:reduce){.skel::after{animation:none}}

/* The shelf arriving. Short and small — 14px of travel, not a page turn —
   because this happens every time a chip is tapped and an animation you see
   forty times an hour has to be something you stop noticing. Reduce Motion
   takes the duration to nothing along with everything else. */
@keyframes came-l{from{opacity:0;transform:translateX(14px)}}
@keyframes came-r{from{opacity:0;transform:translateX(-14px)}}
@keyframes came{from{opacity:0}}
.came-l{animation:came-l .16s ease-out}
.came-r{animation:came-r .16s ease-out}
.came{animation:came .16s ease-out}

/* Reduce Motion, honoured once for the whole app. Everything here that moves
   is decoration on top of a state change that happens anyway — the sheet
   still opens, the toast still appears, the press still presses; they simply
   stop travelling to get there. Not `animation:none`, which can leave an
   element stuck at the start of a keyframe, but a duration short enough to be
   instant while still firing the events that anything might be waiting on. */
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{
    animation-duration:.01ms !important;
    animation-iteration-count:1 !important;
    transition-duration:.01ms !important;
    scroll-behavior:auto !important;
  }
}

/* ── select mode ────────────────────────────────────────────────────────
   Half of Hold is already sorted and he can see which half at a glance. That
   is a judgement no query makes, and 153 separate saves is not a way to record
   it — so the plate becomes a checkbox and one bar at the bottom applies one
   decision to everything ticked. */
/* Shift-clicking a list selects the text between the two clicks unless the
   cards say not to, and a grid full of highlighted titles reads as a bug. */
.grid{user-select:none}
.book.picked .plate{border-color:var(--a9);box-shadow:0 0 0 2px var(--a9)}
.book.picked .plate img{opacity:.55}
/* The empty circle is drawn on every card in select mode so the affordance is
   visible before the first tap, not after it. */
.tick{position:absolute;top:8px;left:8px;width:22px;height:22px;
  border-radius:var(--r-dot);border:2px solid rgba(255,255,255,.75);
  background:rgba(0,0,0,.45);backdrop-filter:blur(3px)}
.book.picked .tick{background:var(--a9);border-color:var(--a9)}
.book.picked .tick::after{content:"";position:absolute;left:6px;top:2px;
  width:5px;height:10px;border:solid #fff;border-width:0 2px 2px 0;
  transform:rotate(45deg)}
/* Checked, on the shelf. Invisible on day one by construction — nothing is
   checked yet — and it fills in as he works, which is the only progress bar
   that matters here. */
.seen{position:absolute;top:8px;left:8px;width:18px;height:18px;
  display:grid;place-items:center;border-radius:var(--r-dot);
  background:rgba(0,0,0,.6);color:var(--current);font-size:11px;
  backdrop-filter:blur(3px);transition:opacity .12s}

/* The way in. Select mode used to be an unlabelled square in the toolbar,
   which is a feature nobody finds; the affordance belongs on the thing it acts
   on. So the circle is drawn on the card and hover is what reveals it — the
   same bargain `.plus` makes at the opposite corner — and clicking it turns the
   mode on with that card already ticked. */
.pickone{position:absolute;top:8px;left:8px;width:26px;height:26px;padding:0;
  border-radius:var(--r-dot);border:2px solid rgba(255,255,255,.78);
  background:rgba(0,0,0,.5);backdrop-filter:blur(3px);
  opacity:0;transition:opacity .12s}
.book:hover .pickone,.pickone:focus-visible{opacity:1}
.pickone:hover{background:var(--a9);border-color:var(--a9)}
/* Both want that corner and only one of them is a control, so the badge yields
   for as long as the pointer is on the card. */
.book:hover .seen{opacity:0}
/* Nothing hovers on a phone: the circle would be drawn never and reachable
   never. Edit in the toolbar is the way in there, and it lands in the same
   mode — so this is a shortcut that is missing, not a feature. */
@media (hover:none){.pickone{display:none}}

/* The mode's own bar, which stands where the dock stands and is built the same
   way — floating, blurred, clear of the bottom edge — because it is doing the
   dock's job for as long as the mode is on. Two bars stacked on each other was
   the visible half of the bug above. */
.bulk{
  position:fixed;z-index:47;display:none;
  /* Centred and only as wide as it needs to be. Pinned to both edges it was a
     2px-tall ribbon stretched across a 1600px window with six controls adrift
     in it — the phone's shape applied to a screen that is not that shape. */
  left:50%;transform:translateX(-50%);
  width:min(760px,calc(100vw - 24px));
  bottom:calc(10px + env(safe-area-inset-bottom));
  flex-wrap:wrap;gap:8px;align-items:center;
  border-radius:var(--r-xl);
  background:var(--material);border:1px solid var(--material-edge);
  box-shadow:var(--shadow);
  -webkit-backdrop-filter:saturate(180%) blur(22px);
  backdrop-filter:saturate(180%) blur(22px);
  padding:10px 12px;
}
@supports not ((backdrop-filter:blur(1px)) or (-webkit-backdrop-filter:blur(1px))){
  .bulk{background:var(--card)}
}
/* One bar at a time. The dock's own Group Edit is unreachable under this
   anyway, and its other three go places you cannot go mid-selection. */
body.selecting .dock{display:none}
.bulk.open{display:flex}
.bulk b{font-family:Mono,monospace;font-size:13px;font-weight:400;
  color:var(--ink);margin-right:2px;white-space:nowrap}
.bulk select{width:auto;min-width:122px;flex:0 1 auto}
.bulk .sp{flex:1 1 auto}
@media (max-width:640px){
  .bulk{padding-bottom:calc(10px + env(safe-area-inset-bottom))}
  /* The count takes the line and the three controls share the one underneath,
     a third of the screen each. Four controls in a row at 390px wrap anyway;
     wrapping on purpose is the difference between that and a stray Edit under
     a ragged row. */
  .bulk b{flex:1 0 100%}
  .bulk .sp{display:none}
  /* `auto` and not `0`: with the verbs on the bar there are five controls
     here, and five equal thirds of 390px is a Move to… menu with no room for
     the words. They wrap into two rows sized by what is in them instead. */
  .bulk select,.bulk .chip{flex:1 1 auto;min-width:92px}
  body.selecting main{padding-bottom:calc(104px + env(safe-area-inset-bottom))}
}

/* ── one at a time ──────────────────────────────────────────────────────
   The shelf is a grid because comparing is what a shelf is for. This is the
   opposite screen: one series, nothing else on it, and a decision. It exists
   because 672 rows in Dropped is not a thing you review by opening 672 sheets,
   and because the answer to "should this still be dropped" is usually obvious
   within a second of seeing the cover — which the grid, showing thirty at
   once, gives you no way to say. */
/* The column is the card's width, worked out the same way the card is: a title
   and a legend wider than the thing they are about read as a panel the cover
   is sitting in. The card is sized off the viewport height — see .tri — so the
   width it will come out at is that height's two thirds, and the floor keeps a
   short window from shrinking the whole screen into a stamp. */
.solo{width:min(100%,max(300px,min(58dvh,560px) * 2 / 3));margin:0 auto;
  display:flex;flex-direction:column;gap:14px}
.solo-head{display:flex;align-items:center;gap:8px}
.solo-h{font-family:Lit,Georgia,serif;font-size:20px;font-weight:600;margin:0;
  letter-spacing:-.01em}
.solo-head .count{margin-left:auto;font-family:Mono,monospace;font-size:12px;
  color:var(--ink-3);white-space:nowrap}

/* The cover, at the size a cover deserves. This was a 150px thumbnail in a
   panel with a column of fields beside it and two buttons under it, which is a
   form about a book; the picture is the question, so the picture is the card.
   Height off the viewport rather than width off the column, because the whole
   point is that a card and what the two directions mean are both on screen at
   once — a verdict that costs a scroll is not one gesture. */
.tri{
  position:relative;width:100%;aspect-ratio:2/3;overflow:hidden;
  border-radius:var(--r-xl);background:var(--fill-4);
  border:1px solid transparent;box-shadow:var(--shadow);
  touch-action:pan-y;user-select:none;cursor:grab;
}
.tri:active{cursor:grabbing}
/* Follows the finger. No transition while dragging or it lags behind by a
   frame; the class goes on only for the spring back and the fly out. */
.tri.glide{transition:transform .22s ease,opacity .22s ease}
.tri.gone{opacity:0}
.tri-art{position:absolute;inset:0}
.tri-art img{width:100%;height:100%;object-fit:cover;display:block}
/* `.fallback` is the shelf card's no-artwork ground, already absolute and
   already hued off the title. At this size it only wants a bigger face. */
.tri .fallback{font-size:21px;line-height:1.3;padding:26px}
/* Over the foot of the cover. The gradient runs most of the lower third
   because a serif title in white has to clear whatever is behind it, and half
   the posters here are bright. */
.tri-info{position:absolute;left:0;right:0;bottom:0;
  padding:72px 16px calc(16px + env(safe-area-inset-bottom));
  display:flex;flex-direction:column;gap:8px;
  background:linear-gradient(transparent,rgba(0,0,0,.5) 36%,rgba(0,0,0,.93))}
.tri-info h2{font-family:Lit,Georgia,serif;font-size:22px;line-height:1.2;
  font-weight:600;margin:0;letter-spacing:-.015em;color:#fff;
  text-shadow:0 1px 3px rgba(0,0,0,.55);
  display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;
  overflow:hidden}
.tri-line{display:flex;align-items:baseline;gap:10px;font:var(--type-caption);
  color:rgba(255,255,255,.84);min-width:0}
.tri-line span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tri-line em{font-style:normal;margin-left:auto;flex:none;
  font-family:Mono,monospace;font-size:11px;color:rgba(255,255,255,.72)}
.tri-words{display:flex;flex-wrap:wrap;gap:5px}
.tri-words span{font-size:11px;padding:2px 8px;border-radius:var(--r-sm);
  background:rgba(255,255,255,.15);color:#fff}
/* The verdict, stamped across the cover as the card is dragged, in the colour
   of the shelf it names — the same --<status> token the tab dots and the stats
   bars resolve, so the word and the marker always agree. */
.tri-say{position:absolute;top:24px;font-family:Pub,system-ui,sans-serif;
  font-size:17px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;
  padding:7px 13px;border-radius:var(--r-md);opacity:0;pointer-events:none;
  color:var(--tone,var(--ink));background:rgba(0,0,0,.45);
  border:2px solid currentColor;backdrop-filter:blur(2px)}
.tri-say.l{left:20px;transform:rotate(-7deg)}
.tri-say.r{right:20px;transform:rotate(7deg)}

/* What each direction does, said out loud under the card. A swipe is not
   discoverable and guessing wrong costs a row, so both answers are written
   down in the colour they get stamped in. They are pressable, which is what a
   swipe is at a desk with no trackpad — and the arrow keys do the same. */
.swipes{display:grid;grid-template-columns:1fr 1fr;gap:10px;
  padding-top:2px;border-top:1px solid var(--rule-2)}
.swipe{display:flex;flex-direction:column;gap:2px;align-items:flex-start;
  background:none;border:0;padding:8px 2px;text-align:left;min-width:0}
.swipe.r{align-items:flex-end;text-align:right}
.swipe b{font:var(--type-footnote);font-weight:600;color:var(--tone,var(--ink-2));
  max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.swipe span{font:var(--type-caption);color:var(--ink-3)}
.swipe:hover b{text-decoration:underline;text-underline-offset:3px}

/* Whatever the card is missing, under the legend instead of on the cover: the
   cover is the question and a form printed over it is the screen this replaced.
   Blank fields only, which is the entire point — see soloGaps(). */
.fills{background:var(--card);border:1px solid transparent;
  border-radius:var(--r-xl);padding:16px;display:flex;flex-direction:column;
  gap:15px}
.gap{display:flex;flex-direction:column;gap:7px}
.gap>.lbl{padding-left:2px}
.shots{display:grid;grid-template-columns:repeat(auto-fill,minmax(72px,1fr));
  gap:8px;max-height:250px;overflow-y:auto}
.shots .shot{aspect-ratio:2/3;border-radius:var(--r-md);overflow:hidden;
  border:1px solid transparent;background:var(--fill-4);padding:0}
.shots .shot img{width:100%;height:100%;object-fit:cover;display:block}
.shots .shot.on{border-color:var(--a9);box-shadow:0 0 0 2px var(--a9)}

/* ── panels ─────────────────────────────────────────────────────────── */
.panel{max-width:860px;margin:0 auto;display:flex;flex-direction:column;gap:26px}
.slab{background:var(--card);border:1px solid transparent;
  border-radius:var(--r-xl);padding:20px}
@media (max-width:640px){.slab{border-color:transparent;background:var(--card)}}
/* The scope, as a chip rather than as a form field: it is a heading you can
   change, so it should look like the heading it replaced and not like a
   dropdown somebody left in a panel. */
.scope{
  -webkit-appearance:none;appearance:none;border:0;
  background:var(--fill-3);color:var(--ink);
  font:var(--type-headline);font-family:Lit,Georgia,serif;
  height:36px;padding:0 30px 0 12px;border-radius:var(--r-lg);
  /* Size to the word it is showing, not to the space it is in: a heading that
     stretches to fill its card stops reading as a heading. */
  width:fit-content;max-width:100%;flex:none;
  background-image:linear-gradient(45deg,transparent 50%,var(--ink-3) 50%),
                   linear-gradient(135deg,var(--ink-3) 50%,transparent 50%);
  background-position:calc(100% - 15px) 16px,calc(100% - 11px) 16px;
  background-size:4px 4px,4px 4px;background-repeat:no-repeat;
}
.scope:hover{background-color:var(--fill-2)}
@media (max-width:640px){.scope{height:var(--tap);background-position:calc(100% - 15px) 20px,calc(100% - 11px) 20px}}

.slab h2{font:var(--type-subhead);font-weight:600;margin:0 0 14px;
  letter-spacing:-.01em;display:flex;align-items:center;gap:10px}
.slab h2 span{color:var(--ink-3);font-size:13px;font-family:Mono,monospace}
/* The figures are sized by their own text and spread to both edges, which is
   not what equal columns do. Equal columns — `repeat(auto-fit,minmax(120px,
   1fr))`, and flex growing from a basis, which is the same thing — give every
   figure a 194px cell to hold 85 to 97px of glyphs, and a block's slack all
   falls on its right. So the row *is* the full width and the ink is not: four
   numbers against four left edges, and 110px of nothing after the last one.
   Measured, because the boxes said the row was fine while the numbers sat
   where they had always sat.

   `0 0 auto` makes each cell its own content, so the slack leaves the cells;
   centring puts it at the two ends rather than between the figures. Pushed to
   the edges they read as four unrelated numbers pinned to the corners of a
   wide box — four *stats*, not a line of figures about one shelf — and a
   56px gutter is close enough to keep them one thing. The count is not fixed
   either: a Watching shelf with films on it grows a fifth, and centring does
   not care how many it is centring. */
.figs{display:flex;flex-wrap:wrap;gap:16px 56px;justify-content:center}
/* The cell is as wide as the wider of its two lines, so the other one has
   somewhere to sit — and left was the wrong somewhere. MEAN CHAPTER is half
   again as wide as 33.6, and a number hung off the left end of its own label
   is a ragged edge running down a centred row. */
.fig{flex:0 0 auto;min-width:0;text-align:center}
/* Two to a row on a phone, where four cells of their own width leave a gap you
   could park a third in. Two exactly, and not `1 1 120px`: a basis lets three
   fit on a 424px screen and drops the fourth onto a line of its own at full
   width, and `0 0` stops a lone fifth figure — Watching, with films — from
   stretching across the row it lands on. Even columns are right when the row
   is 350px wide. */
@media (max-width:640px){
  .figs{justify-content:flex-start;gap:16px 14px}
  .fig{flex:0 0 calc(50% - 7px)}
}
.fig b{display:block;font-family:Mono,monospace;font-size:26px;font-weight:400;
  line-height:1.1}
/* The caption under a figure. Same argument as the field labels: the number
   is doing the shouting, and a word in tracked capitals under it competes with
   the thing it is supposed to be naming. */
.fig span{font:var(--type-footnote);color:var(--ink-3)}
.rows{display:flex;flex-direction:column;gap:9px}
.row{display:grid;grid-template-columns:118px 1fr 46px;align-items:center;gap:10px;
  font-size:13px}
.row i{font-style:normal;color:var(--ink-2);white-space:nowrap;overflow:hidden;
  text-overflow:ellipsis}
.row u{text-decoration:none;height:9px;background:var(--fill-4);display:block;
  border-radius:1px;overflow:hidden}
.row u b{display:block;height:100%;background:var(--bar,var(--g8))}
.row em{font-style:normal;font-family:Mono,monospace;font-size:12px;
  color:var(--ink-3);text-align:right}
.list{display:flex;flex-direction:column;gap:1px}
.list button{display:flex;gap:10px;align-items:baseline;text-align:left;width:100%;
  background:none;border:0;padding:9px 12px;border-radius:var(--r-md);font-size:13.5px}
.list button:hover{background:var(--fill-4)}
.list button em{font-style:normal;margin-left:auto;font-family:Mono,monospace;
  font-size:11px;color:var(--ink-3);flex:none}
.hint{font-size:13px;color:var(--ink-2);margin:-6px 0 14px;line-height:1.55}

/* ── the sheet ──────────────────────────────────────────────────────── */
.veil{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.6);
  opacity:0;pointer-events:none;transition:opacity .16s}
.veil.open{opacity:1;pointer-events:auto}
/* On a pointer this is a dialog over the middle of the screen, not a panel
   welded to the right edge. A drawer says "there is more of this app over
   here"; editing one series is not more of the shelf, it is a decision taken
   about a single row, and the shape that says so is a card over the whole
   screen with the shelf dimmed behind it.

   Sized as a fraction of the screen rather than in pixels, because there is
   no correct number of pixels for a form: 480px was a postage stamp on a 4K
   panel and a 32px inset was the screen with a picture frame drawn on it.
   Seven tenths of each axis is the middle of those — plainly a dialog, with
   the shelf still legible around it, and it holds that proportion whatever
   the window is. The floor keeps a small window from shrinking it into the
   card it used to be. */
.sheet{
  position:fixed;z-index:51;background:var(--paper);display:flex;
  flex-direction:column;box-shadow:var(--shadow);
  top:50%;left:50%;
  width:max(70vw,min(560px,100vw - 32px));
  height:max(70vh,min(560px,100vh - 32px));
  height:max(70dvh,min(560px,100dvh - 32px));
  border:1px solid var(--material-edge);border-radius:var(--r-xl);overflow:hidden;
  /* Closed is out of the tab order, not merely transparent, and `visibility`
     is delayed by the length of the fade so it does not blink out mid-way. */
  opacity:0;visibility:hidden;pointer-events:none;
  transform:translate(-50%,-50%) scale(.98);
  transition:opacity .16s,transform .2s cubic-bezier(.3,.8,.4,1),
             visibility 0s .2s;
}
.sheet.open{opacity:1;visibility:visible;pointer-events:auto;
  transform:translate(-50%,-50%);transition-delay:0s}
/* A phone has no middle to speak of: a centred card there is a bottom sheet
   with wasted margins, so it stays the sheet it was, up from the bottom edge
   and back down to it. */
@media (max-width:640px){
  .sheet{top:auto;right:0;bottom:0;left:0;width:100%;
    border:0;border-radius:var(--r-xl) var(--r-xl) 0 0;
    transform:translateY(101%);
    max-height:none;
    /* It leaves and arrives by moving, not by fading: the edge it came from
       is the whole point, and a sheet that also dissolves loses it. */
    opacity:1;
    /* The clip is for the popup's four rounded corners, where the footer's
       own background would otherwise square off the bottom two. Down here
       only the top corners are round and nothing is painted into them. */
    overflow:visible;
    /* dvh tracks the shrinking/growing browser toolbar; vh does not, and a
       sheet sized in vh has its footer under the address bar half the time. */
    height:min(92vh,860px);
    height:min(92dvh,860px);
  }
  .sheet.open{transform:none}
}
/* The sheet's toolbar. This was a thumbnail, a title and an × in the corner,
   with Remove and Save on a bar welded to the bottom — which is a dialog from
   a desktop, where the mouse is already near the bottom because that is where
   you left it. On a sheet the two answers to "am I done here" belong at the
   top, leading and trailing: Cancel on the left because leaving without
   changing anything is the safe one and the safe one goes where the back
   button lives, Save on the right because the trailing edge is where a
   confirmation lives on every Apple sheet there has ever been. Apple's rule
   is also a warning — never show Done without a Cancel beside it, or the only
   way out of the sheet looks like agreeing with it.

   The cover and the ✕ both lose their place here, and both are fine losing it:
   the × is what Cancel says in words, and the cover is the first thing in the
   form now, which is where the eye goes anyway. */
.sheet-top{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;
  gap:10px;padding:10px 10px;position:relative;z-index:1;
  background:var(--material);
  -webkit-backdrop-filter:saturate(180%) blur(22px);
  backdrop-filter:saturate(180%) blur(22px);
  border-bottom:1px solid var(--material-edge)}
.tbtn{height:var(--tap);padding:0 12px;border:0;background:none;border-radius:var(--r-md);
  font:var(--type-body);color:var(--a11);white-space:nowrap}
.tbtn:first-child{justify-self:start}
.tbtn.go{justify-self:end;font-weight:600}
.tbtn:active{opacity:.55}
.tbtn:disabled{opacity:.4}
/* The grab handle. It is not draggable — it is the affordance that tells you
   this panel came up from the bottom edge and goes back down there. */
@media (max-width:640px){
  .sheet-top{padding-top:20px}
  .sheet-top::before{content:"";position:absolute;top:9px;left:50%;
    transform:translateX(-50%);width:36px;height:4px;border-radius:var(--r-dot);
    background:var(--rule)}
}
/* A navigation title: one line, centred between the two buttons, and it gives
   way to them rather than pushing them off the edge. Two lines of title would
   make the bar grow and the buttons drift, and a toolbar that changes height
   per series is not a toolbar. */
.sheet-top h2{font:var(--type-headline);font-family:Lit,Georgia,serif;
  margin:0;min-width:0;text-align:center;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
/* The pager. A sheet opened from a shelf is one of a run of them, so it says
   where in the run it is and how to get to the next — which is the difference
   between editing one series and going through a shelf. */
.pager{display:flex;align-items:center;gap:6px;padding:0 14px 12px;
  border-bottom:1px solid var(--rule-2)}
@media (max-width:640px){.pager{border-bottom:0;padding-bottom:8px}}
.pager .count{flex:1;text-align:center;font-family:Mono,monospace;font-size:12px;
  color:var(--ink-3)}
.pager .step{width:var(--tap);height:34px;flex:none;display:grid;place-items:center;
  border:1px solid transparent;background:var(--fill-3);color:var(--ink-2);
  border-radius:var(--r-md);font-size:15px}
.pager .step:hover:not(:disabled){background:var(--fill-2);color:var(--ink)}
.pager .step:disabled{opacity:.35}
.sheet-body{flex:1;overflow-y:auto;padding:16px 14px 28px}

/* ── the form, as a grouped list ─────────────────────────────────────────
   This is the shape every settings screen Apple has ever shipped is made of,
   and it is worth copying exactly because of what it does rather than how it
   looks: the page is the dark ground, each group of controls is a raised
   surface sitting on it, and the name of the group is small text floating
   above the surface rather than a caption stuck inside it. The eye gets the
   groups before it reads a word — you can count the decisions in a form at a
   glance — which a flat column of labelled boxes never gives you.

   The inset on the label is the tell that it belongs to the card under it and
   not to the card above: 16px, the same as the card's own padding, so the
   label's first letter and the control's first letter share an edge. */
.fields .field{margin-bottom:22px}
.fields .field>.lbl{display:block;margin:0 0 7px 16px}
.fields .field>.picks,
.fields .field>.stepper,
.fields .field>.stars,
.fields .field>.pickbar,
.fields .field>.switch,
.fields .field>.alts,
.fields .field>input[type=text],
.fields .field>input[type=number],
.fields .field>select,
.fields .field>textarea{
  background:var(--card);border-radius:var(--r-xl);
}
.fields .field>.picks{padding:10px;gap:8px}
.fields .field>.stepper,
.fields .field>.stars,
.fields .field>.pickbar,
.fields .field>.switch{padding:8px 10px}
.fields .field>.alts{padding:10px;gap:8px}
.fields .field>.alts:empty{padding:0;background:none}
/* A group with nothing in it is an empty card under a heading for a thing that
   does not exist: Setting and Genre come from a vocabulary per kind, and when
   a kind has none the whole group should not be there. `:has` lets the heading
   leave with the card it names. */
.fields .field:has(>.picks:empty){display:none}
/* A lone text box IS its own group, so it gets the surface directly and the
   height of a list row rather than of an input on a web page. */
.fields .field>input[type=text],
.fields .field>input[type=number],
.fields .field>select,
.fields .field>textarea{
  border:1px solid transparent;height:48px;padding:0 16px;font:var(--type-body)}
.fields .field>textarea{height:auto;padding:12px 16px}
/* Inside a group the controls are on the card already: a second fill on top of
   the first is the glass-on-glass Apple warns about, one layer down. */
.fields .field>.picks .pick,
.fields .field>.pickbar input,
.fields .field>.pickbar .btn,
.fields .field>.stepper input,
.fields .field>.stepper button,
.fields .field>.alts input,
.fields .field>.alts .ico{background:var(--fill-4)}
.fields .field>.picks .pick[aria-pressed=true]{background:var(--sel)}
/* A dialog the size of the screen holds ten short fields, and a single file
   of them down the left would be a ribbon with an acre of nothing beside it.
   So the cover takes the space instead — it is the one thing here that gets
   better the bigger it is, and the shelf already knows that: this is the same
   move the one-at-a-time screen makes with `.tri`.

   The art column is sized off the viewport HEIGHT, not the width, because
   height is what constrains it: at 2/3 the cover is half again as tall as it
   is wide, and what it has to fit inside is seven tenths of the screen less
   the head, the foot and the padding. `45vh - 140px` is that sum solved for
   the width, and it lands just inside the body at every height from a 740px
   window to a 4K panel. Widths are what is left, and the fields flow into as
   many columns as fit — `column-width` rather than a count, so one rule
   covers a laptop at two columns and the big panel at three.

   Both dimensions gate it. A wide, short window has no height to give the
   cover, and a hero that does not fit pushes the form below the fold: the
   editor would open on a picture you have to scroll past to change anything.
   Under either threshold it is the plain column of fields with the cover back
   to a thumbnail in the head. */
/* The cover leads the form, the way a contact card leads with a face. At this
   size it is identification rather than a picture — small enough that the
   first field it belongs to is still on screen under it. The two-pane layout
   below takes the same element and makes it the hero of its own column. */
.art{display:block;position:relative;width:104px;aspect-ratio:2/3;
  margin:2px auto 18px;overflow:hidden;border-radius:var(--r-lg);
  border:1px solid transparent;background:var(--fill-4)}
.art img{width:100%;height:100%;object-fit:cover;display:block}
@media (min-width:900px) and (min-height:740px){
  .sheet-body{padding:20px 24px 22px;
    display:grid;
    grid-template-columns:clamp(180px,calc(45vh - 140px),520px) minmax(0,900px);
    gap:32px;align-items:start;justify-content:center}
  .art{width:100%;margin:0}
  .art .fallback{font-size:19px;line-height:1.3;padding:24px}
  /* 280px is the narrowest a pill row stays readable at, and it is picked
     against the tightest window that still gets this layout: at 1280×800 the
     dialog is 896 wide, the cover takes 220 of it, and what is left is 596 —
     two columns and their gutter to the pixel. A wider column would silently
     collapse the form back to one file down the right of a cover. */
  .fields{column-width:280px;column-gap:30px}
  /* 18px of air under every field is right when they are stacked in one
     column and you are scrolling past them. Side by side in a box that is
     trying to show the lot at once, it is four fields' worth of nothing. */
  .fields .field{margin-bottom:14px}
  /* Keep a label with the control it names, and the two halves of a progress
     field with each other. */
  .fields>*{break-inside:avoid}
  .sheet-top{padding:12px 16px}
  .sheet-top h2{font:var(--type-title3);font-family:Lit,Georgia,serif}
  /* Beside a cover this tall, a full-width red bar at the foot of the column
     would be the loudest thing in the dialog. It gets the width of its own
     column and no more. */
  .destroy{max-width:340px;margin-left:auto;margin-right:auto}
}
.field{margin-bottom:18px}
.field>.lbl{display:block;margin-bottom:6px}
.field input[type=text],.field input[type=number],.field select,.field textarea{
  width:100%;height:40px;border:1px solid transparent;background:var(--fill-3);
  border-radius:var(--r-md);padding:0 12px;font-size:16px;outline:none}
.field textarea{height:auto;padding:8px 10px;font-size:14px;resize:vertical;
  line-height:1.5}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--a7)}
.stepper{display:flex;gap:8px;align-items:center}
.stepper input{text-align:center;font-family:Mono,monospace}
.stepper button{width:var(--tap);height:40px;border:1px solid transparent;
  background:var(--fill-3);border-radius:var(--r-md);font-size:17px;flex:none}
.stepper button:hover{background:var(--fill-2);color:var(--ink)}
/* A rating out of ten, as ten things rather than as a slider.
   The slider was wrong twice over. It looked wrong — a browser's range input
   is one of the few controls that still cannot be styled into agreeing with
   anything around it, so it sat in the middle of the form as a piece of
   somebody else's interface. And it worked wrong: dragging a 200px track to
   land on the seventh of eleven positions is a fiddly way to say "7", on a
   phone especially, where your thumb covers the number you are aiming at.
   Ten bars, tap the one you mean. The tap target is the full height of the
   row; the bar you see is 10px of it, which is the part that has to look like
   a meter rather than like a row of buttons. */
.stars{display:flex;align-items:center;gap:14px}
.rate{display:flex;gap:4px;flex:1;min-width:0}
.pip{flex:1;min-width:0;height:38px;padding:0;border:0;background:none;
  display:grid;place-items:center;border-radius:var(--r-sm)}
.pip i{display:block;width:100%;height:10px;border-radius:3px;
  background:var(--fill-2);transition:background .12s}
.pip[aria-pressed=true] i{background:var(--a9)}
.pip:hover i{background:var(--fill-1)}
.pip[aria-pressed=true]:hover i{background:var(--a10)}
.pip:active{transform:none}
.stars output{font-family:Mono,monospace;font-size:19px;min-width:22px;
  text-align:right;font-variant-numeric:tabular-nums}
/* The footer line: the word the number means, and the way to take it back.
   Clear lives down here rather than in the card because it is not part of
   setting a rating, it is the escape hatch from having set one. */
.tierline{display:flex;align-items:baseline;gap:12px;margin:7px 0 0 16px}
/* A text button with a finger-sized target: 18px of line inside 44px of
   padding, with the padding taken back out again as negative margin so the
   footer row stays the height of its text. */
.linkish{background:none;border:0;color:var(--a11);font:var(--type-footnote);
  padding:13px 8px;margin:-13px -6px -13px auto}
.linkish:active{opacity:.55}
/* "Best of the Genre" will not fit in a 58px column beside the slider, so the
   number keeps that column and the word gets the line underneath. The line is
   reserved even when empty, or clearing a rating makes the sheet jump. */
/* The word under the number. In a grouped form this is a group's footer — the
   sentence that explains the control you have just used — so it sits under the
   card, inset to the same 16px as the label above it, in the same footnote as
   the label. The line is reserved even when empty, or clearing a rating makes
   the form jump. */
.tier{display:block;min-height:18px;
  font:var(--type-footnote);color:var(--ink-3)}
.picks{display:flex;flex-wrap:wrap;gap:6px}
.pick{height:34px;padding:0 14px;border:1px solid transparent;background:var(--fill-3);
  border-radius:var(--r-md);font:var(--type-footnote);color:var(--ink-2)}
.pick:hover{background:var(--fill-2);color:var(--ink)}
/* Same reasoning as the shelf chips, and the same fix. */
/* Chosen. A tint and a weight, with the outline gone: a ring drawn round the
   selected chip is the same information twice, and on a dark ground the ring
   is the part that shouts. */
.pick[aria-pressed=true]{background:var(--sel);border-color:transparent;
  color:var(--ink);font-weight:600}
.pick[aria-pressed=true]:hover{background:var(--sel-2)}
.pick[data-v]{--tone:none}
.pick[data-status]::before{content:"";width:7px;height:7px;margin-right:8px;
  border-radius:var(--r-dot);background:var(--tone,var(--ink-3));
  display:inline-block;vertical-align:middle}
.pick[data-v=Current]{--tone:var(--current)} .pick[data-v=Later]{--tone:var(--later)}
.pick[data-v=Hold]{--tone:var(--hold)}       .pick[data-v=Finished]{--tone:var(--finished)}
.pick[data-v=Dropped]{--tone:var(--dropped)}
/* Watched, or not. A film has no episode counter and never did — the number
   under one was the kind's unit leaking onto a type that does not count. */
.switch{display:flex;align-items:center;gap:12px}
.switch button{height:44px;flex:1;border:1px solid transparent;background:var(--fill-3);
  border-radius:var(--r-md);font:var(--type-subhead);font-weight:500;color:var(--ink-2)}
.switch button[aria-pressed=true]{background:var(--sel);border-color:transparent;
  color:var(--ink);font-weight:600}
/* Setting and Genre are the same pills as every other field, but many-of. The
   square corner is the whole tell: a radio group is round, a checkbox is not. */
.picks.many .pick{border-radius:var(--r-sm)}
/* Remove, at the end of the form. This is where the system apps put a
   destructive action — the last row of the thing it destroys, after everything
   you might have come to edit instead — and it is a better place than a bar
   pinned under your thumb for the whole time you are working. Red text on the
   app's own ground rather than a red button: a filled red rectangle sitting
   permanently on screen is an alarm about nothing, which is the same argument
   the chip bar already makes two hundred lines up. */
.destroy{display:block;width:100%;margin:22px 0 4px;padding:13px 16px;
  min-height:var(--tap);border:0;border-radius:var(--r-lg);
  background:var(--fill-4);color:var(--danger);font:var(--type-body);
  text-align:center}
.destroy:hover{background:var(--fill-3)}
.destroy:active{background:var(--fill-2)}

.sheet-foot{display:flex;gap:8px;padding:12px 14px;border-top:1px solid var(--rule-2);
  padding-bottom:calc(12px + env(safe-area-inset-bottom));background:var(--card)}
.btn{height:var(--tap);padding:0 20px;border:1px solid transparent;
  background:var(--fill-3);border-radius:var(--r-md);font:var(--type-subhead);
  font-weight:500}
.btn:hover{background:var(--fill-2);color:var(--ink)}
.btn.primary{background:var(--a9);border-color:var(--a9);color:#fff;
  flex:1;font-weight:600}
.btn.primary:hover{background:var(--a10)}
.btn.danger{color:var(--ink-2)}
.btn.danger:hover{background:rgba(255,69,58,.18);color:var(--danger)}
.thumb{width:74px;flex:none;aspect-ratio:2/3;object-fit:cover;
  border-radius:var(--r-lg);border:1px solid transparent;background:var(--fill-4)}
.meta{font:var(--type-caption);color:var(--ink-3);line-height:1.6;margin:0}

/* ── toast ──────────────────────────────────────────────────────────── */
/* The toast was a white chip — the only light surface anywhere in the app, and
   on a black screen at the moment you save something it is a flashbulb. It is
   the same blurred dark material as the dock and the toolbar now, which is
   what the system's own transient panels are made of. */
#toast{position:fixed;z-index:60;left:50%;transform:translate(-50%,20px);
  bottom:calc(18px + env(safe-area-inset-bottom));
  background:var(--material);color:var(--ink);
  border:1px solid var(--material-edge);
  -webkit-backdrop-filter:saturate(180%) blur(22px);
  backdrop-filter:saturate(180%) blur(22px);
  padding:13px 18px;border-radius:var(--r-xl);font:var(--type-subhead);
  display:flex;align-items:center;gap:14px;box-shadow:var(--shadow);
  opacity:0;pointer-events:none;transition:opacity .16s,transform .16s;
  max-width:calc(100vw - 28px)}
#toast.show{opacity:1;transform:translate(-50%,0);pointer-events:auto}
#toast button{background:none;border:0;color:var(--a11);font-weight:600;
  font:var(--type-subhead);font-weight:600;padding:4px 2px;flex:none}

/* ── touch sizing ───────────────────────────────────────────────────────
   Everything above is sized for a mouse, where 32px is a comfortable target.
   A finger is not a cursor: these are the controls an audit at 390px found
   under 40px, raised in one place so the desktop layout is untouched. */
@media (max-width:640px){
  .seek{height:var(--tap)}
  .field input[type=text],.field input[type=number],.field select{height:var(--tap)}
  .seek{height:var(--tap)}
  .field textarea{min-height:88px}
  .stepper button{height:var(--tap)}

  /* 44px is the floor, and these two were the ones under it: a shelf pill at
     40 and a pager step at 34. Both are one-tap controls in the middle of a
     sheet, which is to say both are exactly what the floor is for. */
