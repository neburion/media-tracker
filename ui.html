<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#111111">
<title>Media Tracker</title>
<style>
/* ── typefaces ──────────────────────────────────────────────────────────
   Self-hosted, converted to woff2 in the Nix store by service.nix. Literata
   is Google's e-reader face — the right serif for a shelf of books. Public
   Sans carries the interface, Plex Mono the figures, because chapter counts
   and ratings should line up in a column.                                 */
@font-face{font-family:Lit;src:url(/fonts/literata.woff2) format("woff2");
  font-weight:400;font-display:swap}
@font-face{font-family:Lit;src:url(/fonts/literata-semibold.woff2) format("woff2");
  font-weight:600;font-display:swap}
@font-face{font-family:Lit;src:url(/fonts/literata-italic.woff2) format("woff2");
  font-weight:400;font-style:italic;font-display:swap}
@font-face{font-family:Pub;src:url(/fonts/publicsans.woff2) format("woff2");
  font-weight:400;font-display:swap}
@font-face{font-family:Pub;src:url(/fonts/publicsans-medium.woff2) format("woff2");
  font-weight:500;font-display:swap}
@font-face{font-family:Pub;src:url(/fonts/publicsans-semibold.woff2) format("woff2");
  font-weight:600;font-display:swap}
@font-face{font-family:Mono;src:url(/fonts/mono.woff2) format("woff2");
  font-weight:400;font-display:swap}

/* ── tokens ─────────────────────────────────────────────────────────────
   Radix Colors' `gray` dark scale, used as designed. It is a true neutral —
   R, G and B are equal at every step — which is the entire point here: the
   palette this replaced was warm at both ends (#14130F ground, #EDE9DC text),
   and a warm near-white on a warm near-black reads as cream, not as white.

   The step numbering is Radix's and each one has a job, which is what keeps a
   dark UI from turning into guesswork about which grey goes where:

     1  app background          6  subtle border / separator
     2  subtle background       7  element border, focus ring
     3  element background      8  hovered border
     4  hovered element         11 low-contrast text
     5  active / selected       12 high-contrast text

   https://www.radix-ui.com/colors/docs/palette-composition/understanding-the-scale */
:root{
  color-scheme:dark;

  --g1:#111111;  --g2:#191919;  --g3:#222222;  --g4:#2a2a2a;
  --g5:#313131;  --g6:#3a3a3a;  --g7:#484848;  --g8:#606060;
  --g9:#6e6e6e;  --g10:#7b7b7b; --g11:#b4b4b4; --g12:#eeeeee;

  --paper:var(--g1);      /* the page */
  --card:var(--g2);       /* raised surface */
  --sunk:var(--g3);       /* inset: search field, chips, wells */
  --ink:var(--g12);
  --ink-2:var(--g11);
  --ink-3:#8a8a8a;   /* 4.6:1 on --g3, the lightest ground a label sits on */
  --rule:var(--g6);
  --rule-2:var(--g5);

  /* Accent: Radix `iris`, used at the steps it was designed for — 9 as a solid
     fill, 11 as text on dark, 3 as a subtle tinted background, 7 as a border.
     Dark UIs cannot take a fully saturated hue: it optically vibrates against
     the ground and struggles to clear 4.5:1, which is why every guide says to
     desaturate 20-30% for dark mode. Radix's dark scales are already built to
     that, which is the reason for using them rather than mixing by hand. */
  --a3:#202248;  --a5:#303374;  --a7:#4a4a95;
  --a9:#5b5bd6;  --a10:#6e6ade; --a11:#b1a9ff;

  /* Shelf markers. Three hues for the shelves where something is still true of
     the book, two greys for the two where nothing is: Read and Dropped are
     finished states and are told apart by lightness rather than by hue, which
     leaves the colour to mean "this is live".

     The mustard that was on Hold is now Radix `orange` at step 11 — the same
     idea, at a lightness that reads as orange on a dark ground instead of as
     something spilled on it. */
  /* Named for the shelves, which are no longer named after reading: the token
     names have to track them because the stats bars resolve --<status> from
     the status name itself. */
  --current:#3dd68c;   /* green-11  — you are in it */
  --later:#70b8ff;     /* blue-11   — queued */
  --hold:#ffa057;      /* orange-11 — paused */
  --finished:#b4b4b4;  /* gray-11   — done */
  --dropped:#7b7b7b;   /* gray-10   — abandoned; dimmest of the five, but 3:1 */

  /* Semantic, on one control: the one that deletes a series. */
  --danger:#e5484d;
  --danger-dim:#b54548;

  --gap:16px;
  --tap:44px;
  --shadow:0 1px 2px rgba(0,0,0,.5), 0 4px 12px rgba(0,0,0,.35);

  /* Radius, on the scale every serious design system converged on: ~6px for
     controls, ~12px for containers, full-round for nothing but badges.
     Vercel's Geist caps functional UI at 12px; Linear uses exactly 6 and 12;
     GitHub's Primer sits lower still. The previous pass had 999px pills on
     every button and a 28px sheet, which is a phone-app costume rather than a
     scale. Full-round survives only where the shape *is* the content: the 8px
     status dots. */
  --r-sm:4px;          /* tags, counters, small inline chips */
  --r-md:6px;          /* buttons, inputs, selects, tabs */
  --r-lg:10px;         /* cover plates, thumbnails */
  --r-xl:12px;         /* panels, slabs, dialogs, the sheet's lip */
  --r-dot:999px;       /* dots, and nothing else */
}

*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
/* While the bottom sheet is up, the shelf behind it must not scroll —
   otherwise a drag that misses the sheet pans 300 covers out from under it. */
body.locked{overflow:hidden}
body{
  margin:0;background:var(--paper);color:var(--ink);
  font-family:Pub,system-ui,sans-serif;font-size:15px;line-height:1.5;
  -webkit-font-smoothing:antialiased;overflow-wrap:break-word;
}
button,input,select,textarea{font:inherit;color:inherit}
/* The dock and the add button are `display:flex` inside a media query, which
   is a class beating the UA's `[hidden]{display:none}` on specificity — so on
   a phone they stayed on screen over the portal, where there is no shelf for
   them to act on. One rule, rather than a `[hidden]` guard on each. */
[hidden]{display:none !important}
button{cursor:pointer}
a{color:var(--a11);text-underline-offset:2px}
.mono{font-family:Mono,ui-monospace,monospace;font-variant-numeric:tabular-nums}
.lbl{font-size:11px;letter-spacing:.09em;text-transform:uppercase;
  color:var(--ink-3);font-weight:600}

/* ── masthead ───────────────────────────────────────────────────────── */
header{
  position:sticky;top:0;z-index:40;background:var(--card);
  border-bottom:1px solid var(--rule);
  padding:10px max(14px,env(safe-area-inset-right)) 0 max(14px,env(safe-area-inset-left));
}
/* On a phone the header is the top of a single continuous surface, so the rule
   under it is one line too many — the shelf reads as one sheet of paper. */
@media (max-width:640px){header{border-bottom:0;padding-top:6px}}
.bar{display:flex;align-items:center;gap:12px;min-height:36px}
/* min-width:0 so the title truncates instead of shoving the toolbar off the
   right edge — without it a long name makes the whole page scroll sideways. */
h1{font-size:16px;font-weight:600;margin:0;
  white-space:nowrap;letter-spacing:-.01em;
  min-width:0;overflow:hidden;text-overflow:ellipsis}
.tally{margin-left:auto;display:flex;align-items:baseline;gap:10px;flex:none}
.tally b{font-family:Mono,monospace;font-size:16px;font-weight:400}
.tally i{font-style:normal;font-size:11px;color:var(--ink-3);letter-spacing:.06em;
  text-transform:uppercase}
@media (max-width:560px){.tally span:nth-child(2){display:none}}
/* Below this the tally is what pushes the title into an ellipsis, and it is
   redundant anyway — the tab strip right underneath carries a count per shelf
   plus the total on "All". */
@media (max-width:460px){.tally{display:none}}

.ico{flex:none;width:36px;height:36px;display:grid;place-items:center;
  background:none;border:1px solid transparent;color:var(--ink-2);border-radius:var(--r-md)}
@media (max-width:640px){.ico{width:var(--tap);height:var(--tap)}}
.ico:hover{color:var(--ink);background:var(--g4)}
.ico svg{width:20px;height:20px;fill:currentColor;stroke:none}
.ico.on{color:var(--a11);background:var(--a3)}

.seek{display:flex;align-items:center;gap:9px;margin:8px 0 10px;
  border:1px solid transparent;background:var(--sunk);padding:0 14px;
  height:40px;border-radius:var(--r-md);transition:border-color .12s}
.seek:focus-within{border-color:var(--a7)}
.seek svg{width:17px;height:17px;flex:none;color:var(--ink-3);fill:currentColor;
  stroke:none}
.seek input{flex:1;min-width:0;border:0;background:none;outline:none;height:100%;
  font-size:16px}   /* 16px stops iOS zooming on focus */
.seek button{border:0;background:none;color:var(--ink-3);padding:0 2px}

/* status tabs — the primary navigation, because a shelf is sorted by what you
   are doing with a book, not by its title */
.tabs{display:flex;gap:7px;overflow-x:auto;scrollbar-width:none;
  padding:2px 0 10px;margin:0 -2px;scroll-padding:0 14px}
.tabs::-webkit-scrollbar{display:none}
.tab{
  flex:none;background:var(--sunk);border:1px solid transparent;
  border-radius:var(--r-md);
  padding:0 13px;height:32px;color:var(--ink-2);font-size:13px;font-weight:500;
  display:flex;align-items:center;gap:7px;white-space:nowrap;
}
@media (max-width:640px){.tab{height:36px;padding:0 15px}}
.tab em{font-style:normal;font-family:Mono,monospace;font-size:11px;opacity:.7}
.tab:hover{color:var(--ink)}
/* The shelf marker rides in the chip as a dot. Which means the chip itself
   can never be a solid light fill: Reading's marker is the brightest of the
   five, and on a white chip it vanished exactly when it mattered — the shelf
   you were looking at. A tinted surface is the fix, and it is also the
   documented pattern: step 3 ground, step 7 border, step 11 label. Both chip
   states are dark, so all five markers stay visible in both. */
.tab::before{content:"";width:8px;height:8px;border-radius:var(--r-dot);
  background:var(--dot,var(--ink-3));flex:none}
.tab[aria-selected=true]{background:var(--a3);border-color:var(--a7);
  color:var(--a11);font-weight:600}
.tab[aria-selected=true] em{opacity:.8}
.tab[data-s=Current]{--dot:var(--current)} .tab[data-s=Later]{--dot:var(--later)}
.tab[data-s=Hold]{--dot:var(--hold)}       .tab[data-s=Finished]{--dot:var(--finished)}
.tab[data-s=Dropped]{--dot:var(--dropped)}
/* "All" is not a shelf and has no marker of its own. */
.tab[data-s=All]::before{display:none}

/* Six unlabelled dropdowns in a row is a puzzle: "Any publication" and "Any
   tag" tell you what they will accept, never what they are asking. Each one
   now carries its own question above it, and the tag filter is split into the
   three axes the vocabulary actually has, so choosing a setting and a genre
   at once is possible rather than a choice between them. */
/* ── the two doors ──────────────────────────────────────────────────────
   Where a row of kind chips used to be. Reading and Watching were never a
   filter over one shelf — they are two shelves that happen to share a schema,
   and the chip strip made choosing between them a thing you did on the way
   past, with an "All" in front that mixed nine hundred manhwa into five films.
   So the app opens on neither, and you walk into one. */
.hall{min-height:calc(100dvh - 170px);display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:34px;padding:20px 0 40px}
.mast{text-align:center;display:flex;flex-direction:column;gap:7px}
.mast b{font-family:Lit,Georgia,serif;font-size:34px;font-weight:600;
  letter-spacing:-.025em;line-height:1}
.mast span{font-size:13px;color:var(--ink-3)}
/* An explicit width, because auto-fit inside a shrink-to-fit flex item
   resolves to one column and stacks the two doors into a list. */
.portal{display:grid;gap:22px;width:min(100%,640px);
  grid-template-columns:repeat(auto-fit,minmax(240px,1fr))}
.door{
  display:flex;flex-direction:column;gap:10px;text-align:left;
  padding:30px 28px;border:1px solid var(--rule);background:var(--card);
  border-radius:var(--r-xl);color:inherit;transition:border-color .14s,transform .14s;
}
.door:hover{border-color:var(--a7);transform:translateY(-2px)}
.door b{font-family:Lit,Georgia,serif;font-size:27px;font-weight:600;
  letter-spacing:-.02em;line-height:1}
.door span{font-size:13px;color:var(--ink-3)}
.door em{font-style:normal;font-family:Mono,monospace;font-size:12px;
  color:var(--a11);letter-spacing:.02em}
@media (max-width:640px){
  .hall{min-height:calc(100dvh - 120px);gap:26px;
    padding:8px max(14px,env(safe-area-inset-left)) 30px;align-items:stretch}
  .portal{grid-template-columns:1fr;gap:14px}
  .mast b{font-size:29px}
  .door{padding:24px 22px}
}
/* The masthead's back arrow. A tracker is somewhere you are inside of, so
   there has to be a way out that is not the browser's. */
.out{flex:none;margin-left:-8px}

.drawer{display:none;gap:10px 12px;padding:4px 0 12px;
  grid-template-columns:repeat(auto-fit,minmax(140px,1fr))}
.drawer.open{display:grid}
.filt{display:flex;flex-direction:column;gap:5px;min-width:0}
.filt>.lbl{padding-left:2px}
select,.chip{
  height:36px;border:1px solid var(--rule);background:var(--paper);
  color:var(--ink-2);padding:0 12px;border-radius:var(--r-md);font-size:13px;
  width:100%;
}
.chip{width:auto}
select:hover,.chip:hover{border-color:var(--g8);color:var(--ink)}
.chip.on{background:var(--a3);border-color:var(--a7);color:var(--a11)}
/* Reset has no question of its own, so it aligns to the bottom of the row. */
.filt.act{justify-content:flex-end}

/* ── bottom dock (phones) ───────────────────────────────────────────────
   Six icons plus a title and a tally do not fit across a 390px phone: the
   toolbar overflowed and took the whole page into a sideways scroll, with Add
   and the theme toggle pushed off the right edge entirely.
   So on narrow screens the view switches move down here, where a thumb can
   actually reach them, and the header keeps only search, filter and theme. */
.dock{display:none}
@media (max-width:640px){
  .dock{
    display:flex;position:fixed;left:0;right:0;bottom:0;z-index:45;
    background:var(--card);border-top:1px solid var(--rule);
    padding:0 max(4px,env(safe-area-inset-right)) env(safe-area-inset-bottom)
              max(4px,env(safe-area-inset-left));
  }
  .dock button{
    flex:1;min-width:0;min-height:58px;display:flex;flex-direction:column;
    align-items:center;justify-content:center;gap:4px;
    background:none;border:0;color:var(--ink-3);padding:8px 2px 6px;
  }
  /* The icon sits in its own pill, which is what fills in when the view is
     active. Colouring the glyph alone gives a 20px target's worth of feedback
     on a 58px control; the pill is the part you can actually see land. */
  .dock i{display:grid;place-items:center;width:56px;height:30px;
    border-radius:var(--r-md);transition:background .14s}
  .dock svg{width:22px;height:22px;fill:currentColor;stroke:none}
  .dock span{font-size:10.5px;letter-spacing:.01em;font-weight:500}
  .dock button.on{color:var(--a11)}
  .dock button.on i{background:var(--a3)}
  .dock button.on span{font-weight:600}
  /* These live in the dock now; keeping both would be two ways to do one thing. */
  header .bar [data-view]{display:none}
  header .bar [data-act=new]{display:none}
}

/* Add is the one thing here that creates rather than navigates, so on a phone
   it leaves the row of view switches and becomes the floating button — the
   same split Signal makes between its nav bar and its compose button. */
.fab{display:none}
@media (max-width:640px){
  .fab{
    display:grid;place-items:center;position:fixed;z-index:46;
    right:max(16px,env(safe-area-inset-right));
    bottom:calc(74px + env(safe-area-inset-bottom));
    width:52px;height:52px;border:0;border-radius:var(--r-xl);
    background:var(--a9);color:#fff;box-shadow:var(--shadow);
  }
  .fab svg{width:26px;height:26px;fill:currentColor;stroke:none}
  .fab:active{background:var(--a10)}
}

/* ── shelf ──────────────────────────────────────────────────────────── */
main{padding:var(--gap) max(14px,env(safe-area-inset-right)) 96px
  max(14px,env(safe-area-inset-left));max-width:1500px;margin:0 auto}
/* clear the dock, plus the home indicator on gesture-nav phones */
@media (max-width:640px){
  main{padding-bottom:calc(84px + env(safe-area-inset-bottom))}
  #toast{bottom:calc(74px + env(safe-area-inset-bottom))}
}
.grid{display:grid;gap:18px 14px;
  grid-template-columns:repeat(auto-fill,minmax(148px,1fr))}
@media (max-width:420px){.grid{grid-template-columns:repeat(auto-fill,minmax(128px,1fr));
  gap:14px 10px}}

.book{position:relative;display:flex;flex-direction:column;gap:7px;
  background:none;border:0;padding:0;text-align:left;color:inherit;
  --dot:var(--ink-3)}
.plate{
  position:relative;aspect-ratio:2/3;background:var(--sunk);overflow:hidden;
  border:1px solid var(--rule-2);border-radius:var(--r-lg);box-shadow:var(--shadow);
  cursor:pointer;
}
@media (max-width:640px){.plate{border-color:transparent}}
.plate img{width:100%;height:100%;object-fit:cover;display:block}
.book:hover .plate{border-color:var(--a7)}
/* No artwork: set the title on a tinted ground rather than leave a hole. The
   hue comes from the title itself, so a book always looks like itself. */
.fallback{position:absolute;inset:0;display:grid;place-items:center;padding:10px;
  font-family:Lit,Georgia,serif;font-size:13px;line-height:1.3;text-align:center;
  color:var(--ink-2);background:
    linear-gradient(160deg,hsl(var(--h) 7% 24%),hsl(var(--h) 8% 15%))}

/* The status stripe was flush to a square corner; on a rounded plate it has to
   be inset or it is clipped into a wedge. */
.mark{position:absolute;top:10px;left:0;width:3px;height:26px;background:var(--dot);
  border-radius:0 var(--r-sm) var(--r-sm) 0}
.book[data-s=Current]{--dot:var(--current)} .book[data-s=Later]{--dot:var(--later)}
.book[data-s=Hold]{--dot:var(--hold)}       .book[data-s=Finished]{--dot:var(--finished)}
.book[data-s=Dropped]{--dot:var(--dropped)}

.score{position:absolute;top:8px;right:8px;padding:3px 8px;
  border-radius:var(--r-md);
  background:rgba(0,0,0,.72);color:var(--ink);font-family:Mono,monospace;
  font-size:11px;backdrop-filter:blur(3px)}
.foot{position:absolute;left:0;right:0;bottom:0;display:flex;align-items:flex-end;
  gap:6px;padding:22px 6px 6px;
  background:linear-gradient(transparent,rgba(0,0,0,.85))}
.ch{font-family:Mono,monospace;font-size:12px;color:var(--ink);
  text-shadow:0 1px 2px rgba(0,0,0,.5)}
.ch b{font-weight:400;font-size:9px;opacity:.7;letter-spacing:.06em}
.plus{
  margin-left:auto;width:28px;height:28px;flex:none;border-radius:var(--r-md);
  border:1px solid rgba(255,255,255,.28);background:rgba(0,0,0,.6);
  color:var(--ink);font-size:15px;line-height:1;display:grid;place-items:center;
  opacity:0;transition:opacity .12s;backdrop-filter:blur(3px);
}
.book:hover .plus,.plus:focus-visible{opacity:1}
.plus:hover{background:var(--a9);border-color:var(--a9);color:#fff}
/* No hover to reveal it on a touch screen, and 28px is too small to hit while
   holding a phone — so it is always visible and grows to a real tap target. */
@media (hover:none){.plus{opacity:1;width:38px;height:38px;font-size:19px}}

.name{font-family:Lit,Georgia,serif;font-size:13.5px;line-height:1.32;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;
  overflow:hidden;cursor:pointer}
.sub{font-size:11px;color:var(--ink-3);display:flex;gap:6px;margin-top:-3px}
.sub span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

.empty{padding:60px 20px;text-align:center;color:var(--ink-3);font-size:14px}

/* ── panels ─────────────────────────────────────────────────────────── */
.panel{max-width:860px;margin:0 auto;display:flex;flex-direction:column;gap:26px}
.slab{background:var(--card);border:1px solid var(--rule);
  border-radius:var(--r-xl);padding:20px}
@media (max-width:640px){.slab{border-color:transparent;background:var(--sunk)}}
.slab h2{font-size:14px;font-weight:600;margin:0 0 14px;letter-spacing:-.01em}
.slab h2 span{color:var(--ink-3);font-size:13px;font-family:Mono,monospace}
.figs{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(120px,1fr))}
.fig b{display:block;font-family:Mono,monospace;font-size:26px;font-weight:400;
  line-height:1.1}
.fig span{font-size:11px;color:var(--ink-3);letter-spacing:.07em;
  text-transform:uppercase;font-weight:600}
.rows{display:flex;flex-direction:column;gap:9px}
.row{display:grid;grid-template-columns:118px 1fr 46px;align-items:center;gap:10px;
  font-size:13px}
.row i{font-style:normal;color:var(--ink-2);white-space:nowrap;overflow:hidden;
  text-overflow:ellipsis}
.row u{text-decoration:none;height:9px;background:var(--sunk);display:block;
  border-radius:1px;overflow:hidden}
.row u b{display:block;height:100%;background:var(--bar,var(--g8))}
.row em{font-style:normal;font-family:Mono,monospace;font-size:12px;
  color:var(--ink-3);text-align:right}
.list{display:flex;flex-direction:column;gap:1px}
.list button{display:flex;gap:10px;align-items:baseline;text-align:left;width:100%;
  background:none;border:0;padding:9px 12px;border-radius:var(--r-md);font-size:13.5px}
.list button:hover{background:var(--sunk)}
.list button em{font-style:normal;margin-left:auto;font-family:Mono,monospace;
  font-size:11px;color:var(--ink-3);flex:none}
.hint{font-size:13px;color:var(--ink-2);margin:-6px 0 14px;line-height:1.55}

/* ── the sheet ──────────────────────────────────────────────────────── */
.veil{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.6);
  opacity:0;pointer-events:none;transition:opacity .16s}
.veil.open{opacity:1;pointer-events:auto}
.sheet{
  position:fixed;z-index:51;background:var(--card);display:flex;
  flex-direction:column;box-shadow:var(--shadow);
  top:0;right:0;bottom:0;width:min(440px,100%);
  border-left:1px solid var(--rule);
  transform:translateX(101%);transition:transform .2s cubic-bezier(.3,.8,.4,1);
}
.sheet.open{transform:none}
@media (max-width:640px){
  .sheet{top:auto;left:0;width:100%;
    border-left:0;border-top:0;border-radius:var(--r-xl) var(--r-xl) 0 0;
    transform:translateY(101%);
    /* dvh tracks the shrinking/growing browser toolbar; vh does not, and a
       sheet sized in vh has its footer under the address bar half the time. */
    height:min(92vh,860px);
    height:min(92dvh,860px);
  }
}
.sheet-top{display:flex;align-items:flex-start;gap:12px;padding:16px 16px 14px;
  border-bottom:1px solid var(--rule-2);position:relative}
/* The grab handle. It is not draggable — it is the affordance that tells you
   this panel came up from the bottom edge and goes back down there. */
@media (max-width:640px){
  .sheet-top{padding-top:22px;border-bottom:0}
  .sheet-top::before{content:"";position:absolute;top:9px;left:50%;
    transform:translateX(-50%);width:36px;height:4px;border-radius:var(--r-dot);
    background:var(--rule)}
}
.sheet-top h2{font-family:Lit,Georgia,serif;font-size:17px;font-weight:600;
  margin:0;line-height:1.3;flex:1}
.sheet-body{flex:1;overflow-y:auto;padding:16px 14px 24px}
.field{margin-bottom:18px}
.field>.lbl{display:block;margin-bottom:6px}
.field input[type=text],.field input[type=number],.field select,.field textarea{
  width:100%;height:40px;border:1px solid var(--rule);background:var(--paper);
  border-radius:var(--r-md);padding:0 12px;font-size:16px;outline:none}
.field textarea{height:auto;padding:8px 10px;font-size:14px;resize:vertical;
  line-height:1.5}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--a7)}
.stepper{display:flex;gap:8px;align-items:center}
.stepper input{text-align:center;font-family:Mono,monospace}
.stepper button{width:var(--tap);height:40px;border:1px solid var(--rule);
  background:var(--paper);border-radius:var(--r-md);font-size:17px;flex:none}
.stepper button:hover{border-color:var(--g8);color:var(--ink)}
.stars{display:flex;align-items:center;gap:10px}
.stars input[type=range]{flex:1;accent-color:var(--a9);height:38px;min-width:0}
.stars output{font-family:Mono,monospace;font-size:17px;width:44px;text-align:right}
.picks{display:flex;flex-wrap:wrap;gap:6px}
.pick{height:34px;padding:0 14px;border:1px solid var(--rule);background:var(--paper);
  border-radius:var(--r-md);font-size:13px;color:var(--ink-2)}
.pick:hover{border-color:var(--g8)}
/* Same reasoning as the shelf chips, and the same fix. */
.pick[aria-pressed=true]{background:var(--a3);border-color:var(--a7);
  color:var(--a11);font-weight:600}
.pick[data-v]{--tone:none}
.pick[data-status]::before{content:"";width:8px;height:8px;margin-right:8px;
  border-radius:var(--r-dot);background:var(--tone,var(--ink-3));
  display:inline-block;vertical-align:middle}
.pick[data-v=Current]{--tone:var(--current)} .pick[data-v=Later]{--tone:var(--later)}
.pick[data-v=Hold]{--tone:var(--hold)}       .pick[data-v=Finished]{--tone:var(--finished)}
.pick[data-v=Dropped]{--tone:var(--dropped)}
/* Watched, or not. A film has no episode counter and never did — the number
   under one was the kind's unit leaking onto a type that does not count. */
.switch{display:flex;align-items:center;gap:12px}
.switch button{height:44px;flex:1;border:1px solid var(--rule);background:var(--paper);
  border-radius:var(--r-md);font-size:14px;font-weight:500;color:var(--ink-2)}
.switch button[aria-pressed=true]{background:var(--a3);border-color:var(--a7);
  color:var(--a11);font-weight:600}
/* Setting and Genre are the same pills as every other field, but many-of. The
   square corner is the whole tell: a radio group is round, a checkbox is not. */
.picks.many .pick{border-radius:var(--r-sm)}
.sheet-foot{display:flex;gap:8px;padding:12px 14px;border-top:1px solid var(--rule-2);
  padding-bottom:calc(12px + env(safe-area-inset-bottom));background:var(--card)}
.btn{height:var(--tap);padding:0 20px;border:1px solid var(--rule);
  background:var(--paper);border-radius:var(--r-md);font-size:14px;font-weight:500}
.btn:hover{border-color:var(--g8);color:var(--ink)}
.btn.primary{background:var(--a9);border-color:var(--a9);color:#fff;
  flex:1;font-weight:600}
.btn.primary:hover{background:var(--a10);border-color:var(--a10)}
.btn.danger{color:var(--ink-2)}
.btn.danger:hover{border-color:var(--danger-dim);color:var(--danger)}
.thumb{width:74px;flex:none;aspect-ratio:2/3;object-fit:cover;
  border-radius:var(--r-lg);border:1px solid var(--rule-2);background:var(--sunk)}
.meta{font-size:11.5px;color:var(--ink-3);line-height:1.6;margin:0}

/* ── toast ──────────────────────────────────────────────────────────── */
#toast{position:fixed;z-index:60;left:50%;transform:translate(-50%,20px);
  bottom:calc(18px + env(safe-area-inset-bottom));background:var(--g12);
  color:var(--g1);padding:12px 18px;border-radius:var(--r-md);font-size:13.5px;
  display:flex;align-items:center;gap:12px;box-shadow:var(--shadow);
  opacity:0;pointer-events:none;transition:opacity .16s,transform .16s;
  max-width:calc(100vw - 28px)}
#toast.show{opacity:1;transform:translate(-50%,0);pointer-events:auto}
#toast button{background:none;border:0;color:var(--a9);font-weight:600;
  text-decoration:underline;text-underline-offset:3px;
  font-size:13px;padding:0;flex:none}

/* ── touch sizing ───────────────────────────────────────────────────────
   Everything above is sized for a mouse, where 32px is a comfortable target.
   A finger is not a cursor: these are the controls an audit at 390px found
   under 40px, raised in one place so the desktop layout is untouched. */
@media (max-width:640px){
  .seek{height:var(--tap)}
  .field input[type=text],.field input[type=number],.field select{height:var(--tap)}
  .seek{height:var(--tap)}
  .field textarea{min-height:88px}
  .stepper button{height:var(--tap)}
  .stars input[type=range]{height:var(--tap)}
  .picks .pick,#e-rating-clear{height:40px;padding:0 13px}
  .drawer select,.drawer .chip{height:44px}
  .switch button{height:var(--tap)}
  .list button{padding:11px 8px}
  /* The cover is the obvious target; the title under it is a courtesy, but a
     two-line clamp can be 18px tall, so give it something to hit. */
  .name{padding:3px 0 5px}

  /* iOS Safari zooms the whole page when a focused field is under 16px, and
     then leaves you scrolled sideways into a layout that was fine. Range
     inputs are exempt — you never type into one. */
  .drawer select,.field textarea,dialog select,dialog input{font-size:16px}
}

dialog{border:1px solid var(--rule);border-radius:var(--r-xl);background:var(--card);
  color:var(--ink);padding:0;width:min(400px,calc(100vw - 28px));box-shadow:var(--shadow)}
dialog::backdrop{background:rgba(0,0,0,.6)}
dialog form{padding:18px}
dialog h2{font-size:15px;margin:0 0 16px;font-weight:600}

/* ── the cover picker ───────────────────────────────────────────────────
   Playnite's shape: a globe next to the artwork field opens a web image
   search seeded with the title, you look at a grid, you click one. It is a
   search rather than a metadata lookup on purpose — the covers on this shelf
   come from scan sites because those are the ones in the tall format the grid
   is built around, and no metadata provider serves those. */
.pickbar{display:flex;gap:8px}
.pickbar input{flex:1;min-width:0}
.pickbar .btn{flex:none;padding:0 14px;height:40px}
@media (max-width:640px){.pickbar .btn{height:var(--tap)}}

#art{border:0;padding:0;background:none;width:min(920px,calc(100vw - 24px));
  max-width:none}
#art .wrap{background:var(--card);border:1px solid var(--rule);
  border-radius:var(--r-xl);display:flex;flex-direction:column;
  max-height:min(86dvh,900px)}
#art .head{display:flex;gap:8px;align-items:center;padding:14px 16px;
  border-bottom:1px solid var(--rule-2)}
#art .head input{flex:1;min-width:0;height:38px;border:1px solid var(--rule);
  background:var(--paper);border-radius:var(--r-md);padding:0 12px;font-size:16px;
  outline:none}
#art .head input:focus{border-color:var(--a7)}
#art .body{flex:1;overflow-y:auto;padding:14px 16px 18px}
#art .shots{display:grid;gap:12px;
  grid-template-columns:repeat(auto-fill,minmax(120px,1fr))}
@media (max-width:640px){#art .shots{grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:9px}}
/* Each tile is the shape the shelf will draw it in, so what you pick is what
   you get rather than a surprise after saving. */
.shot{position:relative;padding:0;border:1px solid var(--rule);background:var(--sunk);
  border-radius:var(--r-lg);overflow:hidden;aspect-ratio:2/3;cursor:pointer}
.shot img{width:100%;height:100%;object-fit:cover;display:block}
.shot:hover,.shot:focus-visible{border-color:var(--a7);outline:none}
.shot em{position:absolute;left:0;right:0;bottom:0;font-style:normal;
  font-family:Mono,monospace;font-size:10px;color:#fff;padding:10px 5px 4px;
  background:linear-gradient(transparent,rgba(0,0,0,.85))}
.shot.on{border-color:var(--a9);box-shadow:0 0 0 2px var(--a9)}
#art .foot{display:flex;gap:8px;align-items:center;padding:12px 16px;
  border-top:1px solid var(--rule-2)}
#art .note{font-size:12px;color:var(--ink-3);margin-right:auto}
dialog .sheet-foot{border-top:0;padding:6px 0 0}
</style>
</head>
<body>

<header id="head" hidden>
  <div class="bar">
    <button class="ico out" data-act="home" title="Both trackers" aria-label="Both trackers"><svg viewBox="0 0 24 24"><path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/></svg></button>
    <h1 id="h1">Media Tracker</h1>
    <div class="tally">
      <span><b id="t-count">—</b> <i>titles</i></span>

    </div>
    <button class="ico" data-act="filter" title="Filters" aria-label="Filters"><svg viewBox="0 0 24 24"><path d="M10 18h4v-2h-4v2zM3 6v2h18V6H3zm3 7h12v-2H6v2z"/></svg></button>
    <button class="ico" data-view="stats" title="Statistics" aria-label="Statistics"><svg viewBox="0 0 24 24"><path d="M4 9h4v11H4zM10 4h4v16h-4zM16 13h4v7h-4z"/></svg></button>
    <button class="ico" data-act="new" title="Add a series" aria-label="Add a series"><svg viewBox="0 0 24 24"><path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z"/></svg></button>

    <svg viewBox="0 0 24 24"><path d="M15.5 14h-.79l-.28-.27C15.41 12.59 16 11.11 16 9.5 16 5.91 13.09 3 9.5 3S3 5.91 3 9.5 5.91 16 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg>
    <input id="q" type="search" placeholder="Search titles, settings and genres" autocomplete="off" spellcheck="false">
    <button id="q-clear" hidden aria-label="Clear search">✕</button>
  </div>

  <div class="drawer" id="drawer">
    <div class="filt"><label class="lbl" for="f-sort">Order</label>
      <select id="f-sort">
        <option value="updated">Recently touched</option>
        <option value="rating">Highest rated</option>
        <option value="chapter">Furthest along</option>
        <option value="title">Title A–Z</option>
      </select></div>
    <div class="filt"><label class="lbl" for="f-type">Type</label>
      <select id="f-type" title="What kind of thing it is"><option value="">Any</option></select></div>
    <div class="filt"><label class="lbl" for="f-pub">Publication status</label>
      <select id="f-pub" title="Whether the author is still writing it"><option value="">Any</option></select></div>
    <div class="filt"><label class="lbl" for="f-setting">Setting</label>
      <select id="f-setting" title="Where it takes place"><option value="">Any</option></select></div>
    <div class="filt"><label class="lbl" for="f-genre">Genre</label>

    <div class="filt act"><button class="chip" id="f-clear">Reset filters</button></div>

  <div class="tabs" id="tabs"></div>

<nav class="dock" id="dock" aria-label="Views" hidden>
  <button data-view="shelf"><i><svg viewBox="0 0 24 24"><path d="M4 6H2v14c0 1.1.9 2 2 2h14v-2H4V6zm16-4H8c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2zm-1 9H9V9h10v2zm-4 4H9v-2h6v2zm4-8H9V5h10v2z"/></svg></i><span>Shelf</span></button>
  <button data-view="stats"><i><svg viewBox="0 0 24 24"><path d="M4 9h4v11H4zM10 4h4v16h-4zM16 13h4v7h-4z"/></svg></i><span>Stats</span></button>
  <button data-act="home"><i><svg viewBox="0 0 24 24"><path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/></svg></i><span>Trackers</span></button>
</nav>

<button class="fab" id="fab" hidden data-act="new" aria-label="Add a series"><svg viewBox="0 0 24 24"><path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z"/></svg></button>

<div class="veil" id="veil"></div>

      <button class="btn primary" value="ok">Add it</button>
    </div>

<script>
'use strict';
/* ══ helpers ══════════════════════════════════════════════════════════ */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g,
  c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt = v => v === null || v === undefined ? '' : String(v);

/* A stable hue per title, so a book with no artwork still looks like itself
   rather than like every other book with no artwork. */
function hue(s){ let h = 0; for (const c of s) h = (h * 31 + c.charCodeAt(0)) % 360; return h; }

/* Timestamps are SQLite's UTC `datetime('now')`. Say "3 days ago", not a
   timestamp nobody reads. */
function ago(ts){
  if (!ts) return '';
  const then = Date.parse(ts.replace(' ', 'T') + 'Z');
  if (Number.isNaN(then)) return '';
  const s = (Date.now() - then) / 1000;
  if (s < 90) return 'just now';
  const units = [[60,'minute'],[3600,'hour'],[86400,'day'],[604800,'week'],
                 [2629800,'month'],[31557600,'year']];
  let last = 'minute', div = 60;
  for (const [secs, name] of units){ if (s >= secs){ last = name; div = secs; } }
  const n = Math.floor(s / div);
  return `${n} ${last}${n === 1 ? '' : 's'} ago`;
}

let TIMER;
function toast(msg, action){
  $('#toast-msg').textContent = msg;
  const b = $('#toast-do');
  b.hidden = !action;
  if (action){ b.textContent = action.label; b.onclick = () => { hideToast(); action.run(); }; }
  $('#toast').classList.add('show');
  clearTimeout(TIMER);
  TIMER = setTimeout(hideToast, action ? 7000 : 3000);
}
const hideToast = () => $('#toast').classList.remove('show');

async function api(path, body){
  const r = await fetch(path, body ? {
    method:'POST', headers:{'Content-Type':'application/json'},
    body: JSON.stringify(body)
  } : undefined);
  const t = await r.text();
  let j = {};
  try { j = t ? JSON.parse(t) : {}; } catch { j = { error: t.slice(0,200) }; }
  if (!r.ok) throw new Error(j.error || `${r.status} ${r.statusText}`);
  return j;
}

/* ══ state ════════════════════════════════════════════════════════════
   `kind` is null until he walks through a door, and that is the whole shape of
   this app now: outside a tracker there is no shelf, no filter and no header,
   and inside one there is never a question about which tracker he is in. */
const S = {
  data:null, kind:null, view:'shelf', shelf:'Current', q:'',
  type:'', pub:'', setting:'', genre:'', sort:'updated', open:null,
};
const AXES = ['setting','genre'];
const AXIS_LABEL = { setting:'Setting', genre:'Genre' };
/* What the progress number is called, per tracker. The column behind it is one
   number either way; this is the word that makes it mean something. */
const PROGRESS_LABEL = { Reading:'Chapter', Watching:'Episode' };
const TALLY_WORD     = { Reading:'chapters', Watching:'episodes' };
const byId = id => S.data.series.find(s => s.id === id);

/* Types of the tracker he is in, and what each one counts. A Movie counts
   nothing — 'once' — which is what turns the stepper into a switch. */
const typesOf  = k => (S.data.meta.typesByKind || {})[k] || [];
const typeNames = k => typesOf(k).map(x => x.name);
const modeOf = (k, type) => (typesOf(k).find(x => x.name === type) || {}).progress || '';
/* The + on a card promises one more of something. Same word as the field label,
   lowercased, except for a film, which you do not get one more of. */
const bumpWord = s => s.progress === 'once' ? 'watch'
  : (PROGRESS_LABEL[s.kind] || 'unit').toLowerCase();

/* ══ the two doors ════════════════════════════════════════════════════
   The tracker lives in the hash, so reloading keeps you where you were and
   Back walks you out of a tracker rather than off the page. */
const slug = k => k.toLowerCase().replace(/\s+/g, '-');
const kindFromHash = () => (S.data ? S.data.meta.kind : [])
  .find(k => slug(k) === location.hash.replace(/^#\/?/, '').toLowerCase()) || null;

function enter(kind){
  S.kind = kind;
  S.view = 'shelf';
  S.q = ''; $('#q').value = ''; $('#q-clear').hidden = true;
  clearFilters();
  if (kind){
    // Open on Current unless nothing is, which is most of Watching.
    const pool = S.data.series.filter(s => s.kind === kind);
    S.shelf = pool.some(s => s.status === 'Current') ? 'Current' : 'All';
    fillPickers();
  }
  if (S.open) closeSheet();
  scrollTo({ top: 0 });
  render();
}

/* ══ load ═════════════════════════════════════════════════════════════ */
async function load(){
  try {
    S.data = await api('/api/library');
    // Both trackers arrive in one response and the door only chooses which
    // half is on screen, so re-reading never has to know where he is standing.
    if (S.kind === null) enter(kindFromHash());
    else { fillPickers(); render(); }
  } catch (e) {
    $('#main').innerHTML = `<div class="empty">Could not open the shelf.<br>${esc(e.message)}</div>`;
  }
}

function fillPickers(){
  const m = S.data.meta;
  const opt = (sel, items, blank) => {
    const keep = sel.value;
    sel.innerHTML = `<option value="">${blank}</option>` +
      items.map(v => `<option>${esc(v)}</option>`).join('');
    sel.value = items.includes(keep) ? keep : '';
  };
  opt($('#f-type'), typeNames(S.kind), 'Any');
  opt($('#f-pub'), m.pub, 'Any');
  // One dropdown per field, each holding only its own words. The old single
  // "Any tag" menu was 59 items long and mixed both together.
  for (const axis of AXES) opt($('#f-' + axis), (m.words || {})[axis] || [], 'Any');
  $('#f-sort').value = S.sort;

  // No Kind menu on the add dialog: he is standing in one.
  $('#n-type').innerHTML = '<option value="">—</option>' +
    typeNames(S.kind).map(v => `<option>${esc(v)}</option>`).join('');
  $('#n-status').innerHTML = m.status
    .map(v => `<option${v === 'Later' ? ' selected' : ''}>${esc(v)}</option>`).join('');
  $('#dlg-title').textContent =
    S.kind === 'Watching' ? 'Add something to watch' : 'Add something to read';
}

/* ══ selection ════════════════════════════════════════════════════════ */
function shown(){
  let list = S.data.series.filter(s => s.kind === S.kind);
  if (S.shelf !== 'All') list = list.filter(s => s.status === S.shelf);
  if (S.type) list = list.filter(s => s.type === S.type);
  if (S.pub)  list = list.filter(s => s.pub === S.pub);
  // Setting and genre are ANDed: a murim regression story is one query, not a
  // choice between two of the things you know about it.
  for (const axis of AXES)
    if (S[axis]) list = list.filter(s => s[axis].includes(S[axis]));
  if (S.q){
    const q = S.q.toLowerCase();
    const has = (arr) => arr.some(v => v.toLowerCase().includes(q));
    list = list.filter(s => s.title.toLowerCase().includes(q)
      || has(s.setting) || has(s.genre) || s.type.toLowerCase().includes(q));
  }
  const cmp = {
    updated: (a,b) => String(b.updated).localeCompare(String(a.updated)),
    rating:  (a,b) => (b.rating ?? -99) - (a.rating ?? -99) || a.title.localeCompare(b.title),
    chapter: (a,b) => (b.chapter ?? -1) - (a.chapter ?? -1) || a.title.localeCompare(b.title),
    title:   (a,b) => a.title.localeCompare(b.title),
  }[S.sort];
  return [...list].sort(cmp);
}

/* ══ render ═══════════════════════════════════════════════════════════ */
function render(){
  // Outside a tracker there is nothing to put a header on. Hiding the chrome
  // rather than emptying it is what makes the doors a place rather than a
  // shelf with no rows.
  const inside = !!S.kind;
  $('#head').hidden = $('#dock').hidden = $('#fab').hidden = !inside;
  document.title = inside ? `${S.kind} — Media Tracker` : 'Media Tracker';
  if (!inside) return renderPortal();

  const st = S.data.stats[S.kind] || { total:0, units:0, byStatus:[] };
  $('#h1').textContent = S.kind;
  $('#t-count').textContent = st.total;
  $('#t-ch').textContent = st.units.toLocaleString();
  $('#t-ch-word').textContent = TALLY_WORD[S.kind] || 'units';

  const pool = S.data.series.filter(x => x.kind === S.kind);
  const counts = {};
  for (const x of pool) counts[x.status] = (counts[x.status] || 0) + 1;
  $('#tabs').innerHTML = [...S.data.meta.status, 'All'].map(s => {
    const n = s === 'All' ? pool.length : (counts[s] || 0);
    return `<button class="tab" data-s="${esc(s)}" role="tab"
      aria-selected="${S.view === 'shelf' && S.shelf === s}">${esc(s)} <em>${n}</em></button>`;
  }).join('');

  // Header and dock carry the same data-view hooks, so one pass lights both.
  for (const b of document.querySelectorAll('[data-view]'))
    b.classList.toggle('on', b.dataset.view === S.view);

  // Filters belong to the shelf and to nothing else. Leaving Stats with a
  // setting still selected meant coming back to a shelf that was quietly
  // showing a third of itself, with the only evidence a lit icon in a drawer
  // that was closed. So leaving the shelf drops them, and the control that
  // opens them is not there to press.
  const onShelf = S.view === 'shelf';
  const filtered = S.type || S.pub || S.sort !== 'updated'
                   || AXES.some(a => S[a]);
  for (const b of document.querySelectorAll('[data-act=filter]')){
    b.hidden = !onShelf;
    b.classList.toggle('on', !!filtered);
  }
  if (!onShelf) $('#drawer').classList.remove('open');

  if (S.view === 'stats') return renderStats(st);
  renderShelf();
}

function renderPortal(){
  $('#main').innerHTML = `<div class="hall">
    <div class="mast"><b>Media Tracker</b><span>Two shelves. Pick one.</span></div>
    <div class="portal">${S.data.meta.kind.map(k => {
    const st = S.data.stats[k] || { total:0, byStatus:[] };
    const cur = (st.byStatus || []).find(r => r.name === 'Current');
    return `<button class="door" data-door="${esc(k)}">
      <b>${esc(k)}</b>
      <span>${st.total} ${st.total === 1 ? 'title' : 'titles'}</span>
      <em>${cur ? `${cur.count} on the go` : 'nothing on the go'}</em>
    </button>`;
  }).join('')}</div>
  </div>`;
}

function renderShelf(){
  const list = shown();
  $('#main').innerHTML = list.length
    ? `<div class="grid">${list.map(card).join('')}</div>`
    : `<div class="empty">Nothing on this shelf.</div>`;
}

function card(s){
  const art = s.coverId
    ? `<img src="/cover/${s.coverId}" alt="" loading="lazy" decoding="async"
         onerror="this.replaceWith(Object.assign(document.createElement('div'),
           {className:'fallback',textContent:this.dataset.t}))"
         data-t="${esc(s.title)}">`
    : `<div class="fallback">${esc(s.title)}</div>`;
  const sub = [s.type, s.pub].filter(Boolean);
  // A film has two states and no number. Everything else has a count, and a
  // volume beside it when he is keeping one.
  const once = s.progress === 'once';
  const mark = once
    ? `<b>${s.chapter ? 'WATCHED' : 'UNWATCHED'}</b>`
    : s.chapter !== null
      ? `${s.unit ? `<b>${esc(s.unit.toUpperCase())}</b> ` : ''}${esc(fmt(s.chapter))}` +
        (s.tome !== null ? ` <b>T</b> ${esc(fmt(s.tome))}` : '')
      : `<b>UNSTARTED</b>`;
  const plus = once && s.chapter ? '' : `
        <button class="plus" data-bump="${s.id}" title="One more ${esc(bumpWord(s))}"
          aria-label="One more ${esc(bumpWord(s))} of ${esc(s.title)}">${once ? '✓' : '+'}</button>`;
  return `
  <div class="book" data-s="${esc(s.status)}" style="--h:${hue(s.title)}">
    <div class="plate" data-open="${s.id}" role="button" tabindex="0">
      ${art}
      <div class="mark"></div>
      ${s.rating !== null ? `<div class="score">${esc(fmt(s.rating))}</div>` : ''}
      <div class="foot">
        <div class="ch">${mark}</div>${plus}
      </div>
    </div>
    <div>
      <div class="name" data-open="${s.id}" role="button">${esc(s.title)}</div>
      ${sub.length ? `<div class="sub"><span>${sub.map(esc).join(' · ')}</span></div>` : ''}
    </div>
  </div>`;
}

function bars(rows, total, tone){
  return `<div class="rows">${rows.map(r => `
    <div class="row"${tone ? ` style="--bar:var(--${r.name.toLowerCase()},var(--g8))"` : ''}>
      <i>${esc(r.name)}</i>
      <u><b style="width:${(100 * r.count / Math.max(1, total)).toFixed(1)}%"></b></u>
      <em>${r.count}</em>
    </div>`).join('')}</div>`;
}

function renderStats(st){
  // One tracker's numbers. A mean rating over nine hundred manhwa and five
  // films was a number about no shelf in particular.
  const slab = (title, rows, opts) => rows.length
    ? `<div class="slab"><h2>${esc(title)}</h2>${bars(rows,
        opts === 'peak' ? Math.max(...rows.map(r => r.count), 1) : st.total,
        opts === 'tone')}</div>`
    : '';
  $('#main').innerHTML = `<div class="panel">
    <div class="slab">
      <div class="figs">
        <div class="fig"><b>${st.total}</b><span>titles</span></div>
        <div class="fig"><b>${st.units.toLocaleString()}</b>
          <span>${esc(TALLY_WORD[S.kind] || 'units')}</span></div>
        ${st.done ? `<div class="fig"><b>${st.done}</b><span>films watched</span></div>` : ''}
        <div class="fig"><b>${st.avg ?? '—'}</b><span>mean rating</span></div>
      </div>
    </div>
    ${slab('By shelf', st.byStatus, 'tone')}
    ${slab('By type', st.byType)}
    ${slab('By publication status', st.byPub)}
    ${slab('Ratings given',
           st.ratings.map(r => ({ name:String(r.score), count:r.count })), 'peak')}
    ${slab('By setting', st.bySetting, 'peak')}
    ${slab('By genre', st.byGenre, 'peak')}
  </div>`;
}

/* No renderHistory(). The reading log is still written on every chapter change
   and still served at /api/history — it is the one thing a shelf of markdown
   notes could never hold, and throwing it away to hide a tab would be the
   expensive half of a cheap decision. Putting the view back is a dock button
   and a function; putting the history back would be impossible.

   No renderTags() either, and for the opposite reason: it earned its keep only
   while tags were typed by hand and the same word could exist twice. They are
   picked from a closed list now, so the merge tool has nothing to merge and
   the cloud is two dropdowns in the filter drawer. */

/* ══ the sheet ════════════════════════════════════════════════════════ */

/* The progress control is not one control. A show has episodes and a film has
   an evening, so which of the two you get is a property of the type — and the
   type is editable in this same sheet, which is why this is a function that
   can be called again rather than a branch taken once on open. */
function progressField(s, type){
  const once = modeOf(s.kind, type) === 'once';
  if (once) return `
      <span class="lbl">Watched</span>
      <div class="switch">
        <button data-watched="0" aria-pressed="${!s.chapter}">Not yet</button>
        <button data-watched="1" aria-pressed="${!!s.chapter}">Watched</button>
      </div>`;
  const word = PROGRESS_LABEL[s.kind] || 'Progress';
  return `
      <span class="lbl">${esc(word)}</span>
      <div class="stepper">
        <button data-step="-1" aria-label="Back one ${esc(word.toLowerCase())}">−</button>
        <input type="number" id="e-chapter" inputmode="numeric" min="0"
               value="${s.chapter === null ? '' : esc(fmt(s.chapter))}" placeholder="—">
        <button data-step="1" aria-label="On one ${esc(word.toLowerCase())}">+</button>
      </div>` + (s.kind !== 'Reading' ? '' : `
      <div class="field" style="margin:12px 0 0">
        <span class="lbl">Tome — optional</span>
        <div class="stepper">
          <button data-tome="-1" aria-label="Back one tome">−</button>
          <input type="number" id="e-tome" inputmode="numeric" min="0"
                 value="${s.tome === null ? '' : esc(fmt(s.tome))}" placeholder="not counting">
          <button data-tome="1" aria-label="On one tome">+</button>
        </div>
      </div>`);
}

function drawProgress(type){
  const s = byId(S.open);
  const box = $('#e-progress');
  if (!s || !box) return;
  // Read the fields back off the DOM first, so redrawing after a type change
  // does not throw away a number he just typed.
  const live = { ...s };
  const ch = $('#e-chapter'), tm = $('#e-tome'), on = $('#e-progress [data-watched][aria-pressed=true]');
  if (ch) live.chapter = ch.value.trim() === '' ? null : Number(ch.value);
  if (tm) live.tome = tm.value.trim() === '' ? null : Number(tm.value);
  if (on) live.chapter = on.dataset.watched === '1' ? (s.chapter || 1) : null;
  box.innerHTML = progressField(live, type);
}

function openSheet(id){
  const s = byId(Number(id));
  if (!s) return;
  S.open = s.id;
  const m = S.data.meta;
  const picks = (key, vals, cur) => vals.map(v =>
    `<button class="pick" data-${key}="${esc(v)}" data-v="${esc(v)}"
       aria-pressed="${v === cur}">${esc(v)}</button>`).join('');
  // Many-of, and the only difference in the markup is that nothing clears the
  // others when one is pressed. Setting and Genre are lists; the shelf is not.
  const many = (axis, cur) => ((m.words || {})[axis] || []).map(v =>
    `<button class="pick" data-many="${axis}" data-v="${esc(v)}"
       aria-pressed="${cur.includes(v)}">${esc(v)}</button>`).join('');

  $('#sheet').innerHTML = `
    <div class="sheet-top">
      ${s.coverId ? `<img class="thumb" src="/cover/${s.coverId}" alt="">`
                  : `<div class="thumb"></div>`}
      <h2>${esc(s.title)}</h2>
      <button class="ico" data-close aria-label="Close"><svg viewBox="0 0 24 24"><path d="M19 6.41 17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/></svg></button>
    </div>
    <div class="sheet-body">
      <div class="field" id="e-progress">${progressField(s, s.type)}</div>

      <div class="field">
        <span class="lbl">Rating</span>
        <div class="stars">
          <input type="range" id="e-rating" min="0" max="10" step="0.5"
                 value="${s.rating ?? 0}">
          <output id="e-rating-out">${s.rating === null ? '—' : esc(fmt(s.rating))}</output>
          <button class="pick" id="e-rating-clear">Clear</button>
        </div>
      </div>

      <div class="field">
        <span class="lbl">Shelf — where you are with it</span>
        <div class="picks">${picks('status', m.status, s.status)}</div>
      </div>

      <div class="field">
        <span class="lbl">Type</span>
        <div class="picks" id="e-types">${picks('type', typeNames(s.kind), s.type)}</div>
      </div>

      <div class="field">
        <span class="lbl">Publication status</span>
        <div class="picks">${picks('pub', m.pub, s.pub)}</div>
      </div>

      <div class="field">
        <span class="lbl">Setting — where it takes place</span>
        <div class="picks many" id="e-setting">${many('setting', s.setting)}</div>
      </div>

      <div class="field">
        <span class="lbl">Genre — what it feels like</span>
        <div class="picks many" id="e-genre">${many('genre', s.genre)}</div>
      </div>

      <div class="field">
        <span class="lbl">Cover image</span>
        <div class="pickbar">
          <input type="text" id="e-cover" value="${esc(s.cover)}" placeholder="https://… or search">
          <button class="btn" id="e-cover-find" title="Search the web for cover art">Find</button>
        </div>
      </div>

      <div class="field">
        <span class="lbl">Title</span>
        <input type="text" id="e-title" value="${esc(s.title)}">
      </div>

      <p class="meta">
        Added ${esc(ago(s.created))} · last changed ${esc(ago(s.updated))}<br>
        ${s.logCount ? `${s.logCount} change${s.logCount === 1 ? '' : 's'} recorded${
          s.lastRead ? `, most recently ${esc(ago(s.lastRead))}` : ''}`
          : 'No progress recorded yet'}
      </p>
    </div>
    <div class="sheet-foot">
      <button class="btn danger" data-trash>Remove</button>
      <button class="btn primary" data-save>Save</button>
    </div>`;

  $('#veil').classList.add('open');
  $('#sheet').classList.add('open');
  $('#sheet').setAttribute('aria-hidden', 'false');
  document.body.classList.add('locked');
  $('#sheet .sheet-body').scrollTop = 0;
}

function closeSheet(){
  S.open = null;
  $('#veil').classList.remove('open');
  $('#sheet').classList.remove('open');
  $('#sheet').setAttribute('aria-hidden', 'true');
  document.body.classList.remove('locked');
}

const pressed = sel => [...document.querySelectorAll(sel + ' .pick[aria-pressed=true]')]
  .map(b => b.dataset.v);

async function saveSheet(){
  const id = S.open;
  if (!id) return;
  const num = el => !el || el.value.trim() === '' ? null : Number(el.value);
  const watched = $('#e-progress [data-watched][aria-pressed=true]');
  const fields = {
    title:   $('#e-title').value.trim(),
    // A film's progress is a switch, and 1 is the only number behind it.
    chapter: watched ? (watched.dataset.watched === '1' ? 1 : null)
                     : num($('#e-chapter')),
    tome:    num($('#e-tome')),
    rating:  $('#e-rating-out').textContent === '—' ? null : Number($('#e-rating').value),
    status:  $('#sheet [data-status][aria-pressed=true]')?.dataset.status || '',
    pub:     $('#sheet [data-pub][aria-pressed=true]')?.dataset.pub || '',
    type:    $('#sheet [data-type][aria-pressed=true]')?.dataset.type || '',
    setting: pressed('#e-setting'),
    genre:   pressed('#e-genre'),
    cover:   $('#e-cover').value.trim(),
  };
  // Watching has no tome field at all, so sending null would clear a number
  // that is not on screen to be changed.
  if (S.kind !== 'Reading') delete fields.tome;
  try {
    const r = await api('/api/update', { id, fields });
    closeSheet();
    await load();
    toast(r.changed.length ? `Saved — ${r.changed.join(', ')}` : 'Nothing changed');
  } catch (e) { toast(e.message); }
}

/* ══ the cover picker ═════════════════════════════════════════════════
   The query is seeded the way Playnite seeds its own — the title, plus a word
   for what kind of thing it is, because "Solo Leveling" alone returns anime
   stills and "Solo Leveling manhwa cover" returns covers. It stays editable;
   the seed is a starting point, not a rule. */
const artState = { q:'', page:0, chosen:null };

function seedQuery(s){
  const kind = (s.type || '').toLowerCase().includes('novel') ? 'novel' : (s.type || '');
  return [s.title, kind, 'cover'].filter(Boolean).join(' ');
}

async function artSearch(reset){
  const box = $('#art-shots'), note = $('#art-note');
  if (reset){ artState.page = 0; box.innerHTML = ''; artState.chosen = null; }
  artState.q = $('#art-q').value.trim();
  if (!artState.q) return;
  note.textContent = 'Searching…';
  try {
    const r = await api(`/api/images?q=${encodeURIComponent(artState.q)}&p=${artState.page}`);
    const hits = r.results || [];
    box.insertAdjacentHTML('beforeend', hits.map(i => `
      <button class="shot" data-pick="${esc(i.url)}" title="${esc(i.host)}">
        <img src="/thumb?u=${encodeURIComponent(i.thumb)}" alt="" loading="lazy"
             onerror="this.closest('.shot').remove()">
        <em>${i.w}×${i.h}</em>
      </button>`).join(''));
    const n = box.children.length;
    note.textContent = n ? `${n} results — click one` : 'Nothing that looked like cover art.';
  } catch (e){ note.textContent = e.message; }
}

function openArt(){
  const s = byId(S.open);
  if (!s) return;
  // Reseeded from the series every time it opens. Carrying the last query over
  // would mean opening the picker on one book and searching for another.
  $('#art-q').value = seedQuery(s);
  $('#art').showModal();
  artSearch(true);
}

function closeArt(){ $('#art').close(); }

/* ══ actions ══════════════════════════════════════════════════════════ */
async function bump(id){
  const s = byId(Number(id));
  if (!s) return;
  const before = { chapter: s.chapter, status: s.status };
  const once = s.progress === 'once';
  try {
    const r = await api('/api/bump', { id: s.id, by: 1, resume: true });
    const now = r.series;
    S.data.series = S.data.series.map(x => x.id === now.id ? now : x);
    S.data.stats = r.stats;
    S.data.history = r.history;
    render();
    const moved = now.status !== before.status;
    // "chapter 1" on a film is the sentence that made this whole field wrong.
    const said = once ? 'watched'
      : `${(PROGRESS_LABEL[now.kind] || 'progress').toLowerCase()} ${fmt(now.chapter)}`;
    toast(`${now.title} — ${said}${moved ? ` · moved to ${now.status}` : ''}`,
      { label:'Undo', run: async () => {
          try { await api('/api/update', { id: s.id, fields: before }); await load();
                toast('Put back'); }
          catch (e) { toast(e.message); }
        }});
  } catch (e) { toast(e.message); }
}

/* ══ wiring ═══════════════════════════════════════════════════════════ */
document.addEventListener('click', async ev => {
  const hit = sel => ev.target.closest(sel);

  const door = hit('[data-door]');
  if (door) return goTo(door.dataset.door);

  const bumpBtn = hit('[data-bump]');
  if (bumpBtn){ ev.stopPropagation(); return bump(bumpBtn.dataset.bump); }

  const opener = hit('[data-open]');
  if (opener && opener.dataset.open) return openSheet(opener.dataset.open);

  const tab = hit('.tab');
  if (tab){ S.view = 'shelf'; S.shelf = tab.dataset.s; return render(); }

  if (ev.target.id === 'e-cover-find') return openArt();
  if (hit('[data-art-close]')) return closeArt();
  if (ev.target.id === 'art-go') return artSearch(true);
  if (ev.target.id === 'art-more'){ artState.page++; return artSearch(false); }

  const shot = hit('[data-pick]');
  if (shot){
    // Fill the field rather than saving outright: the picker chooses artwork,
    // Save commits the edit, same as every other field in the sheet.
    $('#e-cover').value = shot.dataset.pick;
    for (const el of document.querySelectorAll('.shot.on')) el.classList.remove('on');
    shot.classList.add('on');
    closeArt();
    toast('Cover chosen — Save to keep it');
    return;
  }

  if (hit('[data-close]') || ev.target.id === 'veil') return closeSheet();
  if (hit('[data-save]')) return saveSheet();

  if (ev.target.id === 'e-rating-clear'){
    // The slider still cannot express "unrated": 0 is a real score. So the
    // output element carries that state and Clear puts it back.
    $('#e-rating').value = 0;
    $('#e-rating-out').textContent = '—';
    return;
  }

  if (hit('[data-trash]')){
    const s = byId(S.open);
    if (!s) return;
    if (!confirm(`Remove “${s.title}” from the shelf?\n\nIts history goes with it. This cannot be undone.`)) return;
    try { const r = await api('/api/delete', { id: s.id });
          closeSheet();
          S.data = { series:r.series, stats:r.stats, meta:r.meta, history:r.history };
          fillPickers(); render();
          toast(`Removed “${r.title}”`); }
    catch (e) { toast(e.message); }
    return;
  }

  const step = hit('[data-step]');
  if (step){
    const el = $('#e-chapter');
    el.value = Math.max(0, (Number(el.value) || 0) + Number(step.dataset.step));
    return;
  }

  const tome = hit('[data-tome]');
  if (tome){
    const el = $('#e-tome');
    el.value = Math.max(0, (Number(el.value) || 0) + Number(tome.dataset.tome));
    return;
  }

  const watch = hit('[data-watched]');
  if (watch){
    for (const b of watch.closest('.switch').querySelectorAll('button'))
      b.setAttribute('aria-pressed', String(b === watch));
    return;
  }

  // Many-of: pressing one leaves the rest alone. That is the whole difference
  // between Setting and Shelf, and it is one line.
  const multi = hit('[data-many]');
  if (multi){
    multi.setAttribute('aria-pressed',
      multi.getAttribute('aria-pressed') === 'true' ? 'false' : 'true');
    return;
  }

  // Single-choice pill groups: pressing the pressed one clears the field.
  for (const key of ['status','pub','type']){
    const pill = hit(`[data-${key}]`);
    if (pill && pill.classList.contains('pick')){
      const was = pill.getAttribute('aria-pressed') === 'true';
      pill.closest('.picks').querySelectorAll('.pick')
        .forEach(x => x.setAttribute('aria-pressed', 'false'));
      pill.setAttribute('aria-pressed', was ? 'false' : 'true');
      // A Show has episodes and a Movie does not, so changing the type changes
      // what the progress control even is.
      if (key === 'type') drawProgress(was ? '' : pill.dataset.type);
      return;
    }
  }
});

document.addEventListener('input', ev => {
  if (ev.target.id === 'e-rating')
    $('#e-rating-out').textContent = fmt(Number(ev.target.value));
});

document.addEventListener('keydown', ev => {
  if (ev.key === 'Enter' && ev.target.closest('.sheet') &&
      ev.target.tagName === 'INPUT' && ev.target.type !== 'range'){
    ev.preventDefault(); return saveSheet();
  }
  if (ev.target.id === 'art-q' && ev.key === 'Enter'){
    ev.preventDefault(); return artSearch(true);
  }
  if (ev.key === 'Escape'){
    if ($('#art').open) return;      // the dialog closes itself
    if (S.open) closeSheet(); else hideToast();
  }
  if (ev.key === '/' && !/^(INPUT|TEXTAREA|SELECT)$/.test(ev.target.tagName)){
    ev.preventDefault(); $('#q').focus();
  }
});

$('#q').addEventListener('input', e => {
  S.q = e.target.value.trim();
  $('#q-clear').hidden = !S.q;
  if (S.view !== 'shelf') S.view = 'shelf';
  render();
});
$('#q-clear').addEventListener('click', () => {
  $('#q').value = ''; S.q = ''; $('#q-clear').hidden = true; render();
});

/* One delegated handler for both the header toolbar and the phone dock. */
document.addEventListener('click', ev => {
  const view = ev.target.closest('[data-view]');
  if (view){
    // Tapping the active view returns to the shelf, except from the shelf
    // itself — the dock's Shelf button should never toggle to nothing.
    const want = view.dataset.view;
    const next = (S.view === want && want !== 'shelf') ? 'shelf' : want;
    if (next !== 'shelf') clearFilters();
    S.view = next;
    scrollTo({ top: 0 });
    return render();
  }
  const act = ev.target.closest('[data-act]');
  if (!act) return;
  if (act.dataset.act === 'filter') $('#drawer').classList.toggle('open');
  if (act.dataset.act === 'new') $('#dlg').showModal();
  if (act.dataset.act === 'home') goTo(null);
});

for (const [id, key] of [['#f-type','type'],['#f-pub','pub'],['#f-sort','sort'],
                        ...AXES.map(a => ['#f-' + a, a])])
  $(id).addEventListener('change', e => {
    S[key] = e.target.value;
    if (S.view !== 'shelf') S.view = 'shelf';
    render();
  });
function clearFilters(){
  S.type = S.pub = ''; S.sort = 'updated';
  for (const a of AXES){ S[a] = ''; $('#f-' + a).value = ''; }
  $('#f-type').value = $('#f-pub').value = '';
  $('#f-sort').value = 'updated';
}
$('#f-clear').addEventListener('click', () => { clearFilters(); render(); });

$('#dlg-form').addEventListener('submit', async ev => {
  if (ev.submitter && ev.submitter.value !== 'ok') return;
  const title = $('#n-title').value.trim();
  if (!title) return;
  try {
    // The kind is not asked for. It is the door he is standing in.
    const r = await api('/api/create', { title, fields: {
      kind: S.kind, type: $('#n-type').value,
      status: $('#n-status').value } });
    $('#n-title').value = '';
    await load();
    openSheet(r.series.id);
    toast(`Added “${title}”`);
  } catch (e) { toast(e.message); }
});

/* Another tab, another device, or a phone left open on the shelf. Re-read when
   this one comes back into focus rather than showing a stale count. */
document.addEventListener('visibilitychange', () => {
  if (!document.hidden && !S.open) load();
});

/* The hash is the only thing that says which tracker is open, so Back is the
   way out of one and a reload lands where he left off. */
function goTo(kind){
  const want = kind ? '#' + slug(kind) : '#';
  if (location.hash === want) enter(kind);   // no hashchange fires for a no-op
  else location.hash = want;
}
addEventListener('hashchange', () => { if (S.data) enter(kindFromHash()); });

load();
</script>
</body>
